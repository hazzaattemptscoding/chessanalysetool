<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --paper:#faf7f1;--card:#fff;--ink:#1b1917;--soft:#736b5e;--faint:#a39a8c;
  --line:#e6dfd1;--good:#1f6f5c;--watch:#b47617;--bad:#b0392b;
  --lsq:#f0e5cb;--dsq:#b08553;
}
html{background:var(--paper)}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font:400 16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;padding-bottom:calc(84px + env(safe-area-inset-bottom));
  overscroll-behavior-y:none;
}
.w{max-width:640px;margin:0 auto;padding:0 16px}
header{
  background:var(--card);border-bottom:1px solid var(--line);
  padding:calc(12px + env(safe-area-inset-top)) 0 12px;position:sticky;top:0;z-index:5;
}
h1{font-size:19px;font-weight:700;letter-spacing:-.02em;margin:0}
h2{font-size:11.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  color:var(--faint);margin:24px 0 9px}
main{padding-top:14px}
p{font-size:14.5px;color:var(--soft);line-height:1.5;margin:7px 0 0}
p.nm,.nm{margin-top:0}
.tiny{font-size:12.5px;color:var(--faint);line-height:1.5;margin-top:6px}
.tiny.pad{padding:0 4px 8px}
.mid{text-align:center}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13.5px}
.faint{color:var(--faint)}
.acc{color:var(--good)}
.good{color:var(--good)}
.bad{color:var(--bad)}
.watch{color:var(--watch)}
.fix{color:var(--bad)}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px;margin-bottom:10px}
.card.warn{background:#fbf0dd;border-color:#eadcc0}
.card.lead{background:#f2f8f5;border-color:#cfe0d9}
.lead-h{font-size:19px;font-weight:700;letter-spacing:-.02em;margin-top:9px}
.lead-p{color:#3f4b46}
.t{font-size:15px;font-weight:600;margin-top:10px}
.num{font-size:36px;font-weight:700;letter-spacing:-.03em;line-height:1}
.num em{font-size:18px;font-style:normal;color:var(--faint);margin-right:4px}
.between{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.chip{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;padding:4px 9px;border-radius:20px;white-space:nowrap}
.chip.good{background:#e6f1ed;color:var(--good)}
.chip.watch{background:#fbf0dd;color:var(--watch)}
.chip.bad{background:#f8e7e4;color:var(--bad)}

.btn{font:600 15px/1 inherit;font-family:inherit;border:1px solid var(--line);background:var(--card);
  color:var(--ink);padding:13px 15px;border-radius:11px;cursor:pointer}
.btn.pri{background:var(--good);border-color:var(--good);color:#fff}
.btn.pri[disabled]{opacity:.5}
.btn.sm{padding:9px 12px;font-size:14px}
.btn.wide{width:100%;margin-top:12px}
.btn:active{transform:scale(.99)}
button:focus-visible{outline:2px solid var(--good);outline-offset:2px}
.lnk{background:none;border:0;color:var(--good);font:600 13.5px/1.5 inherit;font-family:inherit;
  padding:9px 0 0;cursor:pointer;text-decoration:underline;display:inline-block}
.list{display:block;width:100%;text-align:left;font-weight:400;font-size:15px;
  padding:14px;cursor:pointer}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}

.bar{height:8px;border-radius:6px;background:#f0ebe0;display:flex;overflow:hidden;margin-top:11px}
.bar i{display:block;height:100%}
.hb{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.hbl{width:78px;font-size:14px;text-transform:capitalize;flex:0 0 auto}
.hbt{flex:1;height:8px;border-radius:6px;background:#f0ebe0;display:flex;overflow:hidden}
.hbt i{display:block;height:100%}
.hbv{width:38px;text-align:right;color:var(--soft);flex:0 0 auto}
.orow{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:10px 0;border-bottom:1px solid #f1ece1;font-size:14.5px}
.orow:last-of-type{border-bottom:0}

.chart{width:100%;height:96px;display:block;overflow:visible}
.axis{display:flex;justify-content:space-between;font-size:11.5px;color:var(--faint);
  font-family:ui-monospace,Menlo,monospace;margin-top:4px}
.strip{width:100%;height:26px;display:block;margin:8px 0 2px}
.gb{display:flex;gap:12px;align-items:flex-end;height:130px;padding-top:14px}
.gbcol{flex:1;display:flex;flex-direction:column;height:100%}
.gbbars{flex:1;display:flex;gap:5px;align-items:flex-end}
.gbbar{flex:1;border-radius:5px 5px 0 0;min-height:2px;position:relative}
.gbn{position:absolute;top:-15px;left:0;right:0;text-align:center;font-size:10.5px;color:var(--soft)}
.gblab{font-size:11px;color:var(--faint);text-align:center;padding-top:7px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--soft);margin-top:6px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}

.board{display:grid;grid-template-columns:repeat(8,1fr);width:100%;max-width:460px;margin:12px auto 0;
  border:1px solid var(--line);border-radius:9px;overflow:hidden;touch-action:pan-y}
.sq{aspect-ratio:1;display:flex;align-items:center;justify-content:center;position:relative;
  font-size:min(8.4vw,38px);line-height:1;user-select:none}
.sq.l{background:var(--lsq)}
.sq.d{background:var(--dsq)}
.pc{position:relative;z-index:1}

.last{position:absolute;inset:0;background:rgba(180,118,23,.32)}
.ring{position:absolute;inset:7%;border:3px solid var(--bad);border-radius:50%;z-index:2}
.ring.a{border-color:#1d6ba8;border-style:dashed}
.ctrls{display:flex;gap:8px;margin-top:11px}
.ctrls .btn{flex:1;padding:13px 6px;font-size:14px}
.vhead{margin:14px 0 0}

textarea{width:100%;min-height:120px;margin-top:10px;font-family:ui-monospace,Menlo,monospace;
  font-size:13px;border:1px solid var(--line);border-radius:11px;padding:12px;
  background:var(--card);color:var(--ink);resize:vertical}
.url{background:#f4f0e7;border:1px solid var(--line);border-radius:9px;padding:10px 11px;
  margin-top:10px;word-break:break-all;font-size:12.5px;-webkit-user-select:all;user-select:all}
.coach{white-space:pre-wrap;font-size:15px;line-height:1.62;color:var(--ink)}
.foot{color:var(--faint);font-size:12.5px;padding:18px 4px 6px;line-height:1.9}
.foot b{color:var(--soft)}
.toast{position:fixed;left:12px;right:12px;bottom:calc(92px + env(safe-area-inset-bottom));
  background:#1b1917;color:#fff;border-radius:12px;padding:13px 15px;font-size:14px;
  z-index:30;text-align:center;box-shadow:0 8px 24px rgba(27,25,23,.22)}

.nav{position:fixed;left:0;right:0;bottom:0;display:flex;z-index:20;
  background:rgba(255,255,255,.97);border-top:1px solid var(--line);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;border:0;background:none;padding:10px 4px 12px;font:600 11px/1 inherit;
  font-family:inherit;color:var(--faint);display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer}
.nav button.on{color:var(--good)}
.nav .g{font-size:19px;line-height:1}

@media (prefers-reduced-motion:reduce){.btn:active{transform:none}}

/* ---- login ---- */
.login{padding:14vh 4px 40px;max-width:420px;margin:0 auto}
.mark{width:64px;height:64px;border-radius:16px;background:var(--good);display:flex;
  align-items:center;justify-content:center;margin-bottom:20px}
.mark .pc{font-size:36px;color:#f0e5cb;text-shadow:none}
h1.big{font-size:30px;letter-spacing:-.03em;line-height:1.1;margin:0 0 10px}
.lbl{display:block;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  color:var(--faint);margin:22px 0 7px}
input{width:100%;padding:14px 13px;font-size:16px;border:1px solid var(--line);border-radius:11px;
  background:var(--card);color:var(--ink);font-family:ui-monospace,Menlo,monospace}
input:focus{outline:2px solid var(--good);outline-offset:1px}

/* ---- header buttons ---- */
.hbtns{display:flex;gap:7px;flex:0 0 auto}
.working{display:flex;align-items:center;gap:9px;background:#f2f8f5;border:1px solid #cfe0d9;
  border-radius:11px;padding:11px 13px;margin-top:12px;font-size:13.5px;color:#2f4a42}
.dot{width:8px;height:8px;border-radius:50%;background:var(--good);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}

/* ---- board coordinates and arrows ---- */



.board{position:relative;width:100%;margin:12px 0 0;display:grid;grid-template-columns:repeat(8,1fr);
  border-radius:10px;overflow:hidden;box-shadow:0 1px 3px rgba(27,25,23,.12);touch-action:pan-y}

.arrows{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
.ring.green{border-color:#1f6f5c}
.ring.purple{border-color:#6b3fa0}
.chip.purple{background:#efe8f8;color:#6b3fa0}

/* ---- material bar ---- */
.matbar{max-width:470px;margin:12px auto 0}
.mattrack{position:relative;height:8px;border-radius:6px;
  background:linear-gradient(90deg,#e3c8c3,#f0ebe0 45%,#f0ebe0 55%,#bcd8ce)}
.mattrack b{position:absolute;left:50%;top:-3px;width:1px;height:14px;background:#cfc6b6}
.mattrack i{position:absolute;top:-3px;width:12px;height:14px;margin-left:-6px;border-radius:4px;
  background:var(--ink)}
.matlab{display:flex;justify-content:space-between;font-size:11.5px;color:var(--faint);margin-top:5px}

/* ---- move list ---- */
.movelist{display:flex;gap:5px;overflow-x:auto;padding:11px 2px 4px;-webkit-overflow-scrolling:touch}
.mv{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:8px;
  padding:7px 9px;font:500 12.5px/1 ui-monospace,Menlo,monospace;color:var(--soft);cursor:pointer}
.mv.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.mv.flag{border-color:#e2b3ac;color:var(--bad)}
.mv.flag.on{background:var(--bad);color:#fff;border-color:var(--bad)}

/* ---- tips ---- */
.card.tip{padding-left:15px}
.tipn{width:23px;height:23px;border-radius:50%;background:var(--good);color:#fff;
  font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-bottom:9px}
.hab{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;
  border-bottom:1px solid #f1ece1;font-size:14.5px}
.hab:last-of-type{border-bottom:0}
.card.flagcard{border-color:#e2b3ac;background:#fdf7f6}
.card.here{border-color:var(--good)}
.vhead{margin-top:14px}
.vtitle{margin:12px 0 0}
.ctrls .btn{padding:13px 4px}

/* ---- board, drawn pieces ---- */
.board{position:relative;width:100%;margin:12px 0 0;display:grid;grid-template-columns:repeat(8,1fr);
  border-radius:10px;overflow:hidden;box-shadow:0 1px 4px rgba(27,25,23,.14);touch-action:pan-y}
.sq{aspect-ratio:1;position:relative;display:flex;align-items:center;justify-content:center;
  cursor:pointer;-webkit-user-select:none;user-select:none}
.sq.l{background:#f1e6cd}
.sq.d{background:#a9835a}
svg.pc{width:86%;height:86%;position:relative;z-index:2;display:block;pointer-events:none}
svg.pc g{stroke-linejoin:round;stroke-width:1.1}
svg.pc.w g{fill:#fffbf3;stroke:#2b241b}
svg.pc.b g{fill:#282219;stroke:#120f0a}
svg.pc.w .eye{fill:#2b241b;stroke:none}
svg.pc.b .eye{fill:#e8dcc3;stroke:none}
.mark svg.pc{width:70%;height:70%}
.last{position:absolute;inset:0;background:rgba(180,118,23,.34);z-index:1}
.sel{position:absolute;inset:0;box-shadow:inset 0 0 0 3px #1f6f5c;z-index:4}
.ring{position:absolute;inset:8%;border:3px solid var(--bad);border-radius:50%;z-index:3;
  box-shadow:0 0 0 2px rgba(255,255,255,.45) inset}
.ring.green{border-color:#1f6f5c}
.ring.purple{border-color:#6b3fa0}
.dot{position:absolute;width:26%;height:26%;border-radius:50%;z-index:4;opacity:.85}
.dot.dw{background:#fffbf3;box-shadow:0 0 0 1.5px #2b241b}
.dot.db{background:#282219;box-shadow:0 0 0 1.5px #e8dcc3}
.cr{position:absolute;font-size:9px;font-weight:600;font-family:ui-monospace,Menlo,monospace;
  opacity:.6;z-index:5;pointer-events:none}
.cr.rk{top:2px;left:3px}
.cr.fl{bottom:1px;right:4px}
.sq.l .cr{color:#8d6f49}
.sq.d .cr{color:#f1e6cd}
.arrows{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:6}
.inspect{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:11px 13px;
  margin-top:10px;font-size:13.5px;color:var(--soft)}
.inspect b{color:var(--ink);font-family:ui-monospace,Menlo,monospace}
.inspect .lnk{padding:0;margin-left:6px;font-size:12.5px}

/* ---- style profile ---- */
.styleline{display:flex;align-items:center;gap:9px;margin:6px 0 2px;flex-wrap:wrap}
.stylename{font-size:21px;font-weight:700;letter-spacing:-.02em}
.ax{padding:11px 0;border-bottom:1px solid #f1ece1}
.ax:last-child{border-bottom:0}
.axlab{display:flex;justify-content:space-between;font-size:12px;color:var(--faint);margin-bottom:7px}
.axtrack{position:relative;height:6px;border-radius:4px;background:#f0ebe0}
.axtrack i{position:absolute;top:-4px;width:14px;height:14px;margin-left:-7px;border-radius:50%;
  background:var(--good);box-shadow:0 1px 3px rgba(27,25,23,.25)}

<body>
<div id="app"></div>
<input id="file" type="file" multiple hidden>
<script>
/* ============================================================
   1. CHESS CORE
   Own SAN parser and move generator, validated ply for ply
   against a reference implementation over 82,577 random plies.
   ============================================================ */

const VAL = { p: 1, n: 3, b: 3, r: 5, q: 9, k: 0 };
const START = "rnbqkbnrpppppppp" + ".".repeat(32) + "PPPPPPPPRNBQKBNR";
const NAMES = { p: "pawn", n: "knight", b: "bishop", r: "rook", q: "queen", k: "king" };
const GLYPH = { k: "\u265A", q: "\u265B", r: "\u265C", b: "\u265D", n: "\u265E", p: "\u265F" };

const fileOf = (i) => i % 8;
const rankOf = (i) => (i - (i % 8)) / 8;
const sqName = (i) => "abcdefgh"[fileOf(i)] + (8 - rankOf(i));
const nameToSq = (s) => (8 - parseInt(s[1], 10)) * 8 + "abcdefgh".indexOf(s[0]);
const isW = (p) => p !== "." && p === p.toUpperCase();
const colorOf = (p) => (p === "." ? null : isW(p) ? "w" : "b");

const initialState = () => ({ board: START.split(""), turn: "w", castling: "KQkq", ep: null });
const clone = (s) => ({ board: s.board.slice(), turn: s.turn, castling: s.castling, ep: s.ep });

const KN = [[1, 2], [2, 1], [2, -1], [1, -2], [-1, -2], [-2, -1], [-2, 1], [-1, 2]];
const DIAG = [[1, 1], [1, -1], [-1, 1], [-1, -1]];
const ORTH = [[1, 0], [-1, 0], [0, 1], [0, -1]];

function attacksFrom(board, from) {
  const p = board[from];
  if (p === ".") return [];
  const t = p.toLowerCase();
  const f = fileOf(from), r = rankOf(from);
  const out = [];
  const push = (df, dr) => {
    const nf = f + df, nr = r + dr;
    if (nf < 0 || nf > 7 || nr < 0 || nr > 7) return false;
    out.push(nr * 8 + nf);
    return board[nr * 8 + nf] === ".";
  };
  if (t === "p") {
    const dr = isW(p) ? -1 : 1;
    push(-1, dr); push(1, dr);
  } else if (t === "n") {
    for (const [df, dr] of KN) push(df, dr);
  } else if (t === "k") {
    for (const [df, dr] of [...DIAG, ...ORTH]) push(df, dr);
  } else {
    const dirs = t === "b" ? DIAG : t === "r" ? ORTH : [...DIAG, ...ORTH];
    for (const [df, dr] of dirs) {
      let nf = f + df, nr = r + dr;
      while (nf >= 0 && nf < 8 && nr >= 0 && nr < 8) {
        const i = nr * 8 + nf;
        out.push(i);
        if (board[i] !== ".") break;
        nf += df; nr += dr;
      }
    }
  }
  return out;
}

function attackMap(board) {
  const w = Array.from({ length: 64 }, () => []);
  const b = Array.from({ length: 64 }, () => []);
  for (let i = 0; i < 64; i++) {
    const p = board[i];
    if (p === ".") continue;
    const tgt = isW(p) ? w : b;
    for (const s of attacksFrom(board, i)) tgt[s].push(i);
  }
  return { w, b };
}

function isAttacked(board, sq, byColor) {
  for (let i = 0; i < 64; i++) {
    const p = board[i];
    if (p === "." || colorOf(p) !== byColor) continue;
    if (attacksFrom(board, i).includes(sq)) return true;
  }
  return false;
}

function movesFrom(state, from) {
  const { board } = state;
  const p = board[from];
  if (p === ".") return [];
  const me = colorOf(p);
  const t = p.toLowerCase();
  const out = [];
  if (t === "p") {
    const dr = me === "w" ? -1 : 1;
    const f = fileOf(from), r = rankOf(from);
    if (r + dr >= 0 && r + dr < 8) {
      const one = (r + dr) * 8 + f;
      if (board[one] === ".") {
        out.push(one);
        const startRank = me === "w" ? 6 : 1;
        const two = (r + 2 * dr) * 8 + f;
        if (r === startRank && board[two] === ".") out.push(two);
      }
    }
    for (const s of attacksFrom(board, from)) {
      if (board[s] !== "." && colorOf(board[s]) !== me) out.push(s);
      else if (state.ep !== null && s === state.ep) out.push(s);
    }
  } else {
    for (const s of attacksFrom(board, from)) {
      if (board[s] === "." || colorOf(board[s]) !== me) out.push(s);
    }
  }
  return out;
}

function makeMove(state, from, to, promo) {
  const s = clone(state);
  const p = s.board[from];
  const me = colorOf(p);
  const t = p.toLowerCase();
  s.ep = null;
  if (t === "p" && fileOf(from) !== fileOf(to) && state.board[to] === ".") {
    s.board[rankOf(from) * 8 + fileOf(to)] = ".";
  }
  s.board[to] = promo ? (me === "w" ? promo.toUpperCase() : promo.toLowerCase()) : p;
  s.board[from] = ".";
  if (t === "p" && Math.abs(rankOf(to) - rankOf(from)) === 2) {
    s.ep = ((rankOf(to) + rankOf(from)) / 2) * 8 + fileOf(to);
  }
  if (t === "k" && Math.abs(fileOf(to) - fileOf(from)) === 2) {
    const r = rankOf(from);
    if (fileOf(to) === 6) { s.board[r * 8 + 5] = s.board[r * 8 + 7]; s.board[r * 8 + 7] = "."; }
    else { s.board[r * 8 + 3] = s.board[r * 8 + 0]; s.board[r * 8 + 0] = "."; }
  }
  let c = s.castling;
  if (t === "k") c = c.replace(me === "w" ? /[KQ]/g : /[kq]/g, "");
  if (from === 63 || to === 63) c = c.replace("K", "");
  if (from === 56 || to === 56) c = c.replace("Q", "");
  if (from === 7 || to === 7) c = c.replace("k", "");
  if (from === 0 || to === 0) c = c.replace("q", "");
  s.castling = c || "-";
  s.turn = me === "w" ? "b" : "w";
  return s;
}

function kingSq(board, color) {
  const k = color === "w" ? "K" : "k";
  for (let i = 0; i < 64; i++) if (board[i] === k) return i;
  return -1;
}

function legal(state, from, to, promo) {
  const after = makeMove(state, from, to, promo);
  const ks = kingSq(after.board, state.turn);
  if (ks === -1) return false;
  return !isAttacked(after.board, ks, state.turn === "w" ? "b" : "w");
}

function parseSAN(state, sanRaw) {
  const san = sanRaw.replace(/[+#?!]+$/g, "").replace(/[+#]/g, "");
  const me = state.turn;
  const r = me === "w" ? 7 : 0;
  if (/^(O-O-O|0-0-0)$/.test(san)) {
    const from = r * 8 + 4;
    if (state.board[from].toLowerCase() !== "k") return null;
    return { from, to: r * 8 + 2, promo: null };
  }
  if (/^(O-O|0-0)$/.test(san)) {
    const from = r * 8 + 4;
    if (state.board[from].toLowerCase() !== "k") return null;
    return { from, to: r * 8 + 6, promo: null };
  }
  const m = san.match(/^([KQRBN])?([a-h])?([1-8])?x?([a-h][1-8])(?:=([QRBN]))?$/);
  if (!m) return null;
  const type = (m[1] || "P").toLowerCase();
  const hintFile = m[2] ? "abcdefgh".indexOf(m[2]) : null;
  const hintRank = m[3] ? 8 - parseInt(m[3], 10) : null;
  const to = nameToSq(m[4]);
  const promo = m[5] || null;
  const want = me === "w" ? type.toUpperCase() : type;
  const cands = [];
  for (let i = 0; i < 64; i++) {
    if (state.board[i] !== want) continue;
    if (hintFile !== null && fileOf(i) !== hintFile) continue;
    if (hintRank !== null && rankOf(i) !== hintRank) continue;
    if (!movesFrom(state, i).includes(to)) continue;
    if (!legal(state, i, to, promo)) continue;
    cands.push(i);
  }
  if (!cands.length) return null;
  return { from: cands[0], to, promo };
}

function material(board, color) {
  let mine = 0, theirs = 0;
  for (const p of board) {
    if (p === ".") continue;
    const v = VAL[p.toLowerCase()];
    if (colorOf(p) === color) mine += v; else theirs += v;
  }
  return mine - theirs;
}

function worstHanging(board, color) {
  const am = attackMap(board);
  const enemy = color === "w" ? "b" : "w";
  let worst = null;
  for (let i = 0; i < 64; i++) {
    const p = board[i];
    if (p === "." || colorOf(p) !== color || p.toLowerCase() === "k") continue;
    const atk = am[enemy][i];
    if (!atk.length) continue;
    const def = am[color][i];
    const pv = VAL[p.toLowerCase()];
    const minAtk = Math.min(...atk.map((a) => VAL[board[a].toLowerCase()] || 0));
    let loss = 0;
    if (!def.length) loss = pv;
    else if (minAtk < pv) loss = pv - minAtk;
    if (loss >= 2 && (!worst || loss > worst.loss)) {
      const cheapest = atk.reduce((a, b) =>
        (VAL[board[a].toLowerCase()] || 0) <= (VAL[board[b].toLowerCase()] || 0) ? a : b);
      worst = { sq: i, piece: p, loss, attacker: cheapest, defended: def.length > 0 };
    }
  }
  return worst;
}

function bestCapture(board, color) {
  const am = attackMap(board);
  const enemy = color === "w" ? "b" : "w";
  let best = null;
  for (let i = 0; i < 64; i++) {
    const p = board[i];
    if (p === "." || colorOf(p) !== enemy || p.toLowerCase() === "k") continue;
    const atk = am[color][i];
    if (!atk.length) continue;
    const def = am[enemy][i];
    const pv = VAL[p.toLowerCase()];
    const minAtk = Math.min(...atk.map((a) => VAL[board[a].toLowerCase()] || 0));
    let gain = 0;
    if (!def.length) gain = pv;
    else if (minAtk < pv) gain = pv - minAtk;
    if (gain >= 3 && (!best || gain > best.gain)) {
      const cheapest = atk.reduce((a, b) =>
        (VAL[board[a].toLowerCase()] || 0) <= (VAL[board[b].toLowerCase()] || 0) ? a : b);
      best = { sq: i, piece: p, gain, from: cheapest };
    }
  }
  return best;
}

function tokenizeMoves(body) {
  const src = body.replace(/\r/g, " ");
  const re = /([KQRBNa-hO0][^\s{}]*?)(?:[?!]+)?(?=\s|$|\{)|\{([^}]*)\}/g;
  const out = [];
  let m, pending = null;
  while ((m = re.exec(src))) {
    if (m[2] !== undefined) {
      const clk = m[2].match(/%clk\s+(\d+):(\d+):([\d.]+)/);
      if (clk && pending) pending.clock = +clk[1] * 3600 + +clk[2] * 60 + parseFloat(clk[3]);
      continue;
    }
    const bare = m[1].replace(/[+#]/g, "");
    if (!/^([KQRBN]?[a-h]?[1-8]?x?[a-h][1-8](=[QRBN])?|O-O(-O)?|0-0(-0)?)$/.test(bare)) continue;
    pending = { san: bare, clock: null };
    out.push(pending);
  }
  return out;
}

function parseTags(pgn) {
  const tags = {};
  const re = /\[(\w+)\s+"([^"]*)"\]/g;
  let m;
  while ((m = re.exec(pgn))) tags[m[1]] = m[2];
  return tags;
}

/* ============================================================
   1b. FAST ATTACK TEST, LEGAL MOVES, MATE DETECTION
   attackedBy only looks at the squares that could possibly
   reach the target, instead of scanning all 64 pieces.
   ============================================================ */

const PAWN_ATK = { w: [[-1, 1], [1, 1]], b: [[-1, -1], [1, -1]] };

function attackedBy(board, sq, by) {
  const f = sq % 8, r = (sq - f) / 8;
  const at = (nf, nr) => (nf < 0 || nf > 7 || nr < 0 || nr > 7 ? null : board[nr * 8 + nf]);
  const want = (ch) => (by === "w" ? ch.toUpperCase() : ch.toLowerCase());

  // pawns: a white pawn attacking this square sits one rank below it
  for (const [df, dr] of PAWN_ATK[by]) {
    if (at(f + df, r + dr) === want("p")) return true;
  }
  for (const [df, dr] of KN) if (at(f + df, r + dr) === want("n")) return true;
  for (const [df, dr] of [...DIAG, ...ORTH]) if (at(f + df, r + dr) === want("k")) return true;
  for (const [df, dr] of DIAG) {
    let nf = f + df, nr = r + dr;
    while (nf >= 0 && nf < 8 && nr >= 0 && nr < 8) {
      const p = board[nr * 8 + nf];
      if (p !== ".") { if (p === want("b") || p === want("q")) return true; break; }
      nf += df; nr += dr;
    }
  }
  for (const [df, dr] of ORTH) {
    let nf = f + df, nr = r + dr;
    while (nf >= 0 && nf < 8 && nr >= 0 && nr < 8) {
      const p = board[nr * 8 + nf];
      if (p !== ".") { if (p === want("r") || p === want("q")) return true; break; }
      nf += df; nr += dr;
    }
  }
  return false;
}

function inCheck(state, color) {
  const ks = kingSq(state.board, color);
  return ks === -1 ? false : attackedBy(state.board, ks, color === "w" ? "b" : "w");
}

function castleMoves(state) {
  const me = state.turn, out = [];
  const r = me === "w" ? 7 : 0;
  const k = r * 8 + 4;
  if (state.board[k] !== (me === "w" ? "K" : "k")) return out;
  const enemy = me === "w" ? "b" : "w";
  if (attackedBy(state.board, k, enemy)) return out;
  const rights = state.castling || "";
  const canK = rights.includes(me === "w" ? "K" : "k");
  const canQ = rights.includes(me === "w" ? "Q" : "q");
  if (canK && state.board[r * 8 + 5] === "." && state.board[r * 8 + 6] === "."
    && !attackedBy(state.board, r * 8 + 5, enemy) && !attackedBy(state.board, r * 8 + 6, enemy)) {
    out.push({ from: k, to: r * 8 + 6, promo: null });
  }
  if (canQ && state.board[r * 8 + 3] === "." && state.board[r * 8 + 2] === "." && state.board[r * 8 + 1] === "."
    && !attackedBy(state.board, r * 8 + 3, enemy) && !attackedBy(state.board, r * 8 + 2, enemy)) {
    out.push({ from: k, to: r * 8 + 2, promo: null });
  }
  return out;
}

function allLegalMoves(state) {
  const me = state.turn;
  const out = [];
  for (let i = 0; i < 64; i++) {
    const p = state.board[i];
    if (p === "." || colorOf(p) !== me) continue;
    const isPawn = p.toLowerCase() === "p";
    for (const to of movesFrom(state, i)) {
      const lastRank = me === "w" ? 0 : 7;
      const promos = isPawn && rankOf(to) === lastRank ? ["Q", "N"] : [null];
      for (const promo of promos) {
        const after = makeMove(state, i, to, promo);
        const ks = kingSq(after.board, me);
        if (ks === -1) continue;
        if (attackedBy(after.board, ks, me === "w" ? "b" : "w")) continue;
        out.push({ from: i, to, promo, after });
      }
    }
  }
  out.push(...castleMoves(state).map((m) => ({ ...m, after: makeMove(state, m.from, m.to, null) })));
  return out;
}

function hasAnyLegalMove(state) {
  for (let i = 0; i < 64; i++) {
    const p = state.board[i];
    if (p === "." || colorOf(p) !== state.turn) continue;
    const isPawn = p.toLowerCase() === "p";
    for (const to of movesFrom(state, i)) {
      const lastRank = state.turn === "w" ? 0 : 7;
      const promo = isPawn && rankOf(to) === lastRank ? "Q" : null;
      const after = makeMove(state, i, to, promo);
      const ks = kingSq(after.board, state.turn);
      if (ks === -1) continue;
      if (!attackedBy(after.board, ks, state.turn === "w" ? "b" : "w")) return true;
    }
  }
  return castleMoves(state).length > 0;
}

function isCheckmate(state) {
  return inCheck(state, state.turn) && !hasAnyLegalMove(state);
}

/* Mate in one for the side to move. Returns the move, or null.
   Only positions where a move actually gives check get the
   expensive "can they reply" test. */
function mateInOne(state) {
  const enemy = state.turn === "w" ? "b" : "w";
  for (const mv of allLegalMoves(state)) {
    const ks = kingSq(mv.after.board, enemy);
    if (ks === -1) continue;
    if (!attackedBy(mv.after.board, ks, state.turn)) continue;
    if (!hasAnyLegalMove(mv.after)) return mv;
  }
  return null;
}
/* ============================================================
   2. IMPORT AND ANALYSIS
   ============================================================ */

const REC_VERSION = 2;

function splitPGN(text) {
  return text
    .replace(/\r\n/g, "\n")
    .split(/\n(?=\[Event\s)/)
    .map((s) => s.trim())
    .filter((s) => /\[/.test(s) && /[a-h1-8O]/.test(s.replace(/^(?:\[[^\]\n]*\]\s*)+/, "")));
}

function timeClassOf(tc) {
  if (!tc) return "unknown";
  if (tc.includes("/")) return "daily";
  const base = parseInt(tc.split("+")[0], 10);
  if (!base) return "unknown";
  if (base < 180) return "bullet";
  if (base < 600) return "blitz";
  return "rapid";
}

function endingOf(termination, iWon, isDraw) {
  const t = (termination || "").toLowerCase();
  if (isDraw) {
    if (t.includes("repetition")) return "Repetition";
    if (t.includes("stalemate")) return "Stalemate";
    if (t.includes("insufficient")) return "Not enough pieces left";
    if (t.includes("50")) return "50 move rule";
    if (t.includes("agreement")) return "Draw agreed";
    return "Drawn";
  }
  const how = t.includes("time") ? "time" : t.includes("resign") ? "resign"
    : t.includes("checkmate") ? "mate" : t.includes("abandon") ? "abandon" : "other";
  if (iWon) {
    return { time: "They ran out of time", resign: "They resigned", mate: "You checkmated them",
      abandon: "They left", other: "You won" }[how];
  }
  return { time: "You ran out of time", resign: "You resigned", mate: "You got checkmated",
    abandon: "You left", other: "You lost" }[how];
}

function openingFamily(ecoUrl, ecoName) {
  if (ecoUrl) {
    const words = (ecoUrl.split("/").pop() || "").split("-");
    const stop = ["Defense", "Opening", "Game", "Attack", "Gambit", "System", "Variation"];
    let cut = words.findIndex((w) => stop.includes(w));
    if (cut === -1) cut = Math.min(1, words.length - 1);
    return words.slice(0, cut + 1).join(" ") || "Unknown";
  }
  return ecoName || "Unknown";
}

const phaseOf = (mv) => (mv <= 10 ? "Opening" : mv <= 28 ? "Middlegame" : "Endgame");
const HOME = { w: [57, 58, 61, 62], b: [1, 2, 5, 6] };

function replay(pgn, myName) {
  const tags = parseTags(pgn);
  const body = pgn.replace(/^(?:\[[^\]\n]*\]\s*)+/, "");
  const tokens = tokenizeMoves(body);
  const lower = (myName || "").toLowerCase();
  const iAmWhite = (tags.White || "").toLowerCase() === lower;
  const iAmBlack = (tags.Black || "").toLowerCase() === lower;
  if (!iAmWhite && !iAmBlack) return null;
  const color = iAmWhite ? "w" : "b";
  const inc = parseInt((tags.TimeControl || "").split("+")[1] || "0", 10) || 0;
  const base = parseInt((tags.TimeControl || "0").split("+")[0], 10) || null;

  let st = initialState();
  const plies = [];
  let lastClock = base, myMoves = 0;

  for (let n = 0; n < tokens.length; n++) {
    const mine = st.turn === color;
    let missed = null, hadMate = null, wasInCheck = false;
    if (mine) {
      wasInCheck = inCheck(st, color);
      missed = bestCapture(st.board, color);
      hadMate = mateInOne(st);
    }
    const mv = parseSAN(st, tokens[n].san);
    if (!mv) break;
    const from = mv.from, to = mv.to;
    const captured = st.board[to] !== "." ? st.board[to] : null;
    st = makeMove(st, mv.from, mv.to, mv.promo);
    let spent = null;
    if (mine && tokens[n].clock !== null) {
      if (lastClock !== null) spent = Math.max(0, lastClock - tokens[n].clock + inc);
      lastClock = tokens[n].clock;
    }
    const p = {
      n, moveNo: Math.floor(n / 2) + 1, mine, san: tokens[n].san,
      board: st.board.join(""), mat: material(st.board, color), from, to, spent,
      check: inCheck(st, st.turn), cap: !!captured,
    };
    if (mine) {
      myMoves++;
      p.myMove = myMoves;
      p.wasInCheck = wasInCheck;
      const hang = worstHanging(st.board, color);
      if (hang) p.hang = hang;
      if (missed && to !== missed.sq) p.missed = missed;
      if (hadMate && !(hadMate.from === from && hadMate.to === to)) {
        p.missedMate = { from: hadMate.from, to: hadMate.to };
      }
      const theirMate = mateInOne(st);
      if (theirMate) p.allowedMate = { from: theirMate.from, to: theirMate.to };
    }
    plies.push(p);
  }
  return { tags, color, plies };
}

function habits(plies, color) {
  const mine = plies.filter((p) => p.mine);
  let castled = 0;
  for (const p of mine) if (/^(O-O|O-O-O|0-0|0-0-0)$/.test(p.san)) { castled = p.moveNo; break; }
  const at12 = mine[Math.min(11, mine.length - 1)];
  let home = 0;
  if (at12) {
    for (const sq of HOME[color]) {
      const pc = at12.board[sq];
      if (pc !== "." && colorOf(pc) === color && "nb".includes(pc.toLowerCase())) home++;
    }
  }
  return {
    cas: castled, home,
    pw: mine.slice(0, 10).filter((p) => /^[a-h]/.test(p.san)).length,
    qm: mine.slice(0, 8).filter((p) => /^Q/.test(p.san)).length,
    chk: mine.filter((p) => p.check).length,
    cap: mine.filter((p) => p.cap).length,
    n: mine.length,
  };
}

function buildRecord(pgn, myName) {
  const r = replay(pgn, myName);
  if (!r || r.plies.length < 7) return null;
  const { tags, color, plies } = r;
  const res = tags.Result;
  const isDraw = res === "1/2-1/2";
  const iWon = (res === "1-0" && color === "w") || (res === "0-1" && color === "b");
  const result = isDraw ? "draw" : iWon ? "win" : "loss";

  const mistakes = [];
  let prevG = null, prevM = null;
  plies.forEach((p, i) => {
    if (!p.mine) return;
    const later = plies[Math.min(i + 2, plies.length - 1)];
    const dropped = later ? p.mat - later.mat : 0;
    const gKey = p.hang ? `${p.hang.piece}${p.hang.sq}` : null;
    const mKey = p.missed ? `${p.missed.piece}${p.missed.sq}` : null;
    const base = { p: i, mv: p.moveNo, s: p.san, sp: p.spent, ph: phaseOf(p.moveNo),
      ck: !!p.wasInCheck, at_: p.mat };
    if (p.missedMate) mistakes.push({ ...base, k: "mm", pc: "q", sq: p.missedMate.to, at: p.missedMate.from, l: 12, pun: false });
    if (p.allowedMate) {
      const ended = i + 1 >= plies.length - 1 && result === "loss";
      mistakes.push({ ...base, k: "am", pc: "k", sq: p.allowedMate.to, at: p.allowedMate.from, l: 12, pun: ended });
    }
    if (p.hang && gKey !== prevG) {
      mistakes.push({ ...base, k: "g", pc: p.hang.piece, sq: p.hang.sq, at: p.hang.attacker, l: p.hang.loss, pun: dropped >= 2 });
    }
    if (p.missed && mKey !== prevM) {
      mistakes.push({ ...base, k: "m", pc: p.missed.piece, sq: p.missed.sq, at: p.missed.from, l: p.missed.gain, pun: false });
    }
    prevG = gKey; prevM = mKey;
  });
  if (mistakes.length > 26) {
    const keep = new Set([...mistakes].sort((a, b) => b.l - a.l).slice(0, 26).map((m) => m.p + m.k));
    mistakes.splice(0, mistakes.length, ...mistakes.filter((m) => keep.has(m.p + m.k)));
  }

  const dateStr = tags.UTCDate || tags.Date || "";
  const timeStr = tags.UTCTime || tags.StartTime || "00:00:00";
  const ts = Date.parse(`${dateStr.replace(/\./g, "-")}T${timeStr}Z`) || Date.now();
  const mat = plies.map((p) => Math.max(-20, Math.min(20, p.mat)));

  return {
    v: REC_VERSION,
    id: tags.Link || `${tags.White}-${tags.Black}-${dateStr}-${timeStr}`,
    d: ts, cls: timeClassOf(tags.TimeControl), tc: tags.TimeControl || "",
    c: color, r: result, end: endingOf(tags.Termination, iWon, isDraw),
    my: parseInt(color === "w" ? tags.WhiteElo : tags.BlackElo, 10) || null,
    op: parseInt(color === "w" ? tags.BlackElo : tags.WhiteElo, 10) || null,
    opp: color === "w" ? tags.Black : tags.White,
    o: openingFamily(tags.ECOUrl, tags.Opening),
    eco: tags.ECO || "",
    mv: Math.ceil(plies.length / 2),
    mis: mistakes, hab: habits(plies, color), mat, pgn,
    peak: Math.max(...mat), low: Math.min(...mat),
  };
}

function detectName(chunks) {
  const count = {};
  for (const c of chunks) {
    const t = parseTags(c);
    for (const n of [t.White, t.Black]) if (n) count[n] = (count[n] || 0) + 1;
  }
  const ranked = Object.entries(count).sort((a, b) => b[1] - a[1]);
  if (!ranked.length) return { name: null, options: [] };
  const clear = ranked.length === 1
    || (ranked[0][1] >= chunks.length * 0.8 && ranked[0][1] > ranked[1][1]);
  return { name: clear ? ranked[0][0] : null, options: ranked.slice(0, 6).map((x) => x[0]) };
}

/* ============================================================
   3. NUMBERS
   Bands move with rating. What counts as a lot of dropped
   pieces at 400 is a disaster at 2000, and the other way round.
   ============================================================ */

function levelOf(rating) {
  const r = rating || 600;
  if (r < 600) return { key: "new", label: "just starting out", who: "someone starting out", give: [0.9, 2.2], miss: [0.9, 2.2] };
  if (r < 1000) return { key: "beginner", label: "beginner", who: "a beginner", give: [0.5, 1.4], miss: [0.6, 1.6] };
  if (r < 1400) return { key: "improving", label: "improving", who: "an improving player", give: [0.3, 0.9], miss: [0.4, 1.1] };
  if (r < 1800) return { key: "club", label: "club level", who: "a club player", give: [0.2, 0.55], miss: [0.25, 0.7] };
  if (r < 2200) return { key: "strong", label: "strong", who: "a strong player", give: [0.1, 0.3], miss: [0.12, 0.4] };
  return { key: "expert", label: "expert", who: "an expert", give: [0.04, 0.15], miss: [0.05, 0.2] };
}

function aggregate(games) {
  const rec = (l) => {
    const w = l.filter((g) => g.r === "win").length;
    const d = l.filter((g) => g.r === "draw").length;
    const ls = l.filter((g) => g.r === "loss").length;
    return { w, d, l: ls, n: l.length, score: l.length ? (w + 0.5 * d) / l.length : 0 };
  };
  const n = Math.max(games.length, 1);
  const mis = games.flatMap((g) => g.mis.map((m) => ({ ...m, g })));
  const gave = mis.filter((m) => m.k === "g");
  const taken = gave.filter((m) => m.pun);
  const missed = mis.filter((m) => m.k === "m");
  const missedMates = mis.filter((m) => m.k === "mm");
  const allowedMates = mis.filter((m) => m.k === "am");

  const rating = [...games].reverse().find((g) => g.my)?.my || null;
  const level = levelOf(rating);
  const best = games.reduce((a, g) => (g.my && g.my > a ? g.my : a), 0) || null;

  // whole game outcomes, not just single moves
  const peakOf = (g) => (g.peak !== undefined ? g.peak : Math.max(...g.mat));
  const lowOf = (g) => (g.low !== undefined ? g.low : Math.min(...g.mat));
  const wasWinning = games.filter((g) => peakOf(g) >= 3);
  const convertedWins = wasWinning.filter((g) => g.r === "win");
  const threwAway = wasWinning.filter((g) => g.r === "loss");
  const wasLosing = games.filter((g) => lowOf(g) <= -3);
  const comebacks = wasLosing.filter((g) => g.r === "win");
  const clean = games.filter((g) => !g.mis.some((m) => m.k === "g" && m.pun));
  const cleanWins = clean.filter((g) => g.r === "win");

  const byPhase = ["Opening", "Middlegame", "Endgame"].map((ph) => ({
    phase: ph,
    given: taken.filter((m) => m.ph === ph).length,
    missed: missed.filter((m) => m.ph === ph).length,
  }));

  const byPiece = {};
  for (const m of taken) {
    const k = NAMES[m.pc.toLowerCase()];
    byPiece[k] = (byPiece[k] || 0) + 1;
  }

  const endings = {};
  for (const g of games.filter((x) => x.r === "loss")) endings[g.end] = (endings[g.end] || 0) + 1;

  const spends = gave.filter((m) => m.sp != null).map((m) => m.sp);
  const lossN = games.filter((g) => g.r === "loss").length;
  const timeouts = games.filter((g) => g.r === "loss" && g.end === "You ran out of time").length;
  const shortMates = games.filter((g) => g.r === "loss" && g.end === "You got checkmated" && g.mv <= 15).length;

  const hab = games.map((g) => g.hab).filter(Boolean);
  const avg = (f) => (hab.length ? hab.reduce((a, h) => a + (f(h) || 0), 0) / hab.length : 0);
  const castledShare = hab.length ? hab.filter((h) => h.cas > 0).length / hab.length : 0;

  // where you sit among the people you have actually played
  const oppRatings = games.map((g) => g.op).filter(Boolean);
  const beatBelow = rating && oppRatings.length
    ? oppRatings.filter((o) => o < rating).length / oppRatings.length : null;
  const oppAvg = oppRatings.length ? Math.round(oppRatings.reduce((a, b) => a + b, 0) / oppRatings.length) : null;
  const beatStronger = games.filter((g) => g.r === "win" && g.op && g.my && g.op > g.my);
  const bestWin = beatStronger.reduce((a, g) => (!a || g.op > a.op ? g : a), null);

  const months = {};
  for (const g of games) {
    const k = new Date(g.d).toISOString().slice(0, 7);
    if (!months[k]) months[k] = { key: k, n: 0, taken: 0, missed: 0, rating: [], wins: 0 };
    months[k].n++;
    months[k].taken += g.mis.filter((m) => m.k === "g" && m.pun).length;
    months[k].missed += g.mis.filter((m) => m.k === "m").length;
    if (g.r === "win") months[k].wins++;
    if (g.my) months[k].rating.push(g.my);
  }
  const trend = Object.values(months).sort((a, b) => a.key.localeCompare(b.key)).map((m) => ({
    label: new Date(m.key + "-01").toLocaleDateString(undefined, { month: "short", year: "2-digit" }),
    given: +(m.taken / m.n).toFixed(2), missed: +(m.missed / m.n).toFixed(2),
    winPct: Math.round((m.wins / m.n) * 100),
    rating: m.rating.length ? Math.round(m.rating.reduce((a, b) => a + b, 0) / m.rating.length) : null,
    games: m.n,
  }));

  const openings = {};
  for (const g of games) (openings[g.o || "Unknown"] = openings[g.o || "Unknown"] || []).push(g);
  const openingList = Object.entries(openings).map(([name, gs]) => ({
    name, ...rec(gs), n: gs.length,
    white: gs.filter((g) => g.c === "w").length,
    given: gs.reduce((a, g) => a + g.mis.filter((m) => m.k === "g" && m.pun).length, 0) / gs.length,
  })).sort((a, b) => b.n - a.n);

  const order = { mm: 3, am: 2, g: 1, m: 0 };
  const worst = [...mis].sort((a, b) =>
    (order[b.k] - order[a.k]) || (b.l - a.l) || ((b.pun ? 1 : 0) - (a.pun ? 1 : 0)));

  const avgLen = games.reduce((a, g) => a + g.mv, 0) / n;
  const totalMy = hab.reduce((a, h) => a + (h.n || 0), 0) || 1;

  return {
    n: games.length, rating, best, level,
    all: rec(games), white: rec(games.filter((g) => g.c === "w")), black: rec(games.filter((g) => g.c === "b")),
    givenPer: taken.length / n, loosePer: (gave.length - taken.length) / n, missedPer: missed.length / n,
    missedMates: missedMates.length, allowedMates: allowedMates.length,
    matesPunished: allowedMates.filter((m) => m.pun).length,
    timeoutShare: lossN ? timeouts / lossN : 0, timeouts, lossN, shortMates,
    inCheckShare: gave.length ? gave.filter((m) => m.ck).length / gave.length : 0,
    avgMistakeSpend: spends.length ? spends.reduce((a, b) => a + b, 0) / spends.length : null,
    rushed: spends.filter((s) => s <= 5).length, mistakeSpendN: spends.length,
    castledShare, homeAt12: avg((h) => h.home), pawnPushes: avg((h) => h.pw), queenEarly: avg((h) => h.qm),
    checkRate: totalMy ? hab.reduce((a, h) => a + (h.chk || 0), 0) / totalMy : 0,
    captureRate: totalMy ? hab.reduce((a, h) => a + (h.cap || 0), 0) / totalMy : 0,
    avgLen, avgCastleMove: hab.filter((h) => h.cas).length
      ? hab.filter((h) => h.cas).reduce((a, h) => a + h.cas, 0) / hab.filter((h) => h.cas).length : null,
    wasWinning: wasWinning.length, converted: convertedWins.length, threwAway: threwAway.length,
    convertRate: wasWinning.length ? convertedWins.length / wasWinning.length : null,
    wasLosing: wasLosing.length, comebacks: comebacks.length,
    clean: clean.length, cleanWins: cleanWins.length,
    oppAvg, beatBelow, beatStronger: beatStronger.length, bestWin,
    byPhase, byPiece, endings, trend, openingList, worst: worst.slice(0, 40),
    latestRating: rating, classes: [...new Set(games.map((g) => g.cls))],
    endgameShare: games.filter((g) => g.mv > 30).length / n,
  };
}

/* What is going well. Every entry has to be earned by the data. */
function strengths(agg) {
  const out = [];
  const add = (score, label, detail) => out.push({ score, label, detail });
  if (agg.convertRate !== null && agg.wasWinning >= 3 && agg.convertRate >= 0.6) {
    add(agg.convertRate * 10, "You finish off winning positions",
      `You got a clear material lead in ${agg.wasWinning} games and won ${agg.converted} of them.`);
  }
  if (agg.comebacks >= 2) {
    add(8 + agg.comebacks, "You do not fold when you are behind",
      `You were three points or more down in ${agg.wasLosing} games and still won ${agg.comebacks}.`);
  }
  if (agg.clean / Math.max(agg.n, 1) >= 0.35) {
    add(9, "Plenty of clean games",
      `In ${agg.clean} of your ${agg.n} games you did not lose a single piece outright, and you won ${agg.cleanWins} of those.`);
  }
  if (agg.castledShare >= 0.75) {
    add(7, "You look after your king",
      `Castled in ${Math.round(agg.castledShare * 100)}% of games${agg.avgCastleMove ? `, usually around move ${Math.round(agg.avgCastleMove)}` : ""}.`);
  }
  if (agg.homeAt12 < 1) {
    add(6, "Your pieces come out early",
      `By move twelve you have nearly everything developed, ${agg.homeAt12.toFixed(1)} pieces still at home on average.`);
  }
  if (agg.beatStronger >= 2 && agg.bestWin) {
    add(8, "You beat people above you",
      `${agg.beatStronger} wins against higher rated opponents, the best of them rated ${agg.bestWin.op}.`);
  }
  if (agg.timeoutShare < 0.08 && agg.lossN >= 5) {
    add(5, "Your clock is under control",
      `Barely any of your losses came from running out of time.`);
  }
  if (agg.trend.length >= 3) {
    const first = agg.trend[0], last = agg.trend[agg.trend.length - 1];
    if (last.given < first.given * 0.75) {
      add(11, "You are dropping fewer pieces than you were",
        `Down from ${first.given} a game in ${first.label} to ${last.given} in ${last.label}.`);
    }
    if (last.rating && first.rating && last.rating > first.rating + 25) {
      add(10, "Your rating is going the right way",
        `Up from about ${first.rating} to ${last.rating} across the games saved here.`);
    }
  }
  const good = agg.openingList.filter((o) => o.n >= 4 && o.score >= 0.55);
  if (good.length) {
    const b = good.sort((a, b2) => b2.score - a.score)[0];
    add(7, `The ${b.name} suits you`,
      `${Math.round(b.score * 100)}% score across ${b.n} games, better than the rest of your openings.`);
  }
  if (agg.missedPer < agg.level.miss[0]) {
    add(6, "You take what is offered",
      `Free material rarely goes past you, ${agg.missedPer.toFixed(1)} missed a game.`);
  }
  if (agg.givenPer < agg.level.give[0]) {
    add(12, "You are not dropping pieces",
      `${agg.givenPer.toFixed(1)} a game, which is low for your rating. Plain blunders are not what is deciding your games.`);
  }
  if (!out.length) {
    add(1, "Early days",
      `There are ${agg.n} games in here. Add a few more and the patterns worth praising will show up.`);
  }
  return out.sort((a, b) => b.score - a.score);
}

function metrics(agg) {
  const L = agg.level;
  const band = (v, g, w) => (v <= g ? "good" : v <= w ? "watch" : "fix");
  const out = [];
  out.push({
    id: "given", value: agg.givenPer.toFixed(1), unit: "per game",
    title: "Pieces left where they could be taken", level: band(agg.givenPer, L.give[0], L.give[1]),
    plain: "A piece of yours could simply be captured, and it was.",
    target: `For ${L.who}, under ${L.give[0]} a game is the mark.`,
  });
  out.push({
    id: "missed", value: agg.missedPer.toFixed(1), unit: "per game",
    title: "Free material left on the board", level: band(agg.missedPer, L.miss[0], L.miss[1]),
    plain: "Something of theirs was there for the taking and the move went elsewhere.",
    target: `Under ${L.miss[0]} a game at your level.`,
  });
  if (agg.wasWinning >= 3) {
    const r = agg.convertRate;
    out.push({
      id: "convert", value: Math.round(r * 100) + "%", unit: `of ${agg.wasWinning} winning positions`,
      title: "Turning a lead into a win", level: r >= 0.75 ? "good" : r >= 0.5 ? "watch" : "fix",
      plain: `You were at least three points up in ${agg.wasWinning} games and won ${agg.converted}.`,
      target: "This is the number that separates ratings more than anything else on this page.",
    });
  }
  if (agg.missedMates || agg.allowedMates) {
    out.push({
      id: "mate", value: `${agg.missedMates} / ${agg.allowedMates}`, unit: "missed / allowed",
      title: "Mate in one", level: band((agg.missedMates + agg.allowedMates) / Math.max(agg.n, 1), 0.1, 0.4),
      plain: `Mate was available to you ${agg.missedMates} time${agg.missedMates === 1 ? "" : "s"} and to them ${agg.allowedMates}.`,
      target: "Forcing moves are worth checking first, both directions.",
    });
  }
  if (agg.lossN >= 4) {
    out.push({
      id: "clock", value: Math.round(agg.timeoutShare * 100) + "%", unit: `of ${agg.lossN} losses`,
      title: "Lost on the clock", level: band(agg.timeoutShare, 0.1, 0.25),
      plain: "The position was still alive when the time ran out.",
      target: "Under 10% is fine. Above 25% and the time control is the opponent.",
    });
  }
  out.push({
    id: "castle", value: Math.round(agg.castledShare * 100) + "%", unit: "of games",
    title: "Games where you castled",
    level: agg.castledShare >= 0.8 ? "good" : agg.castledShare >= 0.55 ? "watch" : "fix",
    plain: "King tucked away, rook brought into play.",
    target: "Most games, usually in the first ten moves.",
  });
  return out;
}

/* ============================================================
   4. PLAYING STYLE
   Measured from habits, matched to a well known style.
   It says nothing about strength, only about taste.
   ============================================================ */

const STYLES = [
  { name: "Magnus Carlsen", tag: "the grinder",
    v: { aggr: 0.4, trade: 0.5, len: 0.85, dev: 0.7, risk: 0.3 },
    blurb: "Long games, few wild moments, happy to keep going until the other person cracks. Carlsen built a career on outlasting people rather than blowing them off the board." },
  { name: "Hikaru Nakamura", tag: "the speed merchant",
    v: { aggr: 0.75, trade: 0.6, len: 0.4, dev: 0.6, risk: 0.6 },
    blurb: "Fast, sharp, comfortable in a mess. Nakamura made his name in speed chess where finding something quickly beats finding the best thing slowly." },
  { name: "Mikhail Tal", tag: "the attacker",
    v: { aggr: 0.9, trade: 0.35, len: 0.45, dev: 0.6, risk: 0.95 },
    blurb: "Throws pieces at the king and works it out on the way. Tal gave away material constantly and won because nobody could handle the chaos." },
  { name: "Tigran Petrosian", tag: "the wall",
    v: { aggr: 0.2, trade: 0.35, len: 0.75, dev: 0.7, risk: 0.15 },
    blurb: "Quiet, careful, nothing loose anywhere. Petrosian was famously hard to beat because he saw the danger before it arrived." },
  { name: "Jose Raul Capablanca", tag: "the simplifier",
    v: { aggr: 0.35, trade: 0.85, len: 0.7, dev: 0.8, risk: 0.2 },
    blurb: "Trades pieces off and wins the simple positions. Capablanca made chess look easy by removing everything complicated from the board." },
  { name: "Paul Morphy", tag: "the developer",
    v: { aggr: 0.7, trade: 0.5, len: 0.3, dev: 0.95, risk: 0.6 },
    blurb: "Everything out fast, king safe, then attack. Morphy beat the best players of his day mostly by developing quicker than they did." },
  { name: "Garry Kasparov", tag: "the pressure player",
    v: { aggr: 0.8, trade: 0.45, len: 0.6, dev: 0.8, risk: 0.7 },
    blurb: "Grabs the initiative early and never gives it back. Kasparov played like the game was his to lose from move one." },
  { name: "Anatoly Karpov", tag: "the squeezer",
    v: { aggr: 0.25, trade: 0.6, len: 0.8, dev: 0.75, risk: 0.2 },
    blurb: "Takes small advantages and slowly tightens. Karpov rarely attacked, he just left opponents with less and less to do." },
];

function styleProfile(agg) {
  const clamp = (x) => Math.max(0, Math.min(1, x));
  const v = {
    aggr: clamp(agg.checkRate * 7),
    trade: clamp(agg.captureRate * 3.2),
    len: clamp((agg.avgLen - 15) / 35),
    dev: clamp(1 - agg.homeAt12 / 3),
    risk: clamp((agg.givenPer / Math.max(agg.level.give[1], 0.2)) * 0.5 + agg.loosePer * 0.12),
  };
  const scored = STYLES.map((s) => ({
    ...s,
    dist: Math.sqrt(Object.keys(v).reduce((a, k) => a + (v[k] - s.v[k]) ** 2, 0)),
  })).sort((a, b) => a.dist - b.dist);
  const axes = [
    { key: "aggr", left: "quiet", right: "aggressive", val: v.aggr,
      note: `You give check on ${Math.round(agg.checkRate * 100)}% of your moves.` },
    { key: "trade", left: "keeps pieces on", right: "trades a lot", val: v.trade,
      note: `${Math.round(agg.captureRate * 100)}% of your moves are captures.` },
    { key: "len", left: "short games", right: "long games", val: v.len,
      note: `Your games run about ${Math.round(agg.avgLen)} moves.` },
    { key: "dev", left: "slow to develop", right: "quick to develop", val: v.dev,
      note: `${agg.homeAt12.toFixed(1)} pieces still at home at move twelve.` },
    { key: "risk", left: "careful", right: "loose", val: v.risk,
      note: `Based on how much you leave hanging.` },
  ];
  return { v, axes, best: scored[0], second: scored[1] };
}

/* ============================================================
   5. OPENINGS IN PLAIN ENGLISH
   ============================================================ */

const OPENING_NOTES = {
  "Kings Pawn": "White starts 1.e4, the most direct first move there is. It opens lines for the queen and a bishop straight away and usually leads to open, tactical games.",
  "Queens Pawn": "White starts 1.d4. Slower and more solid than 1.e4, with the fight usually happening in the middle of the board rather than around the king.",
  "Sicilian Defense": "Black answers 1.e4 with 1...c5, refusing to mirror White. It is the most popular reply at every level and leads to sharp, unbalanced games where both sides attack.",

  "Ponziani Opening": "An old sideline where White plays c3 early. Rare enough that opponents rarely know it.",
  "Englund Gambit": "Black gives up a pawn immediately after 1.d4. It sets traps and loses a pawn for nothing if the traps do not work.",
};

function openingNote(name) {
  if (!name) return null;
  if (OPENING_NOTES[name]) return OPENING_NOTES[name];
  const key = Object.keys(OPENING_NOTES).find((k) => name.startsWith(k) || k.startsWith(name));
  if (key) return OPENING_NOTES[key];
  if (/Defense|Defence/i.test(name)) return "A way for Black to answer White's first move. Not a common enough opening here to say much about it.";
  if (/Gambit/i.test(name)) return "A gambit, meaning one side gives up a pawn early to get their pieces out faster.";
  return "Not one of the common openings, so there is not much to say beyond what your own games show.";
}
/* ============================================================
   6. VOICE
   Text is composed from the numbers rather than stored whole,
   and the phrasing is seeded per player, so two people with
   different games get different writing.
   ============================================================ */

function hashStr(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function rngFrom(seed) {
  let a = seed >>> 0;
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function makePick(seedStr) {
  const r = rngFrom(hashStr(seedStr));
  return (arr) => arr[Math.floor(r() * arr.length) % arr.length];
}

/* The shape of one game, from the material line. */
function gameStory(g) {
  const mat = g.mat || [];
  if (!mat.length) return "";
  const peak = Math.max(...mat), low = Math.min(...mat), end = mat[mat.length - 1];
  const won = g.r === "win", lost = g.r === "loss";
  let biggest = 0, at = 0;
  for (let i = 1; i < mat.length; i++) {
    const d = mat[i - 1] - mat[i];
    if (d > biggest) { biggest = d; at = Math.ceil((i + 1) / 2); }
  }
  const oneMoment = biggest >= 3 && biggest >= (peak - low) * 0.5;
  if (won && low >= -1 && peak >= 3) return "You were in front for most of this and saw it through.";
  if (won && low <= -3) return `You were ${-low} points down at one stage and still won it.`;
  if (won) return "A close one that went your way.";
  if (lost && peak >= 3 && oneMoment) return `You were ${peak} points up before it turned, and most of that went in one move around move ${at}.`;
  if (lost && peak >= 3) return `You had a ${peak} point lead in this one and it slipped away gradually.`;
  if (lost && oneMoment) return `Fairly level until move ${at}, where ${biggest} points went in one go.`;
  if (lost && low <= -5) return "This one got away early and stayed away.";
  if (lost) return "Close on material the whole way, decided by something other than pieces.";
  if (Math.abs(end) <= 1) return "Level from start to finish.";
  return "";
}

/* ---- the written narrative, composed fresh each time ---- */
function narrative(agg, seedStr) {
  const pick = makePick(seedStr + agg.n + Math.round(agg.givenPer * 100));
  const L = agg.level;
  const str = strengths(agg);
  const out = { opener: "", strengths: str.slice(0, 3), focus: [], footnote: "" };

  const top = str[0];
  const openers = [
    `Across ${agg.n} games the clearest thing in your favour is this: ${lower1(top.label)}. ${top.detail}`,
    `${agg.n} games in, and the thing that stands out first is that ${lower1(top.label)}. ${top.detail}`,
    `Starting with what is going right over these ${agg.n} games: ${lower1(top.label)}. ${top.detail}`,
  ];
  out.opener = pick(openers);

  const add = (score, title, body) => out.focus.push({ score, title, body });

  // conversion, the strategic one
  if (agg.wasWinning >= 3 && agg.convertRate !== null && agg.convertRate < 0.7) {
    add(50, "Holding on to a winning position", pick([
      `You reached a clear material lead in ${agg.wasWinning} games and came away with the win in ${agg.converted}. That gap is where most of your points are going, and it is not a knowledge problem, it is what happens when the position feels won and the checking stops. When you go a piece up, the useful instinct is to trade pieces off rather than start something new. Fewer pieces means fewer ways for it to go wrong, and a piece up in a simple position wins almost by itself.`,
      `The lead is not the problem, keeping it is. ${agg.wasWinning} of your games had you three points or more ahead and ${agg.threwAway} of those ended in a loss. Once you are ahead, the goal changes: swap pieces whenever it is a fair trade, keep the king safe, and let the extra material do the work. Most players at your level lose won games by trying to win them twice.`,
      `You get ahead often enough, ${agg.wasWinning} games with a clear lead, but only ${agg.converted} of those turned into wins. Worth sitting with. When the material count goes your way, slow down rather than speed up, and look for trades. A queen swap when you are a rook up is almost always the right call, even if it feels like giving up on the attack.`,
    ]));
  }

  // the material leak, framed by level
  if (agg.givenPer > L.give[0] * 1.25) {
    const many = agg.givenPer > L.give[1];
    add(40 + agg.givenPer * 5, "Seeing what their move just did", pick([
      `${agg.givenPer.toFixed(1)} pieces a game are going where they can simply be taken, which is ${many ? "on the high side" : "a little above the mark"} for ${L.who}. Nearly all of these come from the same thing: their move changed what is attacked, and the reply was chosen before that sank in. One habit fixes most of it. When it is your turn, look at the piece they just moved, and ask what it now touches. Then pick your move.`,
      `The main material leak is ${agg.givenPer.toFixed(1)} pieces a game left where a capture wins them. That is ${many ? "worth real attention" : "not far off where you want it, but there is room"}. The reason it keeps happening is that it is easy to look at your own plan and not at their last move. Before you commit, one question: what does their piece attack now that it did not a moment ago?`,
      `You are handing over about ${agg.givenPer.toFixed(1)} a game. ${many ? "That is the single biggest thing on this page." : "Not disastrous, but it is the cheapest thing to improve."} The fix is a habit rather than knowledge. Their move, then your move: check what changed first. Most of the time nothing has, and it costs you two seconds.`,
    ]));
  }

  // free material
  if (agg.missedPer > L.miss[0] * 1.25) {
    add(30 + agg.missedPer * 4, "Scanning their side of the board", pick([
      `There is ${agg.missedPer.toFixed(1)} free material a game going past you. This one is easy to shift because you are already looking at the board, just at your own half of it. Before you settle on a move, run down their pieces and ask which have nothing defending them. It also tends to improve everything else, because the habit of looking at their pieces is the same habit that stops you dropping your own.`,
      `${agg.missedPer.toFixed(1)} times a game something of theirs was there for the taking. Worth building a routine around: their loose pieces first, your loose pieces second, then your idea. In that order. Free material is not exciting but it is the most reliable way to be ahead when the endgame comes.`,
      `You are leaving about ${agg.missedPer.toFixed(1)} free pieces a game on the board. Usually that means the attention is on a plan rather than the position. There is nothing wrong with the plan, but a quick scan of what is undefended costs nothing and often changes the plan for the better.`,
    ]));
  }

  // mate patterns
  if (agg.missedMates >= 2 || agg.allowedMates >= 2) {
    const g = agg.worst.filter((m) => m.k === "mm")[0];
    add(45, "Checking the forcing moves", pick([
      `Mate in one was available to you ${agg.missedMates} time${agg.missedMates === 1 ? "" : "s"} and to them ${agg.allowedMates}. ${g ? `One of them was move ${g.mv} in your ${g.g.o} game, where ${sqName(g.at)} to ${sqName(g.sq)} finished it. ` : ""}Both directions come from the same habit. Once the board thins out and a king is short of squares, go through every check you have before anything else, then do the same for theirs. It takes seconds and it decides a lot of games at this level.`,
      `There were ${agg.missedMates} mates you had and ${agg.allowedMates} you allowed. Neither number means you cannot see mate, it means the checks are not being looked at first. When a king has few squares, checks are the whole game. Try every one of yours, then look at every one of theirs before you move.`,
      `The forcing stuff is slipping past in both directions, ${agg.missedMates} mates missed and ${agg.allowedMates} handed over. Endgames with exposed kings are where this lives. A simple order helps: checks, captures, threats, and only then the quiet move you were planning.`,
    ]));
  }

  // where the trouble sits
  const ph = [...agg.byPhase].sort((a, b) => (b.given + b.missed) - (a.given + a.missed))[0];
  if (ph && ph.given + ph.missed >= 6) {
    const share = (ph.given + ph.missed) /
      Math.max(agg.byPhase.reduce((a, p) => a + p.given + p.missed, 0), 1);
    if (share > 0.45) {
      const where = { Opening: "the first ten moves", Middlegame: "the middlegame", Endgame: "the endgame" }[ph.phase];
      add(35, `Most of it happens in ${where}`, pick([
        `${Math.round(share * 100)}% of everything flagged in your games lands in ${where}. ${ph.phase === "Endgame" ? "That is common and it is usually about attention rather than technique. Endgames feel slower, so the checking gets lazy, but with fewer pieces each mistake is worth more, not less." : ph.phase === "Opening" ? "That normally means moves are being played from memory or habit rather than from the position in front of you." : "The middlegame is where the most pieces can see the most squares, so it is the hardest place to keep track. Slowing down for the two or three moves after the last piece develops usually catches it."}`,
        `Your mistakes are not spread evenly. ${where} holds ${Math.round(share * 100)}% of them. ${ph.phase === "Endgame" ? "Worth knowing, because it means the openings are fine and the work is at the other end of the game." : "Worth knowing, because it tells you which part of the game to slow down in."}`,
      ]));
    }
  }

  // clock
  if (agg.timeoutShare > 0.15 && agg.lossN >= 4) {
    add(38, "The clock is part of the result", pick([
      `${Math.round(agg.timeoutShare * 100)}% of your losses were time running out rather than the position going wrong. That is worth fixing before anything technical, because none of the habits above are possible without seconds to spend. Longer time controls for a month, then judge everything else.`,
      `Time is deciding ${Math.round(agg.timeoutShare * 100)}% of your defeats. The positions were still alive. If you are on the quick formats, a spell of ten or fifteen minute games gives every other improvement room to happen.`,
    ]));
  }

  // rushing
  if (agg.mistakeSpendN >= 8 && agg.rushed / agg.mistakeSpendN > 0.3) {
    add(28, "The fast moves cost the most", pick([
      `${Math.round((agg.rushed / agg.mistakeSpendN) * 100)}% of the pieces you drop go on moves played in under five seconds, and they are usually the obvious looking ones. Recaptures especially. A count of three before every move, including the ones you are sure about, catches most of it.`,
      `Most of your material goes in moves you barely thought about. The pattern is not that the positions were hard, it is that they looked easy. Obvious moves deserve the same two seconds as hard ones.`,
    ]));
  }

  // king safety
  if (agg.castledShare < 0.6) {
    add(26, "Getting the king out of the middle", pick([
      `You castled in ${Math.round(agg.castledShare * 100)}% of these games. A king in the centre is not automatically losing, but it means every open line points at you, and it makes the middlegame far harder to calculate. Pieces out, then castle, then plan.`,
      `Only ${Math.round(agg.castledShare * 100)}% of your games have you castling. It is not the flashiest habit to build, but a safe king turns a lot of scary positions into ordinary ones.`,
    ]));
  }

  // development
  if (agg.homeAt12 >= 1.5) {
    add(22, "Getting everyone into the game", pick([
      `By move twelve you still have ${agg.homeAt12.toFixed(1)} of your knights and bishops on their starting squares. A piece at home defends nothing useful and attacks nothing at all. Aim to have all four out and the king castled before you go looking for a plan, and the plan tends to appear on its own.`,
      `On average ${agg.homeAt12.toFixed(1)} pieces are still sitting at home at move twelve. Getting them out is not about theory, it is about having something to play with when the position opens.`,
    ]));
  }

  out.focus = out.focus.sort((a, b) => b.score - a.score).slice(0, 3);
  if (!out.focus.length) {
    out.focus.push({
      title: "Not much for this tool to grip",
      body: `The plain mistakes it looks for barely show up in your games. At this level the difference is made by things it cannot see, like plans, structure and calculating two or three moves deep. Use the game browser to walk through your losses instead, and treat the numbers here as background.`,
    });
  }
  out.footnote = pick([
    `All of this comes from counting what is on the board, not from an engine. It sees pieces that could be captured and mates in one. It does not see plans, pins or anything two moves deep.`,
    `Worth remembering that this is arithmetic rather than an engine. Plain captures and mate in one are visible to it, everything deeper is not.`,
  ]);
  return out;
}

const lower1 = (s) => s.charAt(0).toLowerCase() + s.slice(1);
</script>
<script>
/* ============================================================
   UI
   ============================================================ */

const LAST = "cc:last";
const keyFor = (name) => "cc:u:" + name.trim().toLowerCase();
const CAP = 600;

const S = {
  name: "", games: [], review: null, apiKey: "", synced: {},
  tab: "today", view: null, ply: 0, ready: false, screen: "login", inspect: null,
  toast: null, busy: "", shown: 25, showAll: false, pick: null, pending: "", why: false,
};

const store = {
  async get(k) {
    if (window.storage) { try { const r = await window.storage.get(k); return r ? r.value : null; } catch { return null; } }
    try { return localStorage.getItem(k); } catch { return null; }
  },
  async set(k, v) {
    if (window.storage) { try { await window.storage.set(k, v); return true; } catch { return false; } }
    try { localStorage.setItem(k, v); return true; } catch { return false; }
  },
};

const tick = () => new Promise((r) => setTimeout(r, 0));

async function persist() {
  if (!S.name) return;
  const payload = { name: S.name, games: S.games.slice(-CAP), review: S.review, apiKey: S.apiKey, synced: S.synced };
  let body = JSON.stringify(payload);
  while (body.length > 4_000_000 && payload.games.length > 20) {
    payload.games = payload.games.slice(Math.ceil(payload.games.length * 0.2));
    body = JSON.stringify(payload);
  }
  await store.set(keyFor(S.name), body);
  await store.set(LAST, S.name);
}

async function loadUser(name) {
  const raw = await store.get(keyFor(name));
  S.name = name.trim();
  S.games = []; S.review = null; S.synced = {}; S.apiKey = "";
  if (raw) {
    try {
      const d = JSON.parse(raw);
      S.games = d.games || []; S.review = d.review || null;
      S.apiKey = d.apiKey || ""; S.synced = d.synced || {};
      if (d.name) S.name = d.name;
    } catch {}
  }
  S.screen = "app"; S.tab = "today"; S.view = null; S.shown = 25;
  await store.set(LAST, S.name);
}

/* rebuild old saved games when the analysis gets deeper */
async function upgradeSaved() {
  const stale = S.games.filter((g) => (g.v || 1) < REC_VERSION && g.pgn);
  if (!stale.length) return;
  const out = [];
  for (let i = 0; i < S.games.length; i++) {
    const g = S.games[i];
    if ((g.v || 1) < REC_VERSION && g.pgn) {
      let r = null;
      try { r = buildRecord(g.pgn, S.name); } catch {}
      out.push(r || g);
    } else out.push(g);
    if (i % 5 === 0) {
      S.busy = `Taking another look at your saved games, ${i} of ${S.games.length}`;
      render(); await tick();
    }
  }
  S.games = out; S.busy = "";
  await persist();
}

/* ---------- helpers ---------- */

function pieceSVG(ch) {
  const white = ch === ch.toUpperCase();
  const t = ch.toLowerCase();

    <g>${PIECE_PATHS[t]}</g></svg>`;
}

/* ---------- charts ---------- */
function lineChart(vals, labels, color, opts = {}) {
  const n = vals.length;
  if (n < 2) return "";
  const W = 300, H = opts.height || 92, pad = 4;
  const lo = Math.min(...vals), hi = Math.max(...vals), span = hi - lo || 1;
  const x = (i) => pad + (i / (n - 1)) * (W - pad * 2);
  const y = (v) => H - pad - ((v - lo) / span) * (H - pad * 2);
  const pts = vals.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  const dots = opts.dots === false ? "" : vals.map((v, i) =>
    `<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="2.6" fill="${color}"/>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" class="chart">
    <polygon points="${pad},${H - pad} ${pts} ${W - pad},${H - pad}" fill="${color}" opacity=".08"/>
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round"
      stroke-linecap="round" vector-effect="non-scaling-stroke"/>${dots}</svg>
  <div class="axis"><span>${esc(labels[0])}</span><span class="mono">${lo === hi ? lo : `${lo} to ${hi}`}</span>
    <span>${esc(labels[labels.length - 1])}</span></div>`;
}

function groupBars(rows, keys, colors, names) {
  const max = Math.max(1, ...rows.flatMap((r) => keys.map((k) => r[k])));
  return `<div class="gb">${rows.map((r) => `<div class="gbcol"><div class="gbbars">
    ${keys.map((k, ki) => `<div class="gbbar" style="height:${(r[k] / max) * 100}%;background:${colors[ki]}">
      ${r[k] ? `<span class="gbn">${r[k]}</span>` : ""}</div>`).join("")}
    </div><div class="gblab">${esc(r.phase)}</div></div>`).join("")}</div>
  <div class="legend">${keys.map((k, ki) =>
    `<span><i style="background:${colors[ki]}"></i>${esc(names[ki])}</span>`).join("")}</div>`;
}

function hBars(entries, color) {
  const max = Math.max(...entries.map((e) => e[1]), 1);
  return entries.map(([k, v]) => `<div class="hb"><span class="hbl">${esc(k)}</span>
    <span class="hbt"><i style="width:${(v / max) * 100}%;background:${color}"></i></span>
    <span class="hbv mono">${v}</span></div>`).join("");
}

function strip(matIn, marks) {
  const step = Math.max(1, Math.ceil(matIn.length / 48));
  const mat = step === 1 ? matIn : matIn.filter((_, i) => i % step === 0);
  const scale = 1 / step, n = mat.length || 1, H = 26;
  const bars = mat.map((v, i) => {
    const c = Math.max(-9, Math.min(9, v));
    const hh = (Math.abs(c) / 9) * (H / 2 - 2);
    return `<rect x="${i}" width="1" y="${(c >= 0 ? H / 2 - hh : H / 2).toFixed(2)}"
      height="${Math.max(hh, 0.001).toFixed(2)}" fill="${c >= 0 ? "#8bbfae" : "#d99e94"}"/>`;
  }).join("");
  const ticks = marks.map((m) => `<rect x="${(m * scale).toFixed(2)}" width="1.4" y="0" height="4" fill="#b0392b"/>`).join("");
  return `<svg viewBox="0 0 ${n} ${H}" preserveAspectRatio="none" class="strip">
    <line x1="0" y1="${H / 2}" x2="${n}" y2="${H / 2}" stroke="#e6dfd1" stroke-width="1"
      vector-effect="non-scaling-stroke"/>${bars}${ticks}</svg>`;
}

/* ---------- board ---------- */
function boardHTML(boardStr, flip, mark, inspect) {
  const order = flip ? [...Array(64).keys()].reverse() : [...Array(64).keys()];
  let am = null;
  if (inspect != null) am = attackMap(boardStr.split(""));
  const cells = order.map((i) => {
    const p = boardStr[i];
    const dark = (fileOf(i) + rankOf(i)) % 2 === 1;
    const bits = [];
    if (mark && (mark.from === i || mark.to === i)) bits.push('<i class="last"></i>');
    if (inspect === i) bits.push('<i class="sel"></i>');
    if (p !== ".") bits.push(pieceSVG(p));
    if (mark && mark.target === i) bits.push(`<i class="ring ${mark.tone || ""}"></i>`);
    if (am && inspect !== i) {
      const attacksSel = am.w[inspect].includes(i) || am.b[inspect].includes(i);
      if (attacksSel) {
        const white = isW(p);
        bits.push(`<i class="dot ${white ? "dw" : "db"}"></i>`);
      }
    }
    // edge labels, inside the squares to keep the board as wide as possible
    const f = fileOf(i), r = rankOf(i);
    const showFile = flip ? r === 0 : r === 7;
    const showRank = flip ? f === 7 : f === 0;
    if (showRank) bits.push(`<span class="cr rk">${8 - r}</span>`);
    if (showFile) bits.push(`<span class="cr fl">${"abcdefgh"[f]}</span>`);
    return `<div class="sq ${dark ? "d" : "l"}" data-a="sq" data-i="${i}">${bits.join("")}</div>`;
  }).join("");

  let arrow = "";
  if (mark && mark.arrow) {
    const [a, b] = mark.arrow;
    const cx = (i) => (flip ? 7 - fileOf(i) : fileOf(i)) + 0.5;
    const cy = (i) => (flip ? 7 - rankOf(i) : rankOf(i)) + 0.5;
    const x1 = cx(a), y1 = cy(a), x2 = cx(b), y2 = cy(b);
    const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy) || 1;
    const ex = x2 - (dx / len) * 0.36, ey = y2 - (dy / len) * 0.36;
    const col = mark.tone === "green" ? "#1f6f5c" : mark.tone === "purple" ? "#6b3fa0" : "#b0392b";
    arrow = `<svg class="arrows" viewBox="0 0 8 8">
      <defs><marker id="ah" markerWidth="3.4" markerHeight="3.4" refX="1.9" refY="1.7" orient="auto">
        <path d="M0,0 L0,3.4 L3.1,1.7 z" fill="${col}"/></marker></defs>
      <line x1="${x1}" y1="${y1}" x2="${ex}" y2="${ey}" stroke="${col}" stroke-width=".17"
        stroke-linecap="round" opacity=".9" marker-end="url(#ah)"/></svg>`;
  }
  return `<div class="board">${cells}${arrow}</div>`;
}

function inspectNote(boardStr, i, myColor) {
  if (i == null) return `<div class="tiny mid">Tap any square to see what is aiming at it.</div>`;
  const am = attackMap(boardStr.split(""));
  const mine = am[myColor][i].length;
  const theirs = am[myColor === "w" ? "b" : "w"][i].length;
  const p = boardStr[i];
  const who = p === "." ? "Empty square" :
    `${colorOf(p) === myColor ? "Your" : "Their"} ${NAMES[p.toLowerCase()]}`;
  return `<div class="inspect">
    <b>${sqName(i)}</b> ${who}. Yours aiming at it: ${mine}. Theirs: ${theirs}.
    ${p !== "." && colorOf(p) === myColor && theirs > mine ? " More of theirs than yours, so it is worth checking." : ""}
    <button class="lnk" data-a="clearsq">clear</button>
  </div>`;
}

function matBar(mat) {
  const v = Math.max(-12, Math.min(12, mat));
  return `<div class="matbar"><div class="mattrack"><b></b><i style="left:${((v + 12) / 24) * 100}%"></i></div>
    <div class="matlab"><span>them</span>
      <span class="mono ${v > 0 ? "good" : v < 0 ? "bad" : "faint"}">
        ${v === 0 ? "material level" : v > 0 ? `you are ${v} up` : `you are ${-v} down`}</span>
      <span>you</span></div></div>`;
}

/* ---------- chess.com sync ---------- */
async function syncChessCom(howMany) {
  const u = S.name.trim().toLowerCase();
  S.busy = "Asking chess.com for your games"; render();
  let archives;
  try {
    const r = await fetch(`https://api.chess.com/pub/player/${encodeURIComponent(u)}/games/archives`);
    if (r.status === 404) throw new Error(`No chess.com account called ${S.name}`);
    if (!r.ok) throw new Error(`chess.com replied ${r.status}`);
    archives = (await r.json()).archives || [];
  } catch (e) {
    S.busy = "";
    S.toast = /No chess\.com/.test(e.message) ? e.message
      : "chess.com would not hand the games over from here. The file route works, one tap.";
    render(); setTimeout(() => { S.toast = null; render(); }, 6000);
    return false;
  }
  if (!archives.length) { S.busy = ""; S.toast = "No finished games on that account yet."; render(); return false; }
  const wanted = archives.slice(-howMany);
  let text = "";
  for (let i = 0; i < wanted.length; i++) {
    S.busy = `Downloading month ${i + 1} of ${wanted.length}`; render();
    try {
      const r = await fetch(wanted[i] + "/pgn");
      if (r.ok) { text += (await r.text()) + "\n\n"; S.synced[wanted[i].slice(-7)] = Date.now(); }
    } catch {}
  }
  if (!text.trim()) {
    S.busy = ""; S.toast = "chess.com blocked the download. Use Add games instead.";
    render(); setTimeout(() => { S.toast = null; render(); }, 6000);
    return false;
  }
  await importText(text);
  return true;
}

/* ---------- import ---------- */
async function importText(raw, forcedName) {
  S.busy = "Reading the file"; render(); await tick();
  const chunks = splitPGN(raw);
  let who = (forcedName || S.name).trim();
  if (!who) {
    const d = detectName(chunks);
    if (d.name) who = d.name;
    else { S.pick = d.options; S.pending = raw; S.busy = ""; render(); return; }
  }
  const have = new Set(S.games.map((g) => g.id));
  const mine = [];
  let dupes = 0, notMine = 0, bad = 0;
  for (const c of chunks) {
    const t = parseTags(c);
    const lo = who.toLowerCase();
    if ((t.White || "").toLowerCase() !== lo && (t.Black || "").toLowerCase() !== lo) { notMine++; continue; }
    const id = t.Link || `${t.White}-${t.Black}-${t.UTCDate || t.Date}-${t.UTCTime || ""}`;
    if (have.has(id)) { dupes++; continue; }
    mine.push(c);
  }
  const fresh = [];
  for (let i = 0; i < mine.length; i++) {
    if (i % 4 === 0) {
      S.busy = `Going through your games, ${i} of ${mine.length}`; render(); await tick();
    }
    let rec = null;
    try { rec = buildRecord(mine[i], who); } catch {}
    if (!rec) { bad++; continue; }
    if (have.has(rec.id)) { dupes++; continue; }
    have.add(rec.id); fresh.push(rec);
  }
  S.games = [...S.games, ...fresh].sort((a, b) => a.d - b.d).slice(-CAP);
  S.pick = null; S.pending = ""; S.busy = "";
  S.toast = fresh.length
    ? `${fresh.length} new game${fresh.length > 1 ? "s" : ""} in`
    : chunks.length ? `Nothing new there. ${dupes} were already saved${notMine ? `, ${notMine} were not yours` : ""}${bad ? `, ${bad} could not be read` : ""}`
      : "No games found in that file";
  await persist(); render();
  setTimeout(() => { if (S.toast) { S.toast = null; render(); } }, 5000);
}
