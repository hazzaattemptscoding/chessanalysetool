      </div>
      ${strip(g.mat, bad.map((m) => m.p))}
      ${story ? `<p class="story">${esc(story)}</p>` : ""}
      <div class="tiny">${g.c === "w" ? "White" : "Black"} vs ${esc(g.opp)}${g.op ? ` (${g.op})` : ""}
        · ${esc(g.o)} · ${esc(g.end)}</div>
    </button>`;
  }).join("")}
  ${list.length > shown.length ? `<button class="card list mid" data-a="more">Show 25 more of ${list.length}</button>` : ""}
  <div class="card">
    <div class="t nm">More history</div>
    <p>Refresh looks at this month and last. This goes back a year.</p>
    <button class="btn wide" data-a="sync12" ${S.busy ? "disabled" : ""}>Pull the last 12 months</button>
  </div>`;
}

function screenViewer() {
  const g = S.games.find((x) => x.id === S.view);
  if (!g) return `<div class="card">Game not found.</div>`;
  const data = replay(g.pgn, S.name);
  if (!data) return `<div class="card">Could not rebuild this game.</div>`;
  const plies = data.plies;
  const i = Math.max(0, Math.min(S.ply, plies.length - 1));
  const p = plies[i];
  const flagged = g.mis.map((x) => x.p);
  const m = g.mis.find((x) => x.p === i);
  const prev = [...flagged].sort((a, b) => a - b).reverse().find((x) => x < i);
  const next = [...flagged].sort((a, b) => a - b).find((x) => x > i);
  const tone = m ? (m.k === "mm" || m.k === "am" ? "purple" : m.k === "m" ? "green" : "") : "";
  const mark = m ? { target: m.sq, arrow: [m.at, m.sq], tone, from: p.from, to: p.to }
    : { from: p.from, to: p.to };

  return `
  <div class="between vhead">
    <button class="btn sm" data-a="back">All games</button>
    <span class="chip ${g.r === "win" ? "good" : g.r === "loss" ? "bad" : "watch"}">${g.r}</span>
  </div>
  <div class="vtitle">
    <div class="t nm">${g.c === "w" ? "White" : "Black"} vs ${esc(g.opp)}${g.op ? ` (${g.op})` : ""}</div>
    <div class="tiny nm">${new Date(g.d).toLocaleDateString()} · ${esc(g.cls)} · ${esc(g.o)} · ${esc(g.end)}</div>
    ${gameStory(g) ? `<p class="story">${esc(gameStory(g))}</p>` : ""}
  </div>
  ${boardHTML(p.board, g.c === "b", mark, S.inspect)}
  ${matBar(p.mat)}
  ${inspectNote(p.board, S.inspect, g.c)}
  <div class="ctrls">
    <button class="btn" data-a="ply" data-d="-1">‹</button>
    <button class="btn" data-a="jump" data-p="${prev === undefined ? "" : prev}" ${prev === undefined ? "disabled" : ""}>Prev</button>
    <button class="btn ${next !== undefined ? "pri" : ""}" data-a="jump" data-p="${next === undefined ? "" : next}" ${next === undefined ? "disabled" : ""}>Next moment</button>
    <button class="btn" data-a="ply" data-d="1">›</button>
  </div>
  <div class="movelist">${plies.map((q, k) => {
    const flag = g.mis.find((x) => x.p === k);
    return `<button class="mv ${k === i ? "on" : ""} ${flag ? "flag" : ""}" data-a="jump" data-p="${k}">
      ${q.mine === (g.c === "w") ? `${q.moveNo}.` : ""}${esc(q.san)}</button>`;
  }).join("")}</div>

  <div class="card ${m ? "flagcard" : ""}">
    <div class="mono">${p.moveNo}${p.mine === (g.c === "w") ? "." : "..."} ${esc(p.san)}
      <span class="faint">${p.mine && p.spent != null ? `${fmtS(p.spent)} on it` : ""}${
        p.check ? (p.mine ? " · check" : " · you were in check") : ""}</span></div>
    ${m ? `<p>${describe(m)}</p><div class="tiny">The arrow shows ${
      m.k === "m" ? "the capture that was available" : m.k === "mm" ? "the mate that was there"
      : m.k === "am" ? "the mate they had in reply" : "which piece could take yours"}.${
      m.ck ? " You were in check when this came up, which is when it is hardest to look around." : ""}</div>`
      : `<div class="tiny">Nothing loose here. Next moment skips to the ones worth seeing.</div>`}
  </div>

  ${g.mis.length ? `<h2>Everything flagged here</h2>
    ${g.mis.slice().sort((a, b) => a.p - b.p).map((x) => `
      <button class="card list ${x.p === i ? "here" : ""}" data-a="jump" data-p="${x.p}">
        <div class="between"><span class="mono acc">move ${x.mv}, ${esc(x.s)}</span>
          <span class="chip ${x.k === "mm" || x.k === "am" ? "purple" : x.k === "m" ? "watch" : x.pun ? "bad" : "watch"}">${esc(KINDNAME[x.k])}</span></div>
        <p>${describe(x)}</p></button>`).join("")}` : ""}`;
}

function screenEmpty() {
  return `<div class="card">
    <div class="t nm">Let's get your games in</div>
    <p>Everything is worked out on your phone and stays here, so next time you only add what is new.</p>
    <button class="btn pri wide" data-a="sync6">Try pulling them from chess.com</button>
    <button class="btn wide" data-a="file">Add a PGN file instead</button>
    <div class="tiny">chess.com does not always allow the direct download from another site. The file
    route always works.</div>
  </div>${howTo()}`;
}

function howTo() {
  const now = new Date();
  const url = `api.chess.com/pub/player/${S.name || "you"}/games/${now.getFullYear()}/${String(now.getMonth() + 1).padStart(2, "0")}/pgn`;
  return `<h2>Getting a month as a file</h2>
  <div class="card">
    <p class="nm">Open this in your browser and the file downloads on its own. Change the year and
    month for older ones.</p>
    <div class="url mono">${esc(url)}</div>
    <div class="tiny">Then tap Add games and pick it. Adding the same games twice is fine.</div>
  </div>
  <h2>Or one game at a time</h2>
  <div class="card">
    <p class="nm">On iPhone: open the game, tap the magnifying glass, then Options, Share, Copy.
    On Android: open the game, tap More at the bottom left, then Export PGN, Copy.</p>
    <textarea id="paste" placeholder="Paste PGN text here"></textarea>
    <button class="btn pri wide" data-a="paste">Add pasted games</button>
  </div>`;
}

/* ---------- written review ---------- */
function briefFor(agg) {
  const sp = styleProfile(agg);
  return {
    gamesReviewed: agg.n, rating: agg.rating, ratingBand: agg.level.label,
    record: { wins: agg.all.w, draws: agg.all.d, losses: agg.all.l },
    scoreAsWhitePct: Math.round(agg.white.score * 100), scoreAsBlackPct: Math.round(agg.black.score * 100),
    typicalOpponentRating: agg.oppAvg, winsAgainstStrongerOpponents: agg.beatStronger,
    whatIsGoingWell: strengths(agg).slice(0, 5).map((s) => `${s.label}: ${s.detail}`),
    reachedWinningPosition: agg.wasWinning, convertedThoseToWins: agg.converted,
    lostAfterBeingWinning: agg.threwAway,
    wonAfterBeingThreeDown: agg.comebacks, gamesWithNoPiecesDropped: agg.clean,
    piecesGivenAwayPerGame: +agg.givenPer.toFixed(2),
    benchmarkForThisRating: `under ${agg.level.give[0]} is good, over ${agg.level.give[1]} is high`,
    freeMaterialMissedPerGame: +agg.missedPer.toFixed(2),
    mateInOneMissed: agg.missedMates, mateInOneAllowed: agg.allowedMates,
    lossesOnTheClockPct: Math.round(agg.timeoutShare * 100),
    checkmatedInsideFifteenMoves: agg.shortMates,
    giveawaysWhileInCheckPct: Math.round(agg.inCheckShare * 100),
    giveawaysInUnderFiveSeconds: agg.rushed, giveawaysWithClockData: agg.mistakeSpendN,
    castledPct: Math.round(agg.castledShare * 100), averageCastlingMove: agg.avgCastleMove,
    piecesStillHomeAtMoveTwelve: +agg.homeAt12.toFixed(1),
    pawnMovesInFirstTen: +agg.pawnPushes.toFixed(1), queenMovesInFirstEight: +agg.queenEarly.toFixed(1),
    averageGameLengthMoves: Math.round(agg.avgLen),
    shareOfMovesThatGiveCheck: +(agg.checkRate).toFixed(3),
    shareOfMovesThatCapture: +(agg.captureRate).toFixed(3),
    styleClosestTo: sp.best.name, styleSecond: sp.second.name,
    mistakesByPhase: agg.byPhase, piecesLostByType: agg.byPiece, howLossesEnd: agg.endings,
    openings: agg.openingList.filter((o) => o.n >= 3).slice(0, 8)
      .map((o) => ({ name: o.name, games: o.n, scorePct: Math.round(o.score * 100) })),
    monthlyTrend: agg.trend,
    momentsWorthReplaying: agg.worst.slice(0, 12).map((m) => ({
      move: `${m.mv}. ${m.s}`, what: KINDNAME[m.k], piece: NAMES[(m.pc || "p").toLowerCase()],
      square: sqName(m.sq), points: m.l, opponentTookIt: m.pun, phase: m.ph, wasInCheck: m.ck,
      materialAtTheTime: m.at_, secondsSpent: m.sp == null ? null : Math.round(m.sp),
      opening: m.g.o, playedAs: m.g.c === "w" ? "white" : "black",
    })),
  };
}

const PROMPT = (brief) =>
`You are a good coach looking over a player's own games with them. Write to them directly, like someone sitting next to them going through it, not like a report.

Their data is below. It comes from a static analyser, not an engine: it can see pieces that could simply be captured, free material that was not taken, and mate in one in both directions. It cannot see pins, forks, plans, structure or anything two moves deep. Never invent engine evaluations, accuracy scores, or opening theory the data does not support. If the data cannot answer something, say so plainly rather than guessing.

Read the rating band before you write. What counts as sloppy at 1800 is normal at 400, and what is normal at 400 would be alarming at 1800. Judge them against their own level, and if the numbers are good for their level, say that clearly instead of hunting for something to criticise.

DATA
${JSON.stringify(brief, null, 2)}

Write about 450 words with these headings on their own lines:

WHAT YOU ARE DOING WELL
Two or three sentences, specific and earned from the data. Not encouragement for its own sake, real things they are doing right.

THE PATTERN WORTH SEEING
The one thing that would change their results most. Explain why it costs them, not just that it does. Where the data lets you, talk about the shape of their games rather than single moves: getting ahead and not converting, collapsing late, and so on.

TWO THINGS TO TRY
Two of them, each with a short heading on its own line. Something concrete to do at the board and why it works. Frame it as a next step from where they already are, not as correcting a fault.

Voice: plain English, contractions, second person, warm and level. Say "this is good, and here is how it gets better" rather than pointing at faults. No em dashes, no markdown, no asterisks, no bullet characters, no flattery, no motivational filler, no restating this brief. Vary sentence length. Sound like a person who has actually looked at these games.`;

function screenReview(agg) {
  const hosted = !window.storage;
  return `<div class="card">
    <div class="t nm">The long version</div>
    <p>Takes everything in the app, including what is going well, and writes it up properly. Saved once written.</p>
    ${hosted && !S.apiKey ? `
      <button class="btn pri wide" data-a="copybrief">Copy it all for Claude</button>
      <div class="tiny">Paste that into Claude and it writes the review. Keeps this app free and offline.</div>
      <button class="lnk" data-a="keyprompt">Or add your own API key so it writes it here</button>`
    : `<button class="btn pri wide" data-a="review" ${S.busy ? "disabled" : ""}>
        ${S.busy ? "Reading your games" : S.review ? "Write a fresh one" : "Write my review"}</button>
      ${S.apiKey ? `<button class="lnk" data-a="keyprompt">Change API key</button>` : ""}`}
    ${S.review ? `<div class="tiny">Last written ${new Date(S.review.when).toLocaleDateString()} from ${S.review.games} games.</div>` : ""}
  </div>
  ${S.review ? `<div class="card coach">${esc(S.review.text)}</div>` : ""}`;
}

/* ============================================================
   RENDER
   ============================================================ */
function render() {
  const app = document.getElementById("app");
  if (!S.ready) { app.innerHTML = `<div class="w"><div class="tiny pad">Loading</div></div>`; return; }
  if (S.screen === "login") { app.innerHTML = `<div class="w">${screenLogin()}</div>`; return; }

  const agg = S.games.length ? aggregate(S.games) : null;
  let body;
  if (S.view) body = screenViewer();
  else if (!S.games.length) body = screenEmpty();
  else if (S.tab === "today") body = screenToday(agg);
  else if (S.tab === "games") body = screenGames(agg);
  else if (S.tab === "you") body = screenYou(agg);
  else body = screenReview(agg);

  const tabs = [["today", "\u25CE", "Today"], ["games", "\u25A4", "Games"],
    ["you", "\u2657", "You"], ["review", "\u2691", "Review"]];

  app.innerHTML = `
    <header><div class="w between">
      <div><h1>Chess post mortem</h1>
        <div class="tiny nm">${S.games.length ? `${esc(S.name)} · ${S.games.length} games` : esc(S.name)}</div></div>
      <div class="hbtns">
        ${S.games.length ? `<button class="btn sm" data-a="sync2" ${S.busy ? "disabled" : ""}>Refresh</button>` : ""}
        <button class="btn pri sm" data-a="file" ${S.busy ? "disabled" : ""}>Add games</button>
      </div></div></header>
    ${S.busy ? `<div class="w"><div class="working"><span class="dot"></span>${esc(S.busy)}</div></div>` : ""}
    ${S.pick ? `<div class="w"><div class="card warn"><div class="t nm">Which player are you?</div>
      <div class="tiny">That file has several names in it.</div>
      <div class="pills">${S.pick.map((o) => `<button class="btn pri sm" data-a="setname" data-n="${esc(o)}">${esc(o)}</button>`).join("")}</div>
    </div></div>` : ""}
    <main class="w">${body}</main>
    ${S.toast ? `<div class="toast">${esc(S.toast)}</div>` : ""}
    ${S.games.length && !S.view ? `<nav class="nav">${tabs.map(([k, gl, l]) =>
      `<button data-a="tab" data-t="${k}" class="${S.tab === k ? "on" : ""}"><span class="g">${gl}</span>${l}</button>`).join("")}</nav>` : ""}`;
}

/* ============================================================
   EVENTS
   ============================================================ */
document.addEventListener("click", async (e) => {
  const el = e.target.closest("[data-a]");
  if (!el) return;
  const a = el.dataset.a;

  if (a === "login") {
    const v = (document.getElementById("user") || {}).value || "";
    if (!v.trim()) return;
    await loadUser(v);
    render();
    await upgradeSaved();
    render();
    if (!S.games.length) syncChessCom(6);
  }
  else if (a === "signout") { S.screen = "login"; S.view = null; S.games = []; S.name = ""; await store.set(LAST, ""); render(); }
  else if (a === "file") document.getElementById("file").click();
  else if (a === "sync6") syncChessCom(6);
  else if (a === "sync2") syncChessCom(2);
  else if (a === "sync12") syncChessCom(12);
  else if (a === "tab") { S.tab = el.dataset.t; S.view = null; S.inspect = null; render(); scrollTo(0, 0); }
  else if (a === "open") { S.view = el.dataset.id; S.ply = +el.dataset.ply; S.inspect = null; render(); scrollTo(0, 0); }
  else if (a === "back") { S.view = null; S.inspect = null; render(); }
  else if (a === "ply") { S.ply += +el.dataset.d; render(); }
  else if (a === "jump") { if (el.dataset.p === "") return; S.ply = +el.dataset.p; render(); }
  else if (a === "sq") { const i = +el.dataset.i; S.inspect = S.inspect === i ? null : i; render(); }
  else if (a === "clearsq") { S.inspect = null; render(); }
  else if (a === "more") { S.shown += 25; render(); }
  else if (a === "paste") { const ta = document.getElementById("paste"); if (ta && ta.value.trim()) importText(ta.value); }
  else if (a === "setname") importText(S.pending, el.dataset.n);
  else if (a === "keyprompt") {
    const k = prompt("Anthropic API key. Stored on this device only.", S.apiKey || "");
    if (k !== null) { S.apiKey = k.trim(); await persist(); render(); }
  }
  else if (a === "copybrief") {
    const txt = PROMPT(briefFor(aggregate(S.games)));
    try { await navigator.clipboard.writeText(txt); S.toast = "Copied. Paste it into Claude."; }
    catch { S.toast = "Could not copy automatically."; }
    render(); setTimeout(() => { S.toast = null; render(); }, 5000);
  }
  else if (a === "review") {
    S.busy = "Reading your games"; render();
    try {
      const headers = { "Content-Type": "application/json" };
      if (S.apiKey) {
        headers["x-api-key"] = S.apiKey;
        headers["anthropic-version"] = "2023-06-01";
        headers["anthropic-dangerous-direct-browser-access"] = "true";
      }
      const agg = aggregate(S.games);
      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST", headers,
        body: JSON.stringify({ model: "claude-sonnet-4-6", max_tokens: 1400,
          messages: [{ role: "user", content: PROMPT(briefFor(agg)) }] }),
      });
      const data = await res.json();
      const out = (data.content || []).filter((b) => b.type === "text").map((b) => b.text).join("\n").trim();
      if (!out) throw new Error("empty");
      S.review = { text: out, when: Date.now(), games: agg.n };
      await persist();
    } catch { S.toast = "That did not come back. Check the key or try again."; }
    S.busy = ""; render();
  }
});

document.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && document.getElementById("user") === document.activeElement) {
    document.querySelector('[data-a="login"]')?.click();
  }
  if (!S.view) return;
  if (e.key === "ArrowRight") { S.ply++; render(); }
  if (e.key === "ArrowLeft") { S.ply--; render(); }
});

document.addEventListener("change", async (e) => {
  if (e.target.id !== "file") return;
  const files = [...e.target.files];
  e.target.value = "";
  if (!files.length) return;
  let all = "";
  for (const f of files) all += (await f.text()) + "\n\n";
  importText(all);
});

let touchX = null;
document.addEventListener("touchstart", (e) => {
  if (e.target.closest(".board")) touchX = e.touches[0].clientX;
}, { passive: true });
document.addEventListener("touchend", (e) => {
  if (touchX == null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  touchX = null;
  if (Math.abs(dx) > 45 && S.view) { S.ply += dx < 0 ? 1 : -1; S.inspect = null; render(); }
}, { passive: true });

(async () => {
  if ("serviceWorker" in navigator && location.protocol === "https:") {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  }
  const last = await store.get(LAST);
  if (last && last.trim()) await loadUser(last);
  S.ready = true;
  render();
  if (S.games.length) { await upgradeSaved(); render(); }
})();
</script>
</body>
</html>
