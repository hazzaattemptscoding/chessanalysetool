  const count = {};
  for (const c of chunks) {
    const t = parseTags(c);
    for (const n of [t.White, t.Black]) if (n) count[n] = (count[n] || 0) + 1;
  }
  const ranked = Object.entries(count).sort((a, b) => b[1] - a[1]);
  if (!ranked.length) return { name: null, options: [] };
  const clear = ranked.length === 1
    || (ranked[0][1] >= chunks.length * 0.8 && ranked[0][1] > ranked[1][1]);
  return { name: clear ? ranked[0][0] : null, options: ranked.slice(0, 6).map((x) => x[0]) };
}

/* ============================================================
   3. NUMBERS
   Bands move with rating. What counts as a lot of dropped
   pieces at 400 is a disaster at 2000, and the other way round.
   ============================================================ */

function levelOf(rating) {
  const r = rating || 600;
  if (r < 600) return { key: "new", label: "just starting out", who: "someone starting out", give: [0.9, 2.2], miss: [0.9, 2.2] };
  if (r < 1000) return { key: "beginner", label: "beginner", who: "a beginner", give: [0.5, 1.4], miss: [0.6, 1.6] };
  if (r < 1400) return { key: "improving", label: "improving", who: "an improving player", give: [0.3, 0.9], miss: [0.4, 1.1] };
  if (r < 1800) return { key: "club", label: "club level", who: "a club player", give: [0.2, 0.55], miss: [0.25, 0.7] };
  if (r < 2200) return { key: "strong", label: "strong", who: "a strong player", give: [0.1, 0.3], miss: [0.12, 0.4] };
  return { key: "expert", label: "expert", who: "an expert", give: [0.04, 0.15], miss: [0.05, 0.2] };
}

function aggregate(games) {
  const rec = (l) => {
    const w = l.filter((g) => g.r === "win").length;
    const d = l.filter((g) => g.r === "draw").length;
    const ls = l.filter((g) => g.r === "loss").length;
    return { w, d, l: ls, n: l.length, score: l.length ? (w + 0.5 * d) / l.length : 0 };
  };
  const n = Math.max(games.length, 1);
  const mis = games.flatMap((g) => g.mis.map((m) => ({ ...m, g })));
  const gave = mis.filter((m) => m.k === "g");
  const taken = gave.filter((m) => m.pun);
  const missed = mis.filter((m) => m.k === "m");
  const missedMates = mis.filter((m) => m.k === "mm");
  const allowedMates = mis.filter((m) => m.k === "am");

  const rating = [...games].reverse().find((g) => g.my)?.my || null;
  const level = levelOf(rating);
  const best = games.reduce((a, g) => (g.my && g.my > a ? g.my : a), 0) || null;

  // whole game outcomes, not just single moves
  const peakOf = (g) => (g.peak !== undefined ? g.peak : Math.max(...g.mat));
  const lowOf = (g) => (g.low !== undefined ? g.low : Math.min(...g.mat));
  const wasWinning = games.filter((g) => peakOf(g) >= 3);
  const convertedWins = wasWinning.filter((g) => g.r === "win");
  const threwAway = wasWinning.filter((g) => g.r === "loss");
  const wasLosing = games.filter((g) => lowOf(g) <= -3);
  const comebacks = wasLosing.filter((g) => g.r === "win");
  const clean = games.filter((g) => !g.mis.some((m) => m.k === "g" && m.pun));
  const cleanWins = clean.filter((g) => g.r === "win");

  const byPhase = ["Opening", "Middlegame", "Endgame"].map((ph) => ({
    phase: ph,
    given: taken.filter((m) => m.ph === ph).length,
    missed: missed.filter((m) => m.ph === ph).length,
  }));

  const byPiece = {};
  for (const m of taken) {
    const k = NAMES[m.pc.toLowerCase()];
    byPiece[k] = (byPiece[k] || 0) + 1;
  }

  const endings = {};
  for (const g of games.filter((x) => x.r === "loss")) endings[g.end] = (endings[g.end] || 0) + 1;

  const spends = gave.filter((m) => m.sp != null).map((m) => m.sp);
  const lossN = games.filter((g) => g.r === "loss").length;
  const timeouts = games.filter((g) => g.r === "loss" && g.end === "You ran out of time").length;
  const shortMates = games.filter((g) => g.r === "loss" && g.end === "You got checkmated" && g.mv <= 15).length;

  const hab = games.map((g) => g.hab).filter(Boolean);
  const avg = (f) => (hab.length ? hab.reduce((a, h) => a + (f(h) || 0), 0) / hab.length : 0);
  const castledShare = hab.length ? hab.filter((h) => h.cas > 0).length / hab.length : 0;

  // where you sit among the people you have actually played
  const oppRatings = games.map((g) => g.op).filter(Boolean);
  const beatBelow = rating && oppRatings.length
    ? oppRatings.filter((o) => o < rating).length / oppRatings.length : null;
  const oppAvg = oppRatings.length ? Math.round(oppRatings.reduce((a, b) => a + b, 0) / oppRatings.length) : null;
  const beatStronger = games.filter((g) => g.r === "win" && g.op && g.my && g.op > g.my);
  const bestWin = beatStronger.reduce((a, g) => (!a || g.op > a.op ? g : a), null);

  const months = {};
  for (const g of games) {
    const k = new Date(g.d).toISOString().slice(0, 7);
    if (!months[k]) months[k] = { key: k, n: 0, taken: 0, missed: 0, rating: [], wins: 0 };
    months[k].n++;
    months[k].taken += g.mis.filter((m) => m.k === "g" && m.pun).length;
    months[k].missed += g.mis.filter((m) => m.k === "m").length;
    if (g.r === "win") months[k].wins++;
    if (g.my) months[k].rating.push(g.my);
  }
  const trend = Object.values(months).sort((a, b) => a.key.localeCompare(b.key)).map((m) => ({
    label: new Date(m.key + "-01").toLocaleDateString(undefined, { month: "short", year: "2-digit" }),
    given: +(m.taken / m.n).toFixed(2), missed: +(m.missed / m.n).toFixed(2),
    winPct: Math.round((m.wins / m.n) * 100),
    rating: m.rating.length ? Math.round(m.rating.reduce((a, b) => a + b, 0) / m.rating.length) : null,
    games: m.n,
  }));

  const openings = {};
  for (const g of games) (openings[g.o || "Unknown"] = openings[g.o || "Unknown"] || []).push(g);
  const openingList = Object.entries(openings).map(([name, gs]) => ({
    name, ...rec(gs), n: gs.length,
    white: gs.filter((g) => g.c === "w").length,
    given: gs.reduce((a, g) => a + g.mis.filter((m) => m.k === "g" && m.pun).length, 0) / gs.length,
  })).sort((a, b) => b.n - a.n);

  const goodMoments = games.flatMap((g) => (g.good || []).map((x) => ({ ...x, g })));
  const order = { mm: 3, am: 2, g: 1, m: 0 };
  const worst = [...mis].sort((a, b) =>
    (order[b.k] - order[a.k]) || (b.l - a.l) || ((b.pun ? 1 : 0) - (a.pun ? 1 : 0)));

  const avgLen = games.reduce((a, g) => a + g.mv, 0) / n;
  const totalMy = hab.reduce((a, h) => a + (h.n || 0), 0) || 1;

  return {
    n: games.length, rating, best, level,
    all: rec(games), white: rec(games.filter((g) => g.c === "w")), black: rec(games.filter((g) => g.c === "b")),
    givenPer: taken.length / n, loosePer: (gave.length - taken.length) / n, missedPer: missed.length / n,
    missedMates: missedMates.length, allowedMates: allowedMates.length,
    matesPunished: allowedMates.filter((m) => m.pun).length,
    timeoutShare: lossN ? timeouts / lossN : 0, timeouts, lossN, shortMates,
    inCheckShare: gave.length ? gave.filter((m) => m.ck).length / gave.length : 0,
    avgMistakeSpend: spends.length ? spends.reduce((a, b) => a + b, 0) / spends.length : null,
    rushed: spends.filter((s) => s <= 5).length, mistakeSpendN: spends.length,
    castledShare, homeAt12: avg((h) => h.home), pawnPushes: avg((h) => h.pw), queenEarly: avg((h) => h.qm),
    checkRate: totalMy ? hab.reduce((a, h) => a + (h.chk || 0), 0) / totalMy : 0,
    captureRate: totalMy ? hab.reduce((a, h) => a + (h.cap || 0), 0) / totalMy : 0,
    avgLen, avgCastleMove: hab.filter((h) => h.cas).length
      ? hab.filter((h) => h.cas).reduce((a, h) => a + h.cas, 0) / hab.filter((h) => h.cas).length : null,
    wasWinning: wasWinning.length, converted: convertedWins.length, threwAway: threwAway.length,
    convertRate: wasWinning.length ? convertedWins.length / wasWinning.length : null,
    wasLosing: wasLosing.length, comebacks: comebacks.length,
    clean: clean.length, cleanWins: cleanWins.length,
    oppAvg, beatBelow, beatStronger: beatStronger.length, bestWin,
    byPhase, byPiece, endings, trend, openingList, worst: worst.slice(0, 40),
    goodMoments: goodMoments.slice(-40).reverse(),
    tookFree: goodMoments.filter((x) => x.k === "took").length,
    savedPieces: goodMoments.filter((x) => x.k === "saved").length,
    matesDelivered: goodMoments.filter((x) => x.k === "win").length,
    bots: games.filter((g) => g.bot).length,
    latestRating: rating, classes: [...new Set(games.map((g) => g.cls))],
    endgameShare: games.filter((g) => g.mv > 30).length / n,
  };
}

/* What is going well. Every entry has to be earned by the data. */
function strengths(agg) {
  const out = [];
  const add = (score, label, detail) => out.push({ score, label, detail });
  if (agg.convertRate !== null && agg.wasWinning >= 3 && agg.convertRate >= 0.6) {
    add(agg.convertRate * 10, "You finish off winning positions",
      `You got a clear material lead in ${agg.wasWinning} games and won ${agg.converted} of them.`);
  }
  if (agg.comebacks >= 2) {
    add(8 + agg.comebacks, "You do not fold when you are behind",
      `You were three points or more down in ${agg.wasLosing} games and still won ${agg.comebacks}.`);
  }
  if (agg.clean / Math.max(agg.n, 1) >= 0.35) {
    add(9, "Plenty of clean games",
      `In ${agg.clean} of your ${agg.n} games you did not lose a single piece outright, and you won ${agg.cleanWins} of those.`);
  }
  if (agg.castledShare >= 0.75) {
    add(7, "You look after your king",
      `Castled in ${Math.round(agg.castledShare * 100)}% of games${agg.avgCastleMove ? `, usually around move ${Math.round(agg.avgCastleMove)}` : ""}.`);
  }
  if (agg.homeAt12 < 1) {
    add(6, "Your pieces come out early",
      `By move twelve you have nearly everything developed, ${agg.homeAt12.toFixed(1)} pieces still at home on average.`);
  }
  if (agg.beatStronger >= 2 && agg.bestWin) {
    add(8, "You beat people above you",
      `${agg.beatStronger} wins against higher rated opponents, the best of them rated ${agg.bestWin.op}.`);
  }
  if (agg.timeoutShare < 0.08 && agg.lossN >= 5) {
    add(5, "Your clock is under control",
      `Barely any of your losses came from running out of time.`);
  }
  if (agg.trend.length >= 3) {
    const first = agg.trend[0], last = agg.trend[agg.trend.length - 1];
    if (last.given < first.given * 0.75) {
      add(11, "You are dropping fewer pieces than you were",
        `Down from ${first.given} a game in ${first.label} to ${last.given} in ${last.label}.`);
    }
    if (last.rating && first.rating && last.rating > first.rating + 25) {
      add(10, "Your rating is going the right way",
        `Up from about ${first.rating} to ${last.rating} across the games saved here.`);
    }
  }
  const good = agg.openingList.filter((o) => o.n >= 4 && o.score >= 0.55);
  if (good.length) {
    const b = good.sort((a, b2) => b2.score - a.score)[0];
    add(7, `The ${b.name} suits you`,
      `${Math.round(b.score * 100)}% score across ${b.n} games, better than the rest of your openings.`);
  }
  if (agg.missedPer < agg.level.miss[0]) {
    add(6, "You take what is offered",
      `Free material rarely goes past you, ${agg.missedPer.toFixed(1)} missed a game.`);
  }
  if (agg.givenPer < agg.level.give[0]) {
    add(12, "You are not dropping pieces",
      `${agg.givenPer.toFixed(1)} a game, which is low for your rating. Plain blunders are not what is deciding your games.`);
  }
  if (!out.length) {
    add(1, "Early days",
      `There are ${agg.n} games in here. Add a few more and the patterns worth praising will show up.`);
  }
  return out.sort((a, b) => b.score - a.score);
}

function metrics(agg) {
  const L = agg.level;
  const band = (v, g, w) => (v <= g ? "good" : v <= w ? "watch" : "fix");
  const out = [];
  out.push({
    id: "given", value: agg.givenPer.toFixed(1), unit: "per game",
    title: "Pieces left where they could be taken", level: band(agg.givenPer, L.give[0], L.give[1]),
    plain: "A piece of yours could simply be captured, and it was.",
    target: `For ${L.who}, under ${L.give[0]} a game is the mark.`,
  });
  out.push({
    id: "missed", value: agg.missedPer.toFixed(1), unit: "per game",
    title: "Free material left on the board", level: band(agg.missedPer, L.miss[0], L.miss[1]),
    plain: "Something of theirs was there for the taking and the move went elsewhere.",
    target: `Under ${L.miss[0]} a game at your level.`,
  });
  if (agg.wasWinning >= 3) {
    const r = agg.convertRate;
    out.push({
      id: "convert", value: Math.round(r * 100) + "%", unit: `of ${agg.wasWinning} winning positions`,
      title: "Turning a lead into a win", level: r >= 0.75 ? "good" : r >= 0.5 ? "watch" : "fix",
      plain: `You were at least three points up in ${agg.wasWinning} games and won ${agg.converted}.`,
      target: "This is the number that separates ratings more than anything else on this page.",
    });
  }
  if (agg.missedMates || agg.allowedMates) {
    out.push({
      id: "mate", value: `${agg.missedMates} / ${agg.allowedMates}`, unit: "missed / allowed",
      title: "Mate in one", level: band((agg.missedMates + agg.allowedMates) / Math.max(agg.n, 1), 0.1, 0.4),
      plain: `Mate was available to you ${agg.missedMates} time${agg.missedMates === 1 ? "" : "s"} and to them ${agg.allowedMates}.`,
      target: "Forcing moves are worth checking first, both directions.",
    });
  }
  if (agg.lossN >= 4) {
    out.push({
      id: "clock", value: Math.round(agg.timeoutShare * 100) + "%", unit: `of ${agg.lossN} losses`,
      title: "Lost on the clock", level: band(agg.timeoutShare, 0.1, 0.25),
      plain: "The position was still alive when the time ran out.",
      target: "Under 10% is fine. Above 25% and the time control is the opponent.",
    });
  }
  out.push({
    id: "castle", value: Math.round(agg.castledShare * 100) + "%", unit: "of games",
    title: "Games where you castled",
    level: agg.castledShare >= 0.8 ? "good" : agg.castledShare >= 0.55 ? "watch" : "fix",
    plain: "King tucked away, rook brought into play.",
    target: "Most games, usually in the first ten moves.",
  });
  return out;
}

/* ============================================================
   4. PLAYING STYLE
   Measured from habits, matched to a well known style.
   It says nothing about strength, only about taste.
   ============================================================ */

const STYLES = [
  { name: "Magnus Carlsen", tag: "the grinder",
    v: { aggr: 0.4, trade: 0.5, len: 0.85, dev: 0.7, risk: 0.3 },
    blurb: "Long games, few wild moments, happy to keep going until the other person cracks. Carlsen built a career on outlasting people rather than blowing them off the board." },
  { name: "Hikaru Nakamura", tag: "the speed merchant",
    v: { aggr: 0.75, trade: 0.6, len: 0.4, dev: 0.6, risk: 0.6 },
    blurb: "Fast, sharp, comfortable in a mess. Nakamura made his name in speed chess where finding something quickly beats finding the best thing slowly." },
  { name: "Mikhail Tal", tag: "the attacker",
    v: { aggr: 0.9, trade: 0.35, len: 0.45, dev: 0.6, risk: 0.95 },
    blurb: "Throws pieces at the king and works it out on the way. Tal gave away material constantly and won because nobody could handle the chaos." },
  { name: "Tigran Petrosian", tag: "the wall",
    v: { aggr: 0.2, trade: 0.35, len: 0.75, dev: 0.7, risk: 0.15 },
    blurb: "Quiet, careful, nothing loose anywhere. Petrosian was famously hard to beat because he saw the danger before it arrived." },
  { name: "Jose Raul Capablanca", tag: "the simplifier",
    v: { aggr: 0.35, trade: 0.85, len: 0.7, dev: 0.8, risk: 0.2 },
    blurb: "Trades pieces off and wins the simple positions. Capablanca made chess look easy by removing everything complicated from the board." },
  { name: "Paul Morphy", tag: "the developer",
    v: { aggr: 0.7, trade: 0.5, len: 0.3, dev: 0.95, risk: 0.6 },
    blurb: "Everything out fast, king safe, then attack. Morphy beat the best players of his day mostly by developing quicker than they did." },
  { name: "Garry Kasparov", tag: "the pressure player",
    v: { aggr: 0.8, trade: 0.45, len: 0.6, dev: 0.8, risk: 0.7 },
    blurb: "Grabs the initiative early and never gives it back. Kasparov played like the game was his to lose from move one." },
  { name: "Anatoly Karpov", tag: "the squeezer",
    v: { aggr: 0.25, trade: 0.6, len: 0.8, dev: 0.75, risk: 0.2 },
    blurb: "Takes small advantages and slowly tightens. Karpov rarely attacked, he just left opponents with less and less to do." },
];

function styleProfile(agg) {
  const clamp = (x) => Math.max(0, Math.min(1, x));
  const v = {
    aggr: clamp(agg.checkRate * 7),
    trade: clamp(agg.captureRate * 3.2),
    len: clamp((agg.avgLen - 15) / 35),
    dev: clamp(1 - agg.homeAt12 / 3),
    risk: clamp((agg.givenPer / Math.max(agg.level.give[1], 0.2)) * 0.5 + agg.loosePer * 0.12),
  };
  const scored = STYLES.map((s) => ({
    ...s,
    dist: Math.sqrt(Object.keys(v).reduce((a, k) => a + (v[k] - s.v[k]) ** 2, 0)),
  })).sort((a, b) => a.dist - b.dist);
  const axes = [
    { key: "aggr", left: "quiet", right: "aggressive", val: v.aggr,
      note: `You give check on ${Math.round(agg.checkRate * 100)}% of your moves.` },
    { key: "trade", left: "keeps pieces on", right: "trades a lot", val: v.trade,
      note: `${Math.round(agg.captureRate * 100)}% of your moves are captures.` },
    { key: "len", left: "short games", right: "long games", val: v.len,
      note: `Your games run about ${Math.round(agg.avgLen)} moves.` },
    { key: "dev", left: "slow to develop", right: "quick to develop", val: v.dev,
      note: `${agg.homeAt12.toFixed(1)} pieces still at home at move twelve.` },
    { key: "risk", left: "careful", right: "loose", val: v.risk,
      note: `Based on how much you leave hanging.` },
  ];
  return { v, axes, best: scored[0], second: scored[1] };
}

/* ============================================================
   5. OPENINGS IN PLAIN ENGLISH
   ============================================================ */

const OPENING_NOTES = {
  "Kings Pawn": "White starts 1.e4, the most direct first move there is. It opens lines for the queen and a bishop straight away and usually leads to open, tactical games.",

function openingNote(name) {
  if (!name) return null;
  if (OPENING_NOTES[name]) return OPENING_NOTES[name];
  const key = Object.keys(OPENING_NOTES).find((k) => name.startsWith(k) || k.startsWith(name));
  if (key) return OPENING_NOTES[key];
  if (/Defense|Defence/i.test(name)) return "A way for Black to answer White's first move. Not a common enough opening here to say much about it.";
  if (/Gambit/i.test(name)) return "A gambit, meaning one side gives up a pawn early to get their pieces out faster.";
  return "Not one of the common openings, so there is not much to say beyond what your own games show.";
}
/* ============================================================
   6. VOICE
   Text is composed from the numbers rather than stored whole,
   and the phrasing is seeded per player, so two people with
   different games get different writing.
   ============================================================ */

function hashStr(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function rngFrom(seed) {
  let a = seed >>> 0;
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function makePick(seedStr) {
  const r = rngFrom(hashStr(seedStr));
  return (arr) => arr[Math.floor(r() * arr.length) % arr.length];
}

/* The shape of one game, from the material line. */
function gameStory(g) {
  const mat = g.mat || [];
  if (!mat.length) return "";
  const peak = Math.max(...mat), low = Math.min(...mat), end = mat[mat.length - 1];
  const won = g.r === "win", lost = g.r === "loss";
  let biggest = 0, at = 0;
  for (let i = 1; i < mat.length; i++) {
    const d = mat[i - 1] - mat[i];
    if (d > biggest) { biggest = d; at = Math.ceil((i + 1) / 2); }
  }
  const oneMoment = biggest >= 3 && biggest >= (peak - low) * 0.5;
  if (won && low >= -1 && peak >= 3) return "You were in front for most of this and saw it through.";
  if (won && low <= -3) return `You were ${-low} points down at one stage and still won it.`;
  if (won) return "A close one that went your way.";
  if (lost && peak >= 3 && oneMoment) return `You were ${peak} points up before it turned, and most of that went in one move around move ${at}.`;
  if (lost && peak >= 3) return `You had a ${peak} point lead in this one and it slipped away gradually.`;
  if (lost && oneMoment) return `Fairly level until move ${at}, where ${biggest} points went in one go.`;
  if (lost && low <= -5) return "This one got away early and stayed away.";
  if (lost) return "Close on material the whole way, decided by something other than pieces.";
  if (Math.abs(end) <= 1) return "Level from start to finish.";
  return "";
}

/* ---- the written narrative, composed fresh each time ---- */
function narrative(agg, seedStr) {
  const pick = makePick(seedStr + agg.n + Math.round(agg.givenPer * 100));
  const L = agg.level;
  const str = strengths(agg);
  const out = { opener: "", strengths: str.slice(0, 3), focus: [], footnote: "" };

  const top = str[0];
  const openers = [
    `Across ${agg.n} games the clearest thing in your favour is this: ${lower1(top.label)}. ${top.detail}`,
    `${agg.n} games in, and the thing that stands out first is that ${lower1(top.label)}. ${top.detail}`,
    `Starting with what is going right over these ${agg.n} games: ${lower1(top.label)}. ${top.detail}`,
  ];
  out.opener = pick(openers);

  const add = (score, title, body) => out.focus.push({ score, title, body });

  // conversion, the strategic one
  if (agg.wasWinning >= 3 && agg.convertRate !== null && agg.convertRate < 0.7) {
    add(50, "Holding on to a winning position", pick([
      `You reached a clear material lead in ${agg.wasWinning} games and came away with the win in ${agg.converted}. That gap is where most of your points are going, and it is not a knowledge problem, it is what happens when the position feels won and the checking stops. When you go a piece up, the useful instinct is to trade pieces off rather than start something new. Fewer pieces means fewer ways for it to go wrong, and a piece up in a simple position wins almost by itself.`,
      `The lead is not the problem, keeping it is. ${agg.wasWinning} of your games had you three points or more ahead and ${agg.threwAway} of those ended in a loss. Once you are ahead, the goal changes: swap pieces whenever it is a fair trade, keep the king safe, and let the extra material do the work. Most players at your level lose won games by trying to win them twice.`,
      `You get ahead often enough, ${agg.wasWinning} games with a clear lead, but only ${agg.converted} of those turned into wins. Worth sitting with. When the material count goes your way, slow down rather than speed up, and look for trades. A queen swap when you are a rook up is almost always the right call, even if it feels like giving up on the attack.`,
    ]));
  }

  // the material leak, framed by level
  if (agg.givenPer > L.give[0] * 1.25) {
    const many = agg.givenPer > L.give[1];
    add(40 + agg.givenPer * 5, "Seeing what their move just did", pick([
      `${agg.givenPer.toFixed(1)} pieces a game are going where they can simply be taken, which is ${many ? "on the high side" : "a little above the mark"} for ${L.who}. Nearly all of these come from the same thing: their move changed what is attacked, and the reply was chosen before that sank in. One habit fixes most of it. When it is your turn, look at the piece they just moved, and ask what it now touches. Then pick your move.`,
      `The main material leak is ${agg.givenPer.toFixed(1)} pieces a game left where a capture wins them. That is ${many ? "worth real attention" : "not far off where you want it, but there is room"}. The reason it keeps happening is that it is easy to look at your own plan and not at their last move. Before you commit, one question: what does their piece attack now that it did not a moment ago?`,
      `You are handing over about ${agg.givenPer.toFixed(1)} a game. ${many ? "That is the single biggest thing on this page." : "Not disastrous, but it is the cheapest thing to improve."} The fix is a habit rather than knowledge. Their move, then your move: check what changed first. Most of the time nothing has, and it costs you two seconds.`,
    ]));
  }

  // free material
  if (agg.missedPer > L.miss[0] * 1.25) {
    add(30 + agg.missedPer * 4, "Scanning their side of the board", pick([
      `There is ${agg.missedPer.toFixed(1)} free material a game going past you. This one is easy to shift because you are already looking at the board, just at your own half of it. Before you settle on a move, run down their pieces and ask which have nothing defending them. It also tends to improve everything else, because the habit of looking at their pieces is the same habit that stops you dropping your own.`,
      `${agg.missedPer.toFixed(1)} times a game something of theirs was there for the taking. Worth building a routine around: their loose pieces first, your loose pieces second, then your idea. In that order. Free material is not exciting but it is the most reliable way to be ahead when the endgame comes.`,
      `You are leaving about ${agg.missedPer.toFixed(1)} free pieces a game on the board. Usually that means the attention is on a plan rather than the position. There is nothing wrong with the plan, but a quick scan of what is undefended costs nothing and often changes the plan for the better.`,
    ]));
  }

  // mate patterns
  if (agg.missedMates >= 2 || agg.allowedMates >= 2) {
    const g = agg.worst.filter((m) => m.k === "mm")[0];
    add(45, "Checking the forcing moves", pick([
      `Mate in one was available to you ${agg.missedMates} time${agg.missedMates === 1 ? "" : "s"} and to them ${agg.allowedMates}. ${g ? `One of them was move ${g.mv} in your ${g.g.o} game, where ${sqName(g.at)} to ${sqName(g.sq)} finished it. ` : ""}Both directions come from the same habit. Once the board thins out and a king is short of squares, go through every check you have before anything else, then do the same for theirs. It takes seconds and it decides a lot of games at this level.`,
      `There were ${agg.missedMates} mates you had and ${agg.allowedMates} you allowed. Neither number means you cannot see mate, it means the checks are not being looked at first. When a king has few squares, checks are the whole game. Try every one of yours, then look at every one of theirs before you move.`,
      `The forcing stuff is slipping past in both directions, ${agg.missedMates} mates missed and ${agg.allowedMates} handed over. Endgames with exposed kings are where this lives. A simple order helps: checks, captures, threats, and only then the quiet move you were planning.`,
    ]));
  }

  // where the trouble sits
  const ph = [...agg.byPhase].sort((a, b) => (b.given + b.missed) - (a.given + a.missed))[0];
  if (ph && ph.given + ph.missed >= 6) {
    const share = (ph.given + ph.missed) /
      Math.max(agg.byPhase.reduce((a, p) => a + p.given + p.missed, 0), 1);
    if (share > 0.45) {
      const where = { Opening: "the first ten moves", Middlegame: "the middlegame", Endgame: "the endgame" }[ph.phase];
      add(35, `Most of it happens in ${where}`, pick([
        `${Math.round(share * 100)}% of everything flagged in your games lands in ${where}. ${ph.phase === "Endgame" ? "That is common and it is usually about attention rather than technique. Endgames feel slower, so the checking gets lazy, but with fewer pieces each mistake is worth more, not less." : ph.phase === "Opening" ? "That normally means moves are being played from memory or habit rather than from the position in front of you." : "The middlegame is where the most pieces can see the most squares, so it is the hardest place to keep track. Slowing down for the two or three moves after the last piece develops usually catches it."}`,
        `Your mistakes are not spread evenly. ${where} holds ${Math.round(share * 100)}% of them. ${ph.phase === "Endgame" ? "Worth knowing, because it means the openings are fine and the work is at the other end of the game." : "Worth knowing, because it tells you which part of the game to slow down in."}`,
      ]));
    }
  }

  // clock
  if (agg.timeoutShare > 0.15 && agg.lossN >= 4) {
    add(38, "The clock is part of the result", pick([
      `${Math.round(agg.timeoutShare * 100)}% of your losses were time running out rather than the position going wrong. That is worth fixing before anything technical, because none of the habits above are possible without seconds to spend. Longer time controls for a month, then judge everything else.`,
      `Time is deciding ${Math.round(agg.timeoutShare * 100)}% of your defeats. The positions were still alive. If you are on the quick formats, a spell of ten or fifteen minute games gives every other improvement room to happen.`,
    ]));
  }

  // rushing
  if (agg.mistakeSpendN >= 8 && agg.rushed / agg.mistakeSpendN > 0.3) {
    add(28, "The fast moves cost the most", pick([
      `${Math.round((agg.rushed / agg.mistakeSpendN) * 100)}% of the pieces you drop go on moves played in under five seconds, and they are usually the obvious looking ones. Recaptures especially. A count of three before every move, including the ones you are sure about, catches most of it.`,
      `Most of your material goes in moves you barely thought about. The pattern is not that the positions were hard, it is that they looked easy. Obvious moves deserve the same two seconds as hard ones.`,
    ]));
  }

  // king safety
  if (agg.castledShare < 0.6) {
    add(26, "Getting the king out of the middle", pick([
      `You castled in ${Math.round(agg.castledShare * 100)}% of these games. A king in the centre is not automatically losing, but it means every open line points at you, and it makes the middlegame far harder to calculate. Pieces out, then castle, then plan.`,
      `Only ${Math.round(agg.castledShare * 100)}% of your games have you castling. It is not the flashiest habit to build, but a safe king turns a lot of scary positions into ordinary ones.`,
    ]));
  }

  // development
  if (agg.homeAt12 >= 1.5) {
    add(22, "Getting everyone into the game", pick([
      `By move twelve you still have ${agg.homeAt12.toFixed(1)} of your knights and bishops on their starting squares. A piece at home defends nothing useful and attacks nothing at all. Aim to have all four out and the king castled before you go looking for a plan, and the plan tends to appear on its own.`,
      `On average ${agg.homeAt12.toFixed(1)} pieces are still sitting at home at move twelve. Getting them out is not about theory, it is about having something to play with when the position opens.`,
    ]));
  }

  out.focus = out.focus.sort((a, b) => b.score - a.score).slice(0, 3);
  if (!out.focus.length) {
    out.focus.push({
      title: "Not much for this tool to grip",
      body: `The plain mistakes it looks for barely show up in your games. At this level the difference is made by things it cannot see, like plans, structure and calculating two or three moves deep. Use the game browser to walk through your losses instead, and treat the numbers here as background.`,
    });
  }
  out.footnote = pick([
    `All of this comes from counting what is on the board, not from an engine. It sees pieces that could be captured and mates in one. It does not see plans, pins or anything two moves deep.`,
    `Worth remembering that this is arithmetic rather than an engine. Plain captures and mate in one are visible to it, everything deeper is not.`,
  ]);
  return out;
}

const lower1 = (s) => s.charAt(0).toLowerCase() + s.slice(1);
/* ============================================================
   7. A SMALL SEARCH
   Material only, alpha beta, with a capture-only extension so it
   does not stop in the middle of a trade. It is not Stockfish and
   it does not pretend to be: it finds material and mate, which is
   what decides games below club level.
   ============================================================ */

const MATE = 30000;

function orderMoves(state, moves) {
  return moves.sort((a, b) => {
    const va = VAL[(state.board[a.to] || ".").toLowerCase()] || 0;
    const vb = VAL[(state.board[b.to] || ".").toLowerCase()] || 0;
    return vb - va;
  });
}

function qsearch(state, alpha, beta, d) {
  const stand = material(state.board, state.turn);
  if (d === 0) return stand;
  if (stand >= beta) return beta;
  if (stand > alpha) alpha = stand;
  const caps = orderMoves(state, allLegalMoves(state).filter((m) => state.board[m.to] !== "."));
  for (const m of caps) {
    const sc = -qsearch(m.after, -beta, -alpha, d - 1);
    if (sc >= beta) return beta;
    if (sc > alpha) alpha = sc;
  }
  return alpha;
}

function negamax(state, depth, alpha, beta) {
  const moves = allLegalMoves(state);
  if (!moves.length) return inCheck(state, state.turn) ? -(MATE + depth) : 0;
  if (depth === 0) return qsearch(state, alpha, beta, 4);
  orderMoves(state, moves);
  let best = -Infinity;
  for (const m of moves) {
    const sc = -negamax(m.after, depth - 1, -beta, -alpha);
    if (sc > best) best = sc;
    if (best > alpha) alpha = best;
    if (alpha >= beta) break;
  }
  return best;
}

/* Best move for the side to move. Returns null in a finished position. */
function bestMove(state, depth = 4) {
  const moves = orderMoves(state, allLegalMoves(state));
  if (!moves.length) return null;
  let best = null, alpha = -Infinity;
  for (const m of moves) {
    const sc = -negamax(m.after, depth - 1, -Infinity, -alpha);
    if (!best || sc > best.score) best = { ...m, score: sc };
    if (sc > alpha) alpha = sc;
  }
  const now = material(state.board, state.turn);
  return {
    from: best.from, to: best.to, promo: best.promo,
    score: best.score, gain: best.score - now,
    mate: best.score > MATE - 100,
    san: toSAN(state, best.from, best.to, best.promo),
  };
}

/* How good was the move actually played, on the same scale. */
function scoreMove(state, from, to, promo, depth = 4) {
  const after = makeMove(state, from, to, promo);
  return -negamax(after, depth - 1, -Infinity, Infinity);
}

/* ============================================================
   8. WRITING MOVES DOWN
   ============================================================ */

function toSAN(state, from, to, promo) {
  const p = state.board[from];
  if (!p || p === ".") return "";
  const t = p.toLowerCase();
  if (t === "k" && Math.abs(fileOf(to) - fileOf(from)) === 2) {
    return fileOf(to) === 6 ? "O-O" : "O-O-O";
  }
  const isCap = state.board[to] !== "." || (t === "p" && fileOf(from) !== fileOf(to));
  let s = "";
  if (t !== "p") {
    s += p.toUpperCase();
    const rivals = allLegalMoves(state).filter((m) =>
      m.to === to && m.from !== from && state.board[m.from] === p);
    if (rivals.length) {
      const sameFile = rivals.some((m) => fileOf(m.from) === fileOf(from));
      const sameRank = rivals.some((m) => rankOf(m.from) === rankOf(from));
      if (!sameFile) s += "abcdefgh"[fileOf(from)];
      else if (!sameRank) s += String(8 - rankOf(from));
      else s += sqName(from);
    }
  } else if (isCap) s += "abcdefgh"[fileOf(from)];
  if (isCap) s += "x";
  s += sqName(to);
  if (promo) s += "=" + promo;
  const after = makeMove(state, from, to, promo);
  if (inCheck(after, after.turn)) s += hasAnyLegalMove(after) ? "+" : "#";
  return s;
}

/* Notation as a person would say it out loud. */
function sanToWords(san) {
  if (!san) return "";
  if (/^(O-O-O|0-0-0)/.test(san)) return "castles queenside";
  if (/^(O-O|0-0)/.test(san)) return "castles kingside";
  const m = san.match(/^([KQRBN])?([a-h])?([1-8])?(x)?([a-h][1-8])(?:=([QRBN]))?([+#])?$/);
  if (!m) return san;
  const piece = m[1] ? NAMES[m[1].toLowerCase()] : "pawn";
  const fromHint = m[2] || m[3] ? ` (the ${m[2] || ""}${m[3] || ""} one)` : "";
  let out = `${piece}${fromHint} ${m[4] ? "takes on" : "to"} ${m[5]}`;
  if (m[6]) out += `, promoting to a ${NAMES[m[6].toLowerCase()]}`;
  if (m[7] === "+") out += ", check";
  if (m[7] === "#") out += ", checkmate";
  return out;
}

const moveWords = (from, to, piece) =>
  `${NAMES[(piece || "p").toLowerCase()]} on ${sqName(from)} to ${sqName(to)}`;

/* ============================================================
   9. WHY IT HAPPENED
   ============================================================ */

function whyFor(m, plies) {
  const bits = [];
  const p = plies[m.p];
  if (!p) return bits;
  const board = p.board;
  const attacker = board[m.at];
  const theirLast = plies[m.p - 1];

  if (m.k === "g") {
    const piece = NAMES[(m.pc || "p").toLowerCase()];
    const atkName = attacker && attacker !== "." ? NAMES[attacker.toLowerCase()] : "piece";
    bits.push(`Their ${atkName} on ${sqName(m.at)} is what takes it.`);
    if (theirLast && theirLast.to === m.at) {
      bits.push(`That ${atkName} arrived on the move immediately before yours, so the attack was brand new when you moved.`);
    } else if (theirLast) {
      bits.push(`It was already there before your move, so the attack was on the board while you were deciding.`);
    }
    bits.push(m.df === false
      ? `Nothing of yours was covering ${sqName(m.sq)}, so it was simply free.`
      : `You had it defended, but their attacker was worth less than the piece it was taking.`);
    if (m.ck) bits.push(`You were in check, so your choice of moves was narrow.`);
    if (m.sp != null && m.sp <= 5) bits.push(`You played it in ${m.sp < 10 ? m.sp.toFixed(1) : Math.round(m.sp)} seconds.`);
  } else if (m.k === "m") {
    bits.push(`Your ${NAMES[(board[m.at] || "p").toLowerCase()]} on ${sqName(m.at)} could have taken it.`);
    if (theirLast && theirLast.to === m.sq) bits.push(`They had just moved it there.`);
  } else if (m.k === "mm") {
    bits.push(`${moveWords(m.at, m.sq, board[m.at])} was mate on the spot.`);
  } else if (m.k === "am") {
    bits.push(`Their ${NAMES[(board[m.at] || "q").toLowerCase()]} reaches ${sqName(m.sq)} and your king has nowhere to go.`);
  }
  return bits;
}

/* ============================================================
   10. SIX AREAS
   Scored against the target for the player's own rating band,
   not against other people. There is no public dataset of what
   an average 900 does, so nothing here pretends there is.
   ============================================================ */

function areaScores(agg) {
  const L = agg.level;
  const clamp = (x) => Math.max(0, Math.min(100, Math.round(x)));
  const inv = (v, target, bad) => clamp(100 - ((v - target) / Math.max(bad - target, 0.01)) * 55);

  const openings = clamp(
    (agg.castledShare * 45) + ((3 - Math.min(agg.homeAt12, 3)) / 3) * 35 +
    (agg.pawnPushes <= 4 ? 20 : agg.pawnPushes <= 5 ? 12 : 4));
  const tactics = clamp((inv(agg.givenPer, L.give[0], L.give[1]) + inv(agg.missedPer, L.miss[0], L.miss[1])) / 2);
  const endgamePh = agg.byPhase.find((p) => p.phase === "Endgame") || { given: 0, missed: 0 };
  const endgameRate = agg.n ? (endgamePh.given + endgamePh.missed) / agg.n : 0;
  const endgame = clamp(inv(endgameRate, L.give[0], L.give[1] * 2));
  const advantage = agg.wasWinning >= 2 && agg.convertRate !== null
    ? clamp(agg.convertRate * 100) : null;
  const resource = agg.wasLosing >= 2
    ? clamp(30 + (agg.comebacks / agg.wasLosing) * 140) : null;
  const timeScore = clamp(100 - agg.timeoutShare * 220
    - (agg.mistakeSpendN ? (agg.rushed / agg.mistakeSpendN) * 40 : 0));

  return [
    { key: "openings", label: "Openings", v: openings,
      note: `Castling, development and early pawn moves.` },
    { key: "tactics", label: "Not dropping things", v: tactics,
      note: `Pieces kept safe and free material taken.` },
    { key: "endgame", label: "Endgame", v: endgame,
      note: `How much goes wrong once the board thins out.` },
    { key: "advantage", label: "Closing it out", v: advantage,
      note: advantage === null ? `Not enough winning positions yet to judge.` : `Turning a material lead into the point.` },
    { key: "resource", label: "Fighting back", v: resource,
      note: resource === null ? `Not enough losing positions yet to judge.` : `Getting results from bad positions.` },
    { key: "time", label: "Clock", v: timeScore,
      note: `Time trouble and moves played too fast.` },
  ];
}

/* ============================================================
   11. PRACTICE
   Every drill is a real position from one of their own games.
   ============================================================ */

function buildDrills(games, name, limit = 12, replayCache) {
  const pool = [];
  for (const g of games) {
    for (const m of g.mis) {
      if (m.k === "mm") pool.push({ g, m, kind: "mate", score: 100 });
      else if (m.k === "m" && m.l >= 3) pool.push({ g, m, kind: "take", score: 50 + m.l });
      else if (m.k === "g" && m.pun && m.l >= 3) pool.push({ g, m, kind: "save", score: 30 + m.l });
    }
  }
  pool.sort((a, b) => b.score - a.score || b.g.d - a.g.d);
  // mix the kinds up rather than serving twelve of whichever is most common
  const out = [];
  const seen = new Set();
  const cap = { mate: Math.ceil(limit / 2), take: Math.ceil(limit * 0.45), save: Math.ceil(limit * 0.45) };
  const used = { mate: 0, take: 0, save: 0 };
  for (const c of pool) {
    if (out.length >= limit) break;
    if (used[c.kind] >= cap[c.kind] && out.length < limit - 2) continue;
    const key = c.g.id + ":" + c.m.p;
    if (seen.has(key)) continue;
    seen.add(key);
    used[c.kind]++;
    let rep = replayCache.get(c.g.id);
    if (!rep) {
      try { rep = replay(c.g.pgn, name); } catch { rep = null; }
      if (!rep) continue;
      replayCache.set(c.g.id, rep);
    }
    const plies = rep.plies;
    const idx = c.m.p;
    // the position the player was looking at, before their move
    const before = idx > 0 ? plies[idx - 1].board : START;
    const st = { board: before.split(""), turn: rep.color, castling: "KQkq", ep: null };
    if (!allLegalMoves(st).length) continue;
    out.push({
      id: key, kind: c.kind, board: before, color: rep.color,
      target: c.m.sq, hintFrom: c.m.at, played: c.m.s, moveNo: c.m.mv,
      opening: c.g.o, date: c.g.d, gameId: c.g.id, ply: idx, points: c.m.l,
    });
  }
  return out;
}

/* Judge an attempt. Returns {ok, why, best}. */
function judgeDrill(d, from, to, promo) {
  const st = { board: d.board.split(""), turn: d.color, castling: "KQkq", ep: null };
  const legal = allLegalMoves(st).some((m) => m.from === from && m.to === to);
  if (!legal) return { ok: false, why: "That is not a legal move here." };
  const san = toSAN(st, from, to, promo);
  const after = makeMove(st, from, to, promo);
  if (d.kind === "mate") {
    const ok = isCheckmate(after);
    return { ok, san, why: ok ? "That is mate. Game over." : "Not mate. The king still has a way out or something can block." };
  }
  if (d.kind === "take") {
    const ok = to === d.target;
    return { ok, san, why: ok ? "That is the free one." : `Not that one. Look for a piece of theirs that nothing is defending.` };
  }
  // save: anything that does not lose the material is accepted
  const best = bestMove(st, 3);
  const got = -negamax(after, 2, -Infinity, Infinity);
  const ok = best ? got >= best.score - 1 : true;
  return { ok, san, why: ok ? "That holds it together." : "That still drops material. Something else keeps everything defended." };
}

function drillPrompt(d) {
  if (d.kind === "mate") return "There is mate in one here. Find it.";
  if (d.kind === "take") return "Something of theirs is free. Take it.";
  return "Something of yours is about to be lost. Find a move that keeps it.";
}
/* ============================================================
   12. WHAT TO ACTUALLY GO AND DO
   Only names things chess.com genuinely has: Puzzles, Puzzle Rush,
   Lessons, Drills, Bots, Game Review, and the time controls.
   ============================================================ */

function todoList(agg) {
  const L = agg.level, out = [];
  const add = (score, what, where, why) => out.push({ score, what, where, why });

  if (agg.givenPer > L.give[0] * 1.25) {
    add(50 + agg.givenPer * 10,
      "Ten puzzles before you play, not after",
      "Puzzles on chess.com",
      `You are leaving ${agg.givenPer.toFixed(1)} pieces a game where they can be taken. Puzzles warm up the part of your brain that looks for captures, and doing them first means you start your games already looking.`);
  }
  if (agg.missedPer > L.miss[0] * 1.25) {
    add(40,
      "Puzzle Rush, three minute mode",
      "Puzzle Rush on chess.com",
      `You walk past ${agg.missedPer.toFixed(1)} free pieces a game. Puzzle Rush starts easy and most of the early ones are simply spotting what is loose, which is exactly the habit that is missing.`);
  }
  if (agg.timeoutShare > 0.15 && agg.lossN >= 4) {
    add(60,
      "Switch to 10 or 15 minute games for a month",
      "New Game, time control picker",
      `${Math.round(agg.timeoutShare * 100)}% of your losses were the clock. Nothing else on this list is possible without time to think, so this comes first.`);
  }
  if (agg.wasWinning >= 3 && agg.convertRate !== null && agg.convertRate < 0.7) {
    add(55,
      "Play out winning positions against a bot",
      "Bots on chess.com, set the level near your rating",
      `You reached a winning position in ${agg.wasWinning} games and won ${agg.converted}. A bot will not resign, so you have to actually finish it, which is the skill you are missing.`);
  }
  if (agg.missedMates + agg.allowedMates >= 3) {
    add(45,
      "Run the checkmate patterns",
      "Lessons, checkmate section",
      `Mate was on the board ${agg.missedMates + agg.allowedMates} times across these games in one direction or the other. The patterns repeat, and once you know them you see them.`);
  }
  const endg = agg.byPhase.find((p) => p.phase === "Endgame");
  if (endg && agg.n && (endg.given + endg.missed) / agg.n > L.give[1]) {
    add(35,
      "Do the basic endgame drills",
      "Drills on chess.com",
      "Most of what goes wrong in your games happens once the board is nearly empty. Drills put you in those positions on purpose.");
  }
  if (agg.castledShare < 0.6) {
    add(30,
      "Five games where you castle by move ten, no exceptions",
      "Any time control",
      `You castled in ${Math.round(agg.castledShare * 100)}% of these. Make it a rule for five games and see what it does to the rest of your play.`);
  }
  if (!out.length) {
    add(10,
      "Review one loss properly each session",
      "Game Review, or the Games tab here",
      "Nothing in your numbers is obviously leaking, so the next gains come from understanding whole games rather than drilling single moves.");
  }
  return out.sort((a, b) => b.score - a.score).slice(0, 3);
}

/* ============================================================
   13. OPENING SUGGESTIONS
   ============================================================ */

const STARTER_OPENINGS = {
  white: { name: "Italian Game", moves: "1.e4 e5 2.Nf3 Nc6 3.Bc4",
    why: "Everything comes out fast, the bishop points at the weakest square near their king, and you can castle by move four. The plans are obvious, which is exactly what you want while you are still learning to spot captures." },
  black_e4: { name: "answer 1.e4 with 1...e5", moves: "1.e4 e5",
    why: "Mirror them. You get the same open, straightforward game you already know from the white side, so you are learning one type of position instead of two." },
  black_d4: { name: "answer 1.d4 with 1...d5", moves: "1.d4 d5",
    why: "Same idea. Meet the centre pawn with your own, get the pieces out, castle. No memorising." },
};

function openingAdvice(agg) {
  const enough = agg.openingList.filter((o) => o.n >= 4);
  const asWhite = enough.filter((o) => o.white >= o.n / 2);
  const asBlack = enough.filter((o) => o.white < o.n / 2);
  const pickBest = (list) => (list.length ? [...list].sort((a, b) => b.score - a.score)[0] : null);
  const pickWorst = (list) => (list.length ? [...list].sort((a, b) => a.score - b.score)[0] : null);
  const best = pickBest(enough), worst = pickWorst(enough);

  const out = { best: null, worst: null, white: pickBest(asWhite), black: pickBest(asBlack), starter: null };
  if (best && best.score >= 0.5) out.best = best;
  if (worst && best && worst.name !== best.name && best.score - worst.score > 0.2) out.worst = worst;
  if (!enough.length) {
    out.starter = STARTER_OPENINGS;
    out.starterWhy = `You have not played any opening enough times for the numbers to mean anything yet. Until then, the useful thing is to play the same one every game so you start to recognise the positions.`;
  }
  return out;
}

/* ============================================================
   14. DEBRIEF
   Covers only the games that just came in.
   ============================================================ */

function debriefFor(fresh, all) {
  if (!fresh.length) return null;
  const w = fresh.filter((g) => g.r === "win").length;
  const d = fresh.filter((g) => g.r === "draw").length;
  const l = fresh.filter((g) => g.r === "loss").length;
  const agg = aggregate(fresh);
  const before = all.length > fresh.length ? aggregate(all.slice(0, all.length - fresh.length)) : null;

  const headline = w > l
    ? `${w} won, ${l} lost. A good run.`
    : w === l ? `${w} won, ${l} lost${d ? `, ${d} drawn` : ""}. Even.`
      : `${w} won, ${l} lost. A rough one.`;

  // what went well, and there is always something
  const wins = [];
  if (agg.matesDelivered) wins.push(`You finished ${agg.matesDelivered} game${agg.matesDelivered === 1 ? "" : "s"} with checkmate rather than waiting for them to resign.`);
  if (agg.tookFree) wins.push(`You took ${agg.tookFree} free piece${agg.tookFree === 1 ? "" : "s"} that were sitting there.`);
  if (agg.savedPieces) wins.push(`You rescued ${agg.savedPieces} piece${agg.savedPieces === 1 ? "" : "s"} that were about to be lost.`);
  if (agg.clean) wins.push(`${agg.clean} of these games went by without you losing a piece outright.`);
  if (agg.comebacks) wins.push(`You came back from three points down to win ${agg.comebacks} of them.`);
  if (before && agg.givenPer < before.givenPer * 0.8) {
    wins.push(`You dropped fewer pieces than usual, ${agg.givenPer.toFixed(1)} a game against your normal ${before.givenPer.toFixed(1)}.`);
  }
  if (!wins.length) wins.push(`You got the games in. That is the part most people skip, and the numbers only mean something because you keep adding to them.`);

  // even better if
  const ebi = [];
  const lost = fresh.filter((g) => g.r === "loss");
  const wonGames = fresh.filter((g) => g.r === "win");
  const threwOne = lost.find((g) => (g.peak !== undefined ? g.peak : Math.max(...g.mat)) >= 3);
  if (threwOne) {
    ebi.push({
      title: "One you were winning",
      body: `Against ${threwOne.opp} you were ${threwOne.peak} points up and lost it. When you go clearly ahead, start trading pieces off rather than looking for something new. Fewer pieces on the board means fewer ways to go wrong.`,
      gameId: threwOne.id,
    });
  }
  const closeWin = wonGames.find((g) => (g.low !== undefined ? g.low : Math.min(...g.mat)) <= -2);
  if (closeWin) {
    ebi.push({
      title: "A win that was closer than it needed to be",
      body: `You won against ${closeWin.opp} but you were ${-closeWin.low} points down at one stage. Worth stepping through that one to find where it turned, because the same thing will happen again.`,
      gameId: closeWin.id,
    });
  }
  const worstMoment = agg.worst[0];
  if (worstMoment && ebi.length < 2) {
    ebi.push({
      title: "The one move worth revisiting",
      body: `Move ${worstMoment.mv} against ${worstMoment.g.opp}. ${worstMoment.k === "mm" ? "Mate was on the board." : worstMoment.k === "am" ? "It handed them mate." : worstMoment.k === "g" ? `Your ${NAMES[(worstMoment.pc || "p").toLowerCase()]} could be taken.` : "There was free material for you."}`,
      gameId: worstMoment.g.id, ply: worstMoment.p,
    });
  }

  const carry = agg.givenPer > agg.level.give[1] ? "Next session, before every move, look at what their last move now attacks."
    : agg.missedPer > agg.level.miss[1] ? "Next session, before you move, check which of their pieces nothing is defending."
      : agg.timeoutShare > 0.3 ? "Next session, play something longer. You are running out of time, not out of ideas."
        : "Next session, same again. It is working.";

  return { n: fresh.length, headline, w, d, l, wins: wins.slice(0, 3), ebi: ebi.slice(0, 2), carry, agg };
}

/* ============================================================
   15. FILTERS
   ============================================================ */

function applyFilter(games, f) {
  if (!f) return games;
  return games.filter((g) => {
    if (!f.bots && g.bot) return false;
    if (f.onlyBots && !g.bot) return false;
    if (f.minElo != null && (g.op || 0) < f.minElo) return false;
    if (f.maxElo != null && (g.op || 9999) > f.maxElo) return false;
    return true;
  });
}
</script>
<script>
/* ============================================================
   UI
   ============================================================ */

const LAST = "cc:last";
const keyFor = (n) => "cc:u:" + n.trim().toLowerCase();
const CAP = 400;

const S = {
  name: "", games: [], review: null, apiKey: "", synced: {}, plain: false, seenIntro: false,
  filter: { bots: true, onlyBots: false, minElo: null, maxElo: null }, theme: "light",
  tab: "home", page: null, view: null, ply: 0, ready: false, screen: "login",
  inspect: null, toast: null, busy: "", shown: 20, pick: null, pending: "", intro: 0,
  showBest: false, best: null, debrief: null,
  drills: null, di: 0, dFrom: null, dResult: null, dScore: { right: 0, done: 0 },
  compare: null, compareName: "",
  queue: [], qActive: null, qDone: 0, qTotal: 0, qProg: 0,
  gh: { owner: "", repo: "", path: "games.json", branch: "main", token: "" },
  showBestMove: false, reviewDepth: 160,
};
let W = null;
const replayCache = new Map();

const store = {
  async get(k) {
    if (window.storage) { try { const r = await window.storage.get(k); return r ? r.value : null; } catch { return null; } }
    try { return localStorage.getItem(k); } catch { return null; }
  },
  async set(k, v) {
    if (window.storage) { try { await window.storage.set(k, v); return true; } catch { return false; } }
    try { localStorage.setItem(k, v); return true; } catch { return false; }
  },
};
const tick = () => new Promise((r) => setTimeout(r, 0));

function applyTheme() {
  try {
    const dark = S.theme === "dark" ||
      (S.theme === "auto" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.dataset.theme = dark ? "dark" : "light";
  } catch {}
}

async function persist() {
  if (!S.name) return;
  const p = { name: S.name, games: S.games.slice(-CAP), review: S.review, apiKey: S.apiKey,
    synced: S.synced, plain: S.plain, seenIntro: S.seenIntro, filter: S.filter, theme: S.theme,
    gh: S.gh, reviewDepth: S.reviewDepth };
  let body = JSON.stringify(p);
  while (body.length > 4_000_000 && p.games.length > 20) {
    p.games = p.games.slice(Math.ceil(p.games.length * 0.2));
    body = JSON.stringify(p);
  }
  await store.set(keyFor(S.name), body);
  await store.set(LAST, S.name);
}

async function loadUser(name) {
  const raw = await store.get(keyFor(name));
  S.name = name.trim();
  S.games = []; S.review = null; S.synced = {}; S.apiKey = ""; S.plain = false; S.seenIntro = false;
  S.filter = { bots: true, onlyBots: false, minElo: null, maxElo: null };
  replayCache.clear();
  if (raw) {
    try {
      const d = JSON.parse(raw);
      S.games = d.games || []; S.review = d.review || null; S.apiKey = d.apiKey || "";
      S.synced = d.synced || {}; S.plain = !!d.plain; S.seenIntro = !!d.seenIntro;
      if (d.filter) S.filter = { ...S.filter, ...d.filter };
      if (d.theme) S.theme = d.theme;
      if (d.gh) S.gh = { ...S.gh, ...d.gh };
      if (d.reviewDepth) S.reviewDepth = d.reviewDepth;
      if (d.name) S.name = d.name;
    } catch {}
  }
  S.screen = S.seenIntro || S.games.length ? "app" : "intro";
  S.intro = 0; S.tab = "home"; S.page = null; S.view = null; S.shown = 20; S.drills = null;
  await store.set(LAST, S.name);
}

async function upgradeSaved() {
  const stale = S.games.filter((g) => (g.v || 1) < REC_VERSION && g.pgn);
  if (!stale.length) return;
  const out = [];
  for (let i = 0; i < S.games.length; i++) {
    const g = S.games[i];
    if ((g.v || 1) < REC_VERSION && g.pgn) {
      let r = null;
      try { r = buildRecord(g.pgn, S.name); } catch {}
      out.push(r || g);
    } else out.push(g);
    if (i % 5 === 0) { S.busy = `Looking again at your games, ${i} of ${S.games.length}`; render(); await tick(); }
  }
  S.games = out; S.busy = ""; await persist();
}

/* ============================================================
   THE ENGINE, IN A WORKER
   Grading a game is roughly eighty searches, so it runs off the
   main thread and one game at a time. Results are cached, so a
   game is only ever graded once.
   ============================================================ */
const REVIEW_LABELS = {
  brilliant: ["Brilliant", "a sacrifice that works", "brilliant"],
  great: ["Great", "the only move that held it", "great"],
  best: ["Best", "the top move", "best"],
  excellent: ["Excellent", "as good as the best", "best"],
  good: ["Good", "fine, just short of best", "good"],
  book: ["Book", "known opening move", "book"],
  inaccuracy: ["Inaccuracy", "a small slip", "inacc"],
  mistake: ["Mistake", "cost you real ground", "mistake"],
  miss: ["Missed win", "you were winning and let it go", "miss"],
  blunder: ["Blunder", "lost a piece or the game", "blunder"],
};

function startWorker() {
  if (W) return W;
  try {
    const src = document.getElementById("engsrc").textContent;
    W = new Worker(URL.createObjectURL(new Blob([src], { type: "application/javascript" })));
    W.onmessage = (e) => {
      const d = e.data;
      if (d.type === "progress") { S.qProg = Math.round((d.done / d.total) * 100); paintProgress(); }
      else if (d.type === "done") { onReviewed(d.id, d.rev); }
      else if (d.type === "error") { onReviewed(d.id, null); }
    };
    W.onerror = () => { S.qActive = null; };
  } catch { W = null; }
  return W;
}

function sansOf(g) {
  const body = (g.pgn || "").replace(/^(?:\[[^\]\n]*\]\s*)+/, "");
  return tokenizeMoves(body).map((t) => t.san);
}

function queueReview(ids) {
  const want = ids.filter((id) => {
    const g = S.games.find((x) => x.id === id);
    return g && !g.rev && g.pgn;
  });
  for (const id of want) if (!S.queue.includes(id)) S.queue.push(id);
  S.qTotal = S.queue.length + (S.qActive ? 1 : 0);
  S.qDone = 0;
  pumpQueue();
}

function pumpQueue() {
  if (S.qActive || !S.queue.length) { if (!S.queue.length && !S.qActive) render(); return; }
  if (!startWorker()) { S.toast = "This browser cannot run the engine in the background."; render(); return; }
  const id = S.queue.shift();
  const g = S.games.find((x) => x.id === id);
  if (!g) return pumpQueue();
  S.qActive = id; S.qProg = 0;
  W.postMessage({ type: "review", id, sans: sansOf(g),
    movetime: S.reviewDepth, rating: g.my || 700 });
  render();
}

async function onReviewed(id, rev) {
  const g = S.games.find((x) => x.id === id);
  if (g) g.rev = rev ? packReview(rev) : { failed: true };
  S.qActive = null; S.qDone++; S.qProg = 0;
  await persist();
  if (S.queue.length) pumpQueue(); else { S.qTotal = 0; render(); }
  if (S.view === id) render();
}

/* only what cannot be recomputed cheaply gets stored */
const WHY_LABELS = ["blunder", "mistake", "miss", "inaccuracy", "brilliant", "great"];
function packReview(rev) {
  return {
    a: [rev.accuracy.w == null ? null : +rev.accuracy.w.toFixed(1),
        rev.accuracy.b == null ? null : +rev.accuracy.b.toFixed(1)],
    c: rev.counts,
    m: rev.moves.map((m) => {
      const o = { l: m.label, o: m.lost, c: Math.max(-900, Math.min(900, m.c || m.cp)) };
      if (m.best) o.b = [m.best.from, m.best.to, m.best.san];
      if (WHY_LABELS.includes(m.label) && m.why) o.w = m.why;
      return o;
    }),
  };
}

const revOf = (g) => (g && g.rev && !g.rev.failed ? g.rev : null);
const reviewedCount = () => S.games.filter((g) => revOf(g)).length;

function paintProgress() {
  const el = document.getElementById("qbar");
  if (el) el.style.width = S.qProg + "%";
  const t = document.getElementById("qtxt");
  if (t) t.textContent = `Grading game ${S.qDone + 1} of ${S.qTotal}, ${S.qProg}%`;
}

/* ============================================================
   GITHUB SYNC
   The repo has to be public for free Pages, so anything pushed
   there is readable by anyone with the link.
   ============================================================ */
const b64 = (str) => btoa(unescape(encodeURIComponent(str)));
const unb64 = (str) => decodeURIComponent(escape(atob(str.replace(/\s/g, ""))));

function ghHeaders() {
  return { Authorization: `Bearer ${S.gh.token}`, Accept: "application/vnd.github+json",
    "X-GitHub-Api-Version": "2022-11-28", "Content-Type": "application/json" };
}
const ghUrl = () =>
  `https://api.github.com/repos/${S.gh.owner}/${S.gh.repo}/contents/${S.gh.path}`;

async function ghPush() {
  if (!S.gh.owner || !S.gh.repo || !S.gh.token) { S.toast = "Fill in the repo and token first."; render(); return; }
  S.busy = "Pushing to GitHub"; render();
  try {
    let sha = null;
    const head = await fetch(`${ghUrl()}?ref=${encodeURIComponent(S.gh.branch)}`, { headers: ghHeaders() });
    if (head.ok) sha = (await head.json()).sha;
    const payload = JSON.stringify({ name: S.name, saved: Date.now(), games: S.games });
    const res = await fetch(ghUrl(), {
      method: "PUT", headers: ghHeaders(),
      body: JSON.stringify({ message: `chess post mortem: ${S.games.length} games`,
        content: b64(payload), branch: S.gh.branch, ...(sha ? { sha } : {}) }),
    });
    if (!res.ok) throw new Error(`GitHub said ${res.status}`);
    S.toast = `Pushed ${S.games.length} games`;
  } catch (e) {
    S.toast = e.message.includes("401") || e.message.includes("403")
      ? "GitHub rejected the token. Check it has contents write on that repo."
      : `Push failed. ${e.message}`;
  }
  S.busy = ""; render();
  setTimeout(() => { S.toast = null; render(); }, 6000);
}

async function ghPull() {
  if (!S.gh.owner || !S.gh.repo) { S.toast = "Fill in the repo first."; render(); return; }
  S.busy = "Pulling from GitHub"; render();
  try {
    const h = S.gh.token ? ghHeaders() : { Accept: "application/vnd.github+json" };
    const res = await fetch(`${ghUrl()}?ref=${encodeURIComponent(S.gh.branch)}`, { headers: h });
    if (!res.ok) throw new Error(`GitHub said ${res.status}`);
    const data = JSON.parse(unb64((await res.json()).content));
    const have = new Set(S.games.map((g) => g.id));
    const add = (data.games || []).filter((g) => g && g.id && !have.has(g.id));
    S.games = [...S.games, ...add].sort((a, b) => a.d - b.d).slice(-CAP);
    await persist();
    S.toast = add.length ? `Brought back ${add.length} games` : "Nothing new there";
  } catch (e) {
    S.toast = `Pull failed. ${e.message}`;
  }
  S.busy = ""; render();
  setTimeout(() => { S.toast = null; render(); }, 6000);
}

const fmtS = (s) => (s == null ? "-" : s < 10 ? `${s.toFixed(1)}s` : `${Math.round(s)}s`);

function describe(m) {
  const piece = NAMES[(m.pc || "p").toLowerCase()];
  if (m.k === "mm") return `Mate was on the board. ${moveWords(m.at, m.sq, "q")} finished it.`;
  if (m.k === "am") return `This let them mate with ${moveWords(m.at, m.sq)}.${m.pun ? " They played it." : " They missed it."}`;

    : `Your ${piece} on ${sqName(m.sq)} could have been taken. They missed it.`;

}

/* the art sits in a 45 box, roughly 3 to 39 vertically, centred on x 22.5 */
const PS = 0.92 / 36;
const PDX = 0.5 - 22.5 * PS;
const PDY = 0.5 - 21 * PS;

function boardSVG(boardStr, flip, o = {}) {
  const disp = (i) => (flip ? [7 - fileOf(i), 7 - rankOf(i)] : [fileOf(i), rankOf(i)]);
  const am = o.inspect != null ? attackMap(boardStr.split("")) : null;
  let sq = "", hi = "", pc = "", mk = "", co = "", tap = "";

  for (let i = 0; i < 64; i++) {
    const [x, y] = disp(i);
    const dark = (fileOf(i) + rankOf(i)) % 2 === 1;
    sq += `<rect x="${x}" y="${y}" width="1" height="1" class="${dark ? "sd" : "sl"}"/>`;

    if (o.mark && (o.mark.from === i || o.mark.to === i)) hi += `<rect x="${x}" y="${y}" width="1" height="1" class="hlast"/>`;
    if (o.from === i || o.inspect === i) hi += `<rect x="${x}" y="${y}" width="1" height="1" class="hsel"/>`;

    const p = boardStr[i];
    if (p !== ".") {
      pc += `<g transform="translate(${(x + PDX).toFixed(4)} ${(y + PDY).toFixed(4)}) scale(${PS.toFixed(5)})"
        class="${isW(p) ? "pw" : "pb"}">${PIECE_PATHS[p.toLowerCase()]}</g>`;
    }

    if (o.targets && o.targets.includes(i)) {
      mk += p === "."
        ? `<circle cx="${x + 0.5}" cy="${y + 0.5}" r="0.16" class="tdot"/>`
        : `<rect x="${x + 0.05}" y="${y + 0.05}" width="0.9" height="0.9" class="tcap"/>`;
    }
    if (o.mark && o.mark.target === i) {
      mk += `<circle cx="${x + 0.5}" cy="${y + 0.5}" r="0.42" class="ring ${o.mark.tone || ""}"/>`;
    }
    if (am && o.inspect !== i && (am.w[o.inspect].includes(i) || am.b[o.inspect].includes(i))) {
      mk += `<circle cx="${x + 0.78}" cy="${y + 0.22}" r="0.11" class="adot ${isW(p) ? "aw" : "ab"}"/>`;
    }

    if (y === 7) co += `<text x="${x + 0.94}" y="${y + 0.94}" class="cr ${dark ? "cd" : "cl"}" text-anchor="end">${"abcdefgh"[fileOf(i)]}</text>`;
    if (x === 0) co += `<text x="${x + 0.06}" y="${y + 0.26}" class="cr ${dark ? "cd" : "cl"}">${8 - rankOf(i)}</text>`;

    tap += `<rect x="${x}" y="${y}" width="1" height="1" fill="none" pointer-events="all"
      data-a="${o.tap || "sq"}" data-i="${i}"/>`;
  }

  let ar = "";
  if (o.mark && o.mark.arrow) {
    const [a, b] = o.mark.arrow;
    const [ax, ay] = disp(a), [bx, by] = disp(b);
    const x1 = ax + 0.5, y1 = ay + 0.5, x2 = bx + 0.5, y2 = by + 0.5;
    const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy) || 1;
    const ex = x2 - (dx / len) * 0.34, ey = y2 - (dy / len) * 0.34;
    const tone = o.mark.tone || "";
    ar = `<defs><marker id="ah" markerWidth="3" markerHeight="3" refX="1.6" refY="1.5" orient="auto">
      <path d="M0,0 L0,3 L2.8,1.5 z" class="arh ${tone}"/></marker></defs>
      <line x1="${x1}" y1="${y1}" x2="${ex}" y2="${ey}" class="arw ${tone}" marker-end="url(#ah)"/>`;
  }

  return `<div class="boardbox"><svg viewBox="0 0 8 8" class="board" role="img">
    ${sq}${hi}${co}${pc}${mk}${ar}${tap}</svg></div>`;
}

function matBar(m) {
  const v = Math.max(-12, Math.min(12, m));
  return `<div class="matbar"><div class="mattrack"><b></b><i style="left:${((v + 12) / 24) * 100}%"></i></div>
    <div class="matlab"><span>them</span><span class="mono ${v > 0 ? "good" : v < 0 ? "bad" : "faint"}">
    ${v === 0 ? "level" : v > 0 ? `you +${v}` : `you ${v}`}</span><span>you</span></div></div>`;
}

/* ---------- small charts ---------- */
function lineChart(vals, labels, color) {
  if (vals.length < 2) return "";
  const W = 300, H = 84, pad = 4;
  const lo = Math.min(...vals), hi = Math.max(...vals), span = hi - lo || 1;
  const x = (i) => pad + (i / (vals.length - 1)) * (W - pad * 2);
  const y = (v) => H - pad - ((v - lo) / span) * (H - pad * 2);
  const pts = vals.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" class="chart">
    <polygon points="${pad},${H - pad} ${pts} ${W - pad},${H - pad}" fill="${color}" opacity=".08"/>
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2"
      stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>
    <div class="axis"><span>${esc(labels[0])}</span><span>${esc(labels[labels.length - 1])}</span></div>`;
}

function radar(areas, other) {
  const R = 74, C = 100;
  const pts = (vals) => vals.map((v, i) => {
    const a = (Math.PI * 2 * i) / vals.length - Math.PI / 2;
    const r = (Math.max(v == null ? 0 : v, 4) / 100) * R;
    return `${(C + Math.cos(a) * r).toFixed(1)},${(C + Math.sin(a) * r).toFixed(1)}`;
  }).join(" ");
  const grid = [33, 66, 100].map((p) =>
    `<polygon points="${pts(areas.map(() => p))}" fill="none" stroke="#e6dfd1"/>`).join("");
  const lab = areas.map((a, i) => {
    const ang = (Math.PI * 2 * i) / areas.length - Math.PI / 2;
    const x = C + Math.cos(ang) * (R + 17), y = C + Math.sin(ang) * (R + 14);
    const an = Math.abs(Math.cos(ang)) < 0.3 ? "middle" : Math.cos(ang) > 0 ? "start" : "end";
    return `<text x="${x.toFixed(0)}" y="${y.toFixed(0)}" text-anchor="${an}" font-size="9" fill="#736b5e">${esc(a.label)}</text>`;
  }).join("");
  return `<svg viewBox="0 0 200 200" class="radar">${grid}
    ${other ? `<polygon points="${pts(other.map((a) => a.v))}" fill="none" stroke="#b47617" stroke-width="2" stroke-dasharray="4 3"/>` : ""}
    <polygon points="${pts(areas.map((a) => a.v))}" fill="#1f6f5c" fill-opacity=".2" stroke="#1f6f5c" stroke-width="2"/>
    ${lab}</svg>`;
}

function strip(matIn, marks) {
  const step = Math.max(1, Math.ceil(matIn.length / 48));
  const mat = step === 1 ? matIn : matIn.filter((_, i) => i % step === 0);
  const sc = 1 / step, n = mat.length || 1, H = 24;
  const bars = mat.map((v, i) => {
    const c = Math.max(-9, Math.min(9, v));
    const hh = (Math.abs(c) / 9) * (H / 2 - 2);
    return `<rect x="${i}" width="1" y="${(c >= 0 ? H / 2 - hh : H / 2).toFixed(2)}"
      height="${Math.max(hh, 0.001).toFixed(2)}" fill="${c >= 0 ? "#8bbfae" : "#d99e94"}"/>`;
  }).join("");
  return `<svg viewBox="0 0 ${n} ${H}" preserveAspectRatio="none" class="strip">
    <line x1="0" y1="${H / 2}" x2="${n}" y2="${H / 2}" stroke="#e6dfd1" vector-effect="non-scaling-stroke"/>
    ${bars}${marks.map((m) => `<rect x="${(m * sc).toFixed(2)}" width="1.4" y="0" height="4" fill="#b0392b"/>`).join("")}</svg>`;
}

/* ---------- sync and import ---------- */
async function fetchGamesFor(user, months) {
  const r = await fetch(`https://api.chess.com/pub/player/${encodeURIComponent(user.toLowerCase())}/games/archives`);
  if (r.status === 404) throw new Error(`No chess.com account called ${user}`);
  if (!r.ok) throw new Error(`chess.com replied ${r.status}`);
  const archives = (await r.json()).archives || [];
  if (!archives.length) throw new Error("That account has no finished games");
  let text = "";
  const want = archives.slice(-months);
  for (let i = 0; i < want.length; i++) {
    S.busy = `Month ${i + 1} of ${want.length}`; render();
    const rr = await fetch(want[i] + "/pgn");
    if (rr.ok) { text += (await rr.text()) + "\n\n"; S.synced[want[i].slice(-7)] = Date.now(); }
  }
  if (!text.trim()) throw new Error("blocked");
  return text;
}

async function syncChessCom(months) {
  S.busy = "Asking chess.com"; render();
  try { await importText(await fetchGamesFor(S.name, months)); return true; }
  catch (e) {
    S.busy = "";
    S.toast = /No chess\.com/.test(e.message) ? e.message
      : "chess.com would not hand them over from here. Add games works instead.";
    render(); setTimeout(() => { S.toast = null; render(); }, 6000);
    return false;
  }
}

async function importText(raw, forcedName) {
  S.busy = "Reading"; render(); await tick();
  const chunks = splitPGN(raw);
  let who = (forcedName || S.name).trim();
  if (!who) {
    const d = detectName(chunks);
    if (d.name) who = d.name;
    else { S.pick = d.options; S.pending = raw; S.busy = ""; render(); return; }
  }
  const have = new Set(S.games.map((g) => g.id));
  const todo = [];
  let dupes = 0, notMine = 0, bad = 0;
  for (const c of chunks) {
    const t = parseTags(c);
    const lo = who.toLowerCase();
    if ((t.White || "").toLowerCase() !== lo && (t.Black || "").toLowerCase() !== lo) { notMine++; continue; }
    const id = t.Link || `${t.White}-${t.Black}-${t.UTCDate || t.Date}-${t.UTCTime || ""}`;
    if (have.has(id)) { dupes++; continue; }
    todo.push(c);
  }
  const fresh = [];
  for (let i = 0; i < todo.length; i++) {
    if (i % 4 === 0) { S.busy = `Game ${i} of ${todo.length}`; render(); await tick(); }
    let rec = null;
    try { rec = buildRecord(todo[i], who); } catch {}
    if (!rec) { bad++; continue; }
    if (have.has(rec.id)) { dupes++; continue; }
    have.add(rec.id); fresh.push(rec);
  }
  S.games = [...S.games, ...fresh].sort((a, b) => a.d - b.d).slice(-CAP);
  S.pick = null; S.pending = ""; S.busy = ""; S.drills = null;
  await persist();
  if (fresh.length) {
    queueReview(fresh.map((g) => g.id));
    S.debrief = debriefFor(fresh, S.games);
    S.page = "debrief"; S.tab = "home"; S.view = null;
  } else {
    S.toast = chunks.length
      ? `Nothing new. ${dupes} already saved${notMine ? `, ${notMine} not yours` : ""}${bad ? `, ${bad} unreadable` : ""}`
      : "No games in that file";
    setTimeout(() => { S.toast = null; render(); }, 5000);
  }
  render();
}

    <div class="between"><div><div class="num ${m.level}">${esc(m.value)}</div>
      <div class="tiny">${esc(m.unit)}</div></div>
      <span class="chip ${m.level === "fix" ? "bad" : m.level}">${
        m.level === "fix" ? "room here" : m.level === "watch" ? "middling" : "good"}</span></div>
    <div class="h3">${esc(m.title)}</div><p class="nm">${esc(m.plain)}</p>
    <div class="tiny">${esc(m.target)}</div></div>`).join("")}
  ${agg.trend.length >= 2 ? `<div class="card"><div class="kick">Pieces given away per game</div>
    ${lineChart(agg.trend.map((t) => t.given), agg.trend.map((t) => t.label), "#b0392b")}</div>` : ""}
  <div class="tiny pad">Targets move with your rating.</div>`;
}

function screenMoments(agg) {
  const list = [...agg.worst.slice(0, 8).map((m) => ({ ...m, bad: true })),
    ...agg.goodMoments.slice(0, 6).map((m) => ({ ...m, bad: false }))];
  return `<p class="pagelead">The moves worth seeing again, good and bad.</p>
  ${list.map((m) => `<button class="card list" data-a="open" data-id="${esc(m.g.id)}" data-ply="${m.p}">
    <div class="between"><span class="mono acc">${m.mv}. ${esc(mv(m.s))}</span>
      <span class="chip ${m.bad ? (m.k === "mm" || m.k === "am" ? "purple" : "bad") : "good"}">
      ${esc(m.bad ? KINDNAME[m.k] : GOODNAME[m.k])}</span></div>
    <p class="nm">${m.bad ? describe(m) : esc(m.note)}</p>
    <div class="tiny">${new Date(m.g.d).toLocaleDateString()} vs ${esc(m.g.opp)}</div></button>`).join("")}`;
}

/* ---------- games ---------- */
function screenGames(agg) {
  const list = shown().slice().reverse();
  const page = list.slice(0, S.shown);
  const f = S.filter;
  const bands = [["all", null, null], ["below you", null, (agg.rating || 800) - 25],
    ["near you", (agg.rating || 800) - 100, (agg.rating || 800) + 100],
    ["above you", (agg.rating || 800) + 25, null]];
  const active = (lo, hi) => f.minElo === lo && f.maxElo === hi;
  return `
  <div class="filters">
    <div class="frow">
      <button class="fchip ${!f.onlyBots && f.bots ? "on" : ""}" data-a="fb" data-v="all">everything</button>
      <button class="fchip ${!f.bots ? "on" : ""}" data-a="fb" data-v="people">people only</button>
      <button class="fchip ${f.onlyBots ? "on" : ""}" data-a="fb" data-v="bots">bots only</button>
    </div>
    <div class="frow">
      ${bands.map(([l, lo, hi]) => `<button class="fchip ${active(lo, hi) ? "on" : ""}"
        data-a="fe" data-lo="${lo == null ? "" : lo}" data-hi="${hi == null ? "" : hi}">${l}</button>`).join("")}
    </div>
  </div>
  <div class="tiny pad">${list.length} of ${S.games.length} games${agg.bots ? `, ${agg.bots} against bots` : ""}</div>
  ${page.map((g) => {
    const bad = g.mis.filter((m) => (m.k === "g" && m.pun) || m.k === "am" || m.k === "mm");
    const st = gameStory(g);
    return `<button class="card list" data-a="open" data-id="${esc(g.id)}" data-ply="0">
      <div class="between">
        <span class="chip ${g.r === "win" ? "good" : g.r === "loss" ? "bad" : "watch"}">${g.r}</span>
        <span class="tiny nm">${g.bot ? "bot · " : ""}${new Date(g.d).toLocaleDateString()}</span></div>
      ${strip(g.mat, bad.map((m) => m.p))}
      ${st ? `<p class="nm story">${esc(st)}</p>` : ""}
      <div class="tiny">${g.c === "w" ? "White" : "Black"} vs ${esc(g.opp)}${g.op ? ` (${g.op})` : ""} · ${esc(g.end)}</div>
    </button>`;
  }).join("")}
  ${list.length > page.length ? `<button class="btn wide" data-a="more">Show more</button>` : ""}`;
}

/* ---------- practice ---------- */
function screenPractice() {
  if (!S.drills) return `<div class="card"><div class="h3">Practice</div>
    <p class="nm">Real positions from your own games, at the moment something slipped.</p>
    <button class="btn pri wide" data-a="makedrills">Build my drills</button></div>`;
  if (!S.drills.length) return `<div class="card"><div class="h3">Nothing to drill yet</div>
    <p class="nm">Add a few more games and the positions will show up.</p></div>`;
  const d = S.drills[Math.min(S.di, S.drills.length - 1)];
  const st = { board: d.board.split(""), turn: d.color, castling: "KQkq", ep: null };
  const targets = S.dFrom != null ? allLegalMoves(st).filter((m) => m.from === S.dFrom).map((m) => m.to) : [];
  const r = S.dResult;
  const mark = r && r.reveal ? { arrow: [r.reveal.from, r.reveal.to], target: r.reveal.to, tone: "green" } : null;
  return `
  <div class="between drillhead">
    <div><div class="h3">${esc(drillPrompt(d))}</div>
      <div class="tiny nm">You are ${d.color === "w" ? "white" : "black"}</div></div>
    <span class="chip good">${S.dScore.right}/${S.dScore.done}</span></div>
  ${boardSVG(d.board, d.color === "b", { from: S.dFrom, targets, mark, tap: "dsq" })}
  ${r ? `<div class="card ${r.ok ? "win" : "flagcard"}">
      <div class="h3">${r.ok ? "Right" : "Not that one"}</div>
      <p class="nm">${esc(r.why)}</p>
      ${r.reveal ? `<p class="nm">The move was ${esc(mv(r.reveal.san))}.</p>` : ""}
      <div class="row">${!r.ok && !r.reveal ? `<button class="btn" data-a="dreveal">Show me</button>` : ""}
        <button class="btn pri grow" data-a="dnext">${S.di >= S.drills.length - 1 ? "Finish" : "Next"}</button></div></div>`
    : `<div class="tiny mid">Tap a piece, then where it goes.
      ${S.dFrom != null ? `<button class="lnk" data-a="dclear">reset</button>` : ""}</div>
      <button class="btn wide" data-a="dskip">Skip</button>`}
  <div class="tiny mid">${Math.min(S.di + 1, S.drills.length)} of ${S.drills.length}</div>`;
}

const GLOSSARY = [
  ["Hanging", "A piece that can be captured with nothing defending it."],
  ["Material", "Your pieces counted in points. Pawn 1, knight and bishop 3, rook 5, queen 9."],
  ["Development", "Getting knights and bishops off the back row."],
  ["Castling", "The move where king and rook swap places to tuck the king away."],
  ["Blunder", "A move that loses material or the game."],
  ["Mate in one", "A single move that ends the game."],
  ["Fork", "One piece attacking two things at once."],
  ["Notation", "Nf3 means knight to f3. x is takes, + is check, # is checkmate."],
];
