/* ---------- viewer ---------- */
function screenViewer() {
  const g = S.games.find((x) => x.id === S.view);
  if (!g) return `<div class="card">Game not found.</div>`;
  let rep = replayCache.get(g.id);
  if (!rep) { rep = replay(g.pgn, S.name); if (rep) replayCache.set(g.id, rep); }
  if (!rep) return `<div class="card">Could not rebuild this game.</div>`;
  const plies = rep.plies;
  const i = Math.max(0, Math.min(S.ply, plies.length - 1));
  const p = plies[i];
  const m = g.mis.find((x) => x.p === i);
  const gd = (g.good || []).find((x) => x.p === i);
  const stops = [...g.mis.map((x) => x.p), ...(g.good || []).map((x) => x.p)].sort((a, b) => a - b);
  const prev = [...stops].reverse().find((x) => x < i);
  const next = stops.find((x) => x > i);
  const before = i > 0 ? plies[i - 1].board : START;

  const rev = revOf(g);
  const rm = rev ? rev.m[i] : null;
  let boardStr = p.board;
  let mark = { from: p.from, to: p.to };
  if (m) mark = { target: m.sq, arrow: [m.at, m.sq], from: p.from, to: p.to,
    tone: m.k === "mm" || m.k === "am" ? "purple" : m.k === "m" ? "green" : "" };
  else if (gd && gd.sq != null) mark = { target: gd.sq, from: p.from, to: p.to, tone: "green" };
  if (S.showBestMove && rm && rm.b) {
    boardStr = before;
    mark = { arrow: [rm.b[0], rm.b[1]], target: rm.b[1], tone: "green" };
  } else if (S.showBest && S.best) {
    boardStr = before; mark = { arrow: [S.best.from, S.best.to], target: S.best.to, tone: "green" };
  }

  const why = m ? whyFor(m, plies) : [];
  return `
  <div class="between vhead">
    <button class="btn sm" data-a="back">Back</button>
    <span class="chip ${g.r === "win" ? "good" : g.r === "loss" ? "bad" : "watch"}">${g.r}${g.bot ? " vs bot" : ""}</span></div>
  <div class="vtitle"><div class="h3">${g.c === "w" ? "White" : "Black"} vs ${esc(g.opp)}</div>
    <div class="tiny nm">${new Date(g.d).toLocaleDateString()} · ${esc(g.o)} · ${esc(g.end)}</div></div>
  ${rev ? accuracyPanel(g, rev) : S.qActive === g.id
    ? `<div class="card"><div class="kick">Grading this game</div>
        <div class="qtrack"><i id="qbar" style="width:${S.qProg}%"></i></div>
        <div class="tiny" id="qtxt">Working through the moves, ${S.qProg}%</div></div>`
    : `<div class="card"><div class="kick">Not graded yet</div>
        <p class="nm">Every move gets a grade, what you should have played, and why.</p>
        <button class="btn pri wide" data-a="revone" data-id="${esc(g.id)}">Grade this game</button></div>`}
  ${boardSVG(boardStr, g.c === "b", { mark, inspect: S.inspect })}
  ${matBar(S.showBest ? (i > 0 ? plies[i - 1].mat : 0) : p.mat)}
  <div class="ctrls">
    <button class="btn" data-a="ply" data-d="-1">‹</button>
    <button class="btn" data-a="jump" data-p="${prev === undefined ? "" : prev}" ${prev === undefined ? "disabled" : ""}>Prev</button>
    <button class="btn ${next !== undefined ? "pri" : ""}" data-a="jump" data-p="${next === undefined ? "" : next}" ${next === undefined ? "disabled" : ""}>Next</button>
    <button class="btn" data-a="ply" data-d="1">›</button></div>
  <div class="movelist">${plies.map((q, k) => {
    const r2 = rev ? rev.m[k] : null;
    const cls = r2 ? "gr-" + REVIEW_LABELS[r2.l][2]
      : g.mis.some((x) => x.p === k) ? "flag" : (g.good || []).some((x) => x.p === k) ? "goodm" : "";
    return `<button class="mvb ${k === i ? "on" : ""} ${cls}"
      data-a="jump" data-p="${k}">${q.mine === (g.c === "w") ? `${q.moveNo}.` : ""}${esc(q.san)}</button>`;
  }).join("")}</div>

  <div class="card ${m ? "flagcard" : gd ? "win" : ""}">
    <div class="mono">${p.moveNo}${p.mine === (g.c === "w") ? "." : "..."} ${esc(mv(p.san))}
      <span class="faint">${p.mine && p.spent != null ? ` ${fmtS(p.spent)}` : ""}</span></div>
    ${rm ? `<div class="graderow">
      <span class="grade ${REVIEW_LABELS[rm.l][2]}">${REVIEW_LABELS[rm.l][0]}</span>
      <span class="tiny nm">${esc(REVIEW_LABELS[rm.l][1])}${rm.o > 0.5 ? `, cost ${rm.o}% of your winning chances` : ""}</span>
    </div>
    ${rm.w ? `<ul class="why">${rm.w.map((w) => `<li>${esc(w)}</li>`).join("")}</ul>` : ""}
    ${rm.b && rm.l !== "best" && rm.l !== "book" ? `<button class="btn ${S.showBestMove ? "pri" : ""} wide"
      data-a="showbest">${S.showBestMove ? "Back to your move" : `Show ${esc(mv(rm.b[2]))} instead`}</button>` : ""}` : ""}
    ${m ? `<p class="nm">${describe(m)}</p>
      ${why.length ? `<ul class="why">${why.map((w) => `<li>${esc(w)}</li>`).join("")}</ul>` : ""}` : ""}
    ${gd ? `<p class="nm">${esc(gd.note)}</p>` : ""}
    ${!m && !gd && !rm ? `<div class="tiny">Nothing loose here.</div>` : ""}
    ${p.mine && !rm ? `<button class="btn ${S.showBest ? "pri" : ""} wide" data-a="best" data-i="${i}">
      ${S.showBest ? "Back to the game" : "What wins here?"}</button>` : ""}
    ${S.showBest && S.best ? `<div class="bestbox">
      <div class="h3">${S.best.mate ? "Mate" : S.best.gain > 0 ? `Wins ${S.best.gain} points` : "Nothing wins material"}</div>
      <p class="nm">${esc(mv(S.best.san))}, from the position before your move.</p>
      <div class="tiny">Found by counting material a few moves deep. It sees free pieces, forks and
      mate, not plans.</div></div>` : ""}
  </div>
  ${S.inspect != null ? inspectNote(boardStr, S.inspect, g.c) : `<div class="tiny mid">Tap a square to see what is aiming at it.</div>`}`;
}

function accuracyPanel(g, rev) {
  const mine = g.c === "w" ? rev.a[0] : rev.a[1];
  const theirs = g.c === "w" ? rev.a[1] : rev.a[0];
  const counts = (g.c === "w" ? rev.c.w : rev.c.b) || {};
  const order = ["brilliant", "great", "best", "excellent", "good", "book", "inaccuracy", "mistake", "miss", "blunder"];
  return `<div class="card accpanel">
    <div class="accrow">
      <div class="accbox"><div class="accnum">${mine == null ? "-" : mine.toFixed(1)}<i>%</i></div>
        <div class="kick">you</div></div>
      <div class="accsplit"></div>
      <div class="accbox"><div class="accnum them">${theirs == null ? "-" : theirs.toFixed(1)}<i>%</i></div>
        <div class="kick">${esc(g.opp)}</div></div>
    </div>
    ${evalGraph(rev, g.c === "b")}
    <div class="gradecounts">${order.filter((k) => counts[k]).map((k) =>
      `<span class="gc"><i class="gd ${REVIEW_LABELS[k][2]}"></i>${counts[k]} ${esc(REVIEW_LABELS[k][0].toLowerCase())}</span>`).join("")}</div>
    <div class="tiny">Accuracy uses the win chance formulas Lichess publishes. Grades come from the
    engine built into this app, not Stockfish, so a borderline move may be graded a step differently
    elsewhere. Blunders and missed wins will agree.</div>
  </div>`;
}

function evalGraph(rev, flip) {
  const n = rev.m.length;
  if (n < 2) return "";
  const H = 56, W = Math.max(n, 2);
  const cap = 600;
  const y = (cp) => {
    const v = Math.max(-cap, Math.min(cap, (flip ? -cp : cp) || 0));
    return H / 2 - (v / cap) * (H / 2 - 2);
  };
  let path = `0,${H / 2}`;
  rev.m.forEach((m, k) => { path += ` ${k},${y(m.c).toFixed(1)}`; });
  path += ` ${n - 1},${H / 2}`;
  const dots = rev.m.map((m, k) => {
    const tone = REVIEW_LABELS[m.l][2];
    if (!["blunder", "mistake", "miss", "brilliant", "great"].includes(m.l)) return "";
    return `<circle cx="${k}" cy="${y(m.c).toFixed(1)}" r="1.6" class="gd ${tone}"/>`;
  }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" class="evalgraph">
    <rect x="0" y="0" width="${W}" height="${H / 2}" class="evtop"/>
    <rect x="0" y="${H / 2}" width="${W}" height="${H / 2}" class="evbot"/>
    <polyline points="${path}" class="evline" vector-effect="non-scaling-stroke"/>
    ${dots}</svg>
    <div class="axis"><span>opening</span><span>the game</span><span>end</span></div>`;
}

function inspectNote(b, i, my) {
  const am = attackMap(b.split(""));
  const mine = am[my][i].length, theirs = am[my === "w" ? "b" : "w"][i].length;
  const p = b[i];
  return `<div class="inspect"><b>${sqName(i)}</b> ${p === "." ? "empty" :
    `${colorOf(p) === my ? "your" : "their"} ${NAMES[p.toLowerCase()]}`}.
    Yours: ${mine}. Theirs: ${theirs}.
    <button class="lnk" data-a="clearsq">clear</button></div>`;
}

function screenEmpty() {
  const now = new Date();
  const url = `api.chess.com/pub/player/${S.name || "you"}/games/${now.getFullYear()}/${String(now.getMonth() + 1).padStart(2, "0")}/pgn`;
  return `<div class="card"><div class="h3">Get your games in</div>
    <p class="nm">Worked out on your phone, kept on your phone.</p>
    <button class="btn pri wide" data-a="sync6">Pull from chess.com</button>
    <button class="btn wide" data-a="file">Add a PGN file</button></div>
  <div class="card"><div class="kick">If the pull is blocked</div>
    <p class="nm">Open this in your browser and the file downloads on its own.</p>
    <div class="url mono">${esc(url)}</div>
    <textarea id="paste" placeholder="or paste PGN text here"></textarea>
    <button class="btn wide" data-a="paste">Add pasted games</button></div>`;
}

/* ---------- review ---------- */
function briefFor(agg) {
  const sp = styleProfile(agg);
  return {
    gamesReviewed: agg.n, rating: agg.rating, ratingBand: agg.level.label,
    record: { wins: agg.all.w, draws: agg.all.d, losses: agg.all.l },
    sixAreaScores: areaScores(agg).map((a) => `${a.label}: ${a.v == null ? "not enough data" : a.v + "/100"}`),
    whatIsGoingWell: strengths(agg).slice(0, 5).map((s) => `${s.label}: ${s.detail}`),
    goodMovesFound: { matesDelivered: agg.matesDelivered, freeMaterialTaken: agg.tookFree, piecesRescued: agg.savedPieces },
    reachedWinningPosition: agg.wasWinning, convertedThoseToWins: agg.converted,
    lostAfterBeingWinning: agg.threwAway, wonAfterBeingThreeDown: agg.comebacks,
    gamesWithNoPiecesDropped: agg.clean,
    piecesGivenAwayPerGame: +agg.givenPer.toFixed(2),
    benchmarkForThisRating: `under ${agg.level.give[0]} good, over ${agg.level.give[1]} high`,
    freeMaterialMissedPerGame: +agg.missedPer.toFixed(2),
    mateInOneMissed: agg.missedMates, mateInOneAllowed: agg.allowedMates,
    lossesOnTheClockPct: Math.round(agg.timeoutShare * 100),
    castledPct: Math.round(agg.castledShare * 100),
    piecesStillHomeAtMoveTwelve: +agg.homeAt12.toFixed(1),
    styleClosestTo: sp.best.name, mistakesByPhase: agg.byPhase, howLossesEnd: agg.endings,
    openings: agg.openingList.filter((o) => o.n >= 3).slice(0, 8)
      .map((o) => ({ name: o.name, games: o.n, scorePct: Math.round(o.score * 100) })),
    monthlyTrend: agg.trend,
    momentsWorthReplaying: agg.worst.slice(0, 10).map((m) => ({
      move: `${m.mv}. ${m.s}`, what: KINDNAME[m.k], square: sqName(m.sq), points: m.l,
      opponentTookIt: m.pun, phase: m.ph, opening: m.g.o })),
  };
}

const PROMPT = (b) =>
`You are a good coach going through a player's own games with them. Write to them directly, like someone sitting next to them.

The data comes from a static analyser plus a small material-only search, not a full engine. It sees pieces that could be captured, free material not taken, and mate in one both ways. It cannot see pins, plans or anything deep. Never invent engine evaluations or opening theory the data does not support. If the data cannot answer something, say so.

Read the rating band first. What is sloppy at 1800 is normal at 400. If the numbers are good for their level, say so plainly instead of hunting for faults.

DATA
${JSON.stringify(b, null, 2)}

Write about 400 words with these headings on their own lines:

WHAT YOU ARE DOING WELL
Two or three sentences, specific and earned from the data.

THE PATTERN WORTH SEEING
The one thing that would change their results most, and why it costs them.

TWO THINGS TO TRY
Two, each with a short heading on its own line, something concrete to do and why it works.

Voice: plain English, contractions, second person, warm and level. No em dashes, no markdown, no asterisks, no flattery, no filler. Vary sentence length.`;

function screenReview(agg) {
  const hosted = !window.storage;
  return `<div class="card"><div class="h3">The long version</div>
    <p class="nm">Everything in the app written up properly, including what is going well.</p>
    ${hosted && !S.apiKey ? `<button class="btn pri wide" data-a="copybrief">Copy it for Claude</button>
      <div class="tiny">Paste into Claude and it writes the review.</div>
      <button class="lnk" data-a="keyprompt">Or add your own API key</button>`
    : `<button class="btn pri wide" data-a="review" ${S.busy ? "disabled" : ""}>
        ${S.busy ? "Reading" : S.review ? "Write a fresh one" : "Write my review"}</button>`}
  </div>
  ${S.review ? `<div class="card coach">${esc(S.review.text)}</div>` : ""}`;
}

/* ============================================================
   RENDER
   ============================================================ */
const PAGE_TITLES = { numbers: "Your numbers", todo: "What to do", moments: "Moments",
  areas: "Six areas", openings: "Openings", compare: "Compare", standing: "Where you stand",
  settings: "Settings", review: "Written review", debrief: "Debrief" };

function render() {
  const app = document.getElementById("app");
  if (!S.ready) { app.innerHTML = `<div class="w"><p class="tiny pad">Loading</p></div>`; return; }
  if (S.screen === "login") { app.innerHTML = `<div class="w">${screenLogin()}</div>`; return; }
  if (S.screen === "intro") { app.innerHTML = `<div class="w">${screenIntro()}</div>`; return; }

  const games = shown();
  const agg = games.length ? aggregate(games) : (S.games.length ? aggregate(S.games) : null);
  let body, title = null;

  if (S.view) body = screenViewer();
  else if (!S.games.length) body = screenEmpty();
  else if (S.page) {
    title = PAGE_TITLES[S.page] || "";
    body = S.page === "numbers" ? screenNumbers(agg) : S.page === "todo" ? screenTodo(agg)
      : S.page === "moments" ? screenMoments(agg) : S.page === "areas" ? screenAreas(agg)
      : S.page === "openings" ? screenOpenings(agg) : S.page === "compare" ? screenCompare()
      : S.page === "standing" ? screenStanding(agg) : S.page === "settings" ? screenSettings()
      : S.page === "review" ? screenReview(agg) : S.page === "debrief" ? screenDebrief()
      : screenHome(agg);
  }
  else if (S.tab === "home") body = screenHome(agg);
  else if (S.tab === "games") body = screenGames(agg);
  else if (S.tab === "practice") body = screenPractice();
  else body = screenYou(agg);

  const tabs = [["home", "\u25CE", "Home"], ["games", "\u25A4", "Games"],
    ["practice", "\u2694", "Practice"], ["you", "\u2657", "You"]];
  const hideNav = S.view || (S.page && S.page !== "");
  const key = `${S.screen}|${S.tab}|${S.page || ""}|${S.view || ""}`;
  const enter = key !== S._key;
  S._key = key;

  app.innerHTML = `
    <header><div class="hbar">
      ${title ? `<button class="btn sm" data-a="page" data-p="">Back</button><div class="htitle">${esc(title)}</div><div class="hspace"></div>`
      : `<div><h1>${S.tab === "home" ? "Post mortem" : S.tab === "games" ? "Games" : S.tab === "practice" ? "Practice" : "You"}</h1>
          <div class="hsub">${esc(S.name)}${S.games.length ? ` / ${S.games.length} games` : ""}</div></div>
        <div class="hbtns">
          ${S.games.length ? `<button class="btn sm" data-a="sync2" ${S.busy ? "disabled" : ""}>Refresh</button>` : ""}
          <button class="btn pri sm" data-a="file" ${S.busy ? "disabled" : ""}>Add</button></div>`}
    </div><span class="checker thin"></span></header>
    ${S.busy ? `<div class="w"><div class="working"><span class="dot"></span>${esc(S.busy)}</div></div>` : ""}
    ${S.pick ? `<div class="w"><div class="card warn"><div class="h3">Which player are you?</div>
      <div class="pills">${S.pick.map((o) => `<button class="btn pri sm" data-a="setname" data-n="${esc(o)}">${esc(o)}</button>`).join("")}</div></div></div>` : ""}
    <main class="w${enter ? " enter" : ""}">${body}</main>
    ${S.toast ? `<div class="toast">${esc(S.toast)}</div>` : ""}
    ${S.games.length && !hideNav ? `<nav class="nav">${tabs.map(([k, g, l]) =>
      `<button data-a="tab" data-t="${k}" class="${S.tab === k ? "on" : ""}"><span class="g">${g}</span>${l}</button>`).join("")}</nav>` : ""}`;
}

/* ============================================================
   EVENTS
   ============================================================ */
document.addEventListener("click", async (e) => {
  const el = e.target.closest("[data-a]");
  if (!el) return;
  const a = el.dataset.a;

  if (a === "login") {
    const v = (document.getElementById("user") || {}).value || "";
    if (!v.trim()) return;
    await loadUser(v); applyTheme(); render(); await upgradeSaved(); render();
    if (S.screen === "app" && !S.games.length) syncChessCom(6);
  }
  else if (a === "intronext") {
    if (S.intro < INTRO.length - 1) { S.intro++; render(); }
    else { S.seenIntro = true; S.screen = "app"; await persist(); render(); syncChessCom(6); }
  }
  else if (a === "introback") { S.intro--; render(); }
  else if (a === "introskip") { S.seenIntro = true; S.screen = "app"; await persist(); render(); }
  else if (a === "signout") { S.screen = "login"; S.view = null; S.games = []; S.name = ""; await store.set(LAST, ""); render(); }
  else if (a === "file") document.getElementById("file").click();
  else if (a === "sync6") syncChessCom(6);
  else if (a === "sync2") syncChessCom(2);
  else if (a === "tab") { S.tab = el.dataset.t; S.page = null; S.view = null; S.inspect = null; S.showBest = false; render(); scrollTo(0, 0); }
  else if (a === "page") { S.page = el.dataset.p || null; S.view = null; render(); scrollTo(0, 0); }
  else if (a === "open") { S.view = el.dataset.id; S.ply = +(el.dataset.ply || 0); S.inspect = null; S.showBest = false; S.best = null; render(); scrollTo(0, 0); }
  else if (a === "back") { S.view = null; S.inspect = null; S.showBest = false; render(); }
  else if (a === "ply") { S.ply += +el.dataset.d; S.showBest = false; S.showBestMove = false; S.best = null; render(); }
  else if (a === "jump") { if (el.dataset.p === "") return; S.ply = +el.dataset.p; S.showBest = false; S.showBestMove = false; S.best = null; render(); }
  else if (a === "sq") { const i = +el.dataset.i; S.inspect = S.inspect === i ? null : i; render(); }
  else if (a === "clearsq") { S.inspect = null; render(); }
  else if (a === "more") { S.shown += 20; render(); }
  else if (a === "plain") { S.plain = !S.plain; await persist(); render(); }
  else if (a === "theme") { S.theme = el.dataset.v; applyTheme(); await persist(); render(); }
  else if (a === "rdepth") { S.reviewDepth = +el.dataset.v; await persist(); render(); }
  else if (a === "revall") { queueReview(shown().map((g) => g.id)); }
  else if (a === "revone") { queueReview([el.dataset.id]); }
  else if (a === "revreset") {
    for (const g of S.games) delete g.rev;
    await persist(); queueReview(S.games.map((g) => g.id));
  }
  else if (a === "showbest") { S.showBestMove = !S.showBestMove; render(); }
  else if (a === "ghsave") {
    const v = (id) => (document.getElementById(id) || {}).value || "";
    S.gh = { owner: v("ghowner").trim(), repo: v("ghrepo").trim(),
      path: v("ghpath").trim() || "games.json", branch: S.gh.branch, token: v("ghtoken").trim() };
    await persist();
    S.toast = "Saved on this device"; render();
    setTimeout(() => { S.toast = null; render(); }, 4000);
  }
  else if (a === "ghpush") ghPush();
  else if (a === "ghpull") ghPull();
  else if (a === "paste") { const t = document.getElementById("paste"); if (t && t.value.trim()) importText(t.value); }
  else if (a === "setname") importText(S.pending, el.dataset.n);
  else if (a === "fb") {
    const v = el.dataset.v;
    S.filter.bots = v !== "people"; S.filter.onlyBots = v === "bots";
    S.drills = null; await persist(); render();
  }
  else if (a === "fe") {
    S.filter.minElo = el.dataset.lo === "" ? null : +el.dataset.lo;
    S.filter.maxElo = el.dataset.hi === "" ? null : +el.dataset.hi;
    await persist(); render();
  }
  else if (a === "best") {
    if (S.showBest) { S.showBest = false; S.best = null; render(); return; }
    const g = S.games.find((x) => x.id === S.view);
    const rep = replayCache.get(g.id) || replay(g.pgn, S.name);
    replayCache.set(g.id, rep);
    const i = +el.dataset.i;
    const before = i > 0 ? rep.plies[i - 1].board : START;
    S.busy = "Working it out"; render(); await tick();
    S.best = bestMove({ board: before.split(""), turn: rep.color, castling: "KQkq", ep: null }, 4);
    S.busy = ""; S.showBest = true; S.inspect = null; render();
  }
  else if (a === "makedrills") {
    S.busy = "Picking positions"; render(); await tick();
    S.drills = buildDrills(shown(), S.name, 12, replayCache);
    S.di = 0; S.dFrom = null; S.dResult = null; S.dScore = { right: 0, done: 0 };
    S.busy = ""; render();
  }
  else if (a === "dsq") {
    if (S.dResult) return;
    const i = +el.dataset.i, d = S.drills[S.di];
    const st = { board: d.board.split(""), turn: d.color, castling: "KQkq", ep: null };
    if (S.dFrom == null) {
      if (st.board[i] !== "." && colorOf(st.board[i]) === d.color) { S.dFrom = i; render(); }
      return;
    }
    if (i === S.dFrom) { S.dFrom = null; render(); return; }
    const legal = allLegalMoves(st).find((m) => m.from === S.dFrom && m.to === i);
    if (!legal) {
      if (st.board[i] !== "." && colorOf(st.board[i]) === d.color) { S.dFrom = i; render(); }
      return;
    }
    S.busy = "Checking"; render(); await tick();
    const r = judgeDrill(d, S.dFrom, i, legal.promo);
    S.dScore.done++; if (r.ok) S.dScore.right++;
    S.dResult = r; S.dFrom = null; S.busy = ""; render();
  }
  else if (a === "dclear") { S.dFrom = null; render(); }
  else if (a === "dreveal") {
    const d = S.drills[S.di];
    S.busy = "Working it out"; render(); await tick();
    S.dResult = { ...S.dResult, reveal: bestMove({ board: d.board.split(""), turn: d.color, castling: "KQkq", ep: null }, 3) };
    S.busy = ""; render();
  }
  else if (a === "dskip") { S.di = (S.di + 1) % S.drills.length; S.dFrom = null; S.dResult = null; render(); }
  else if (a === "dnext") {
    S.di++; S.dFrom = null; S.dResult = null;
    if (S.di >= S.drills.length) { S.di = 0; S.toast = `Done. ${S.dScore.right} of ${S.dScore.done}.`; }
    render();
    if (S.toast) setTimeout(() => { S.toast = null; render(); }, 5000);
  }
  else if (a === "cmpuser") {
    const v = (document.getElementById("cmp") || {}).value || "";
    if (!v.trim()) return;
    S.compareName = v.trim(); S.busy = `Fetching ${S.compareName}`; render();
    try {
      const text = await fetchGamesFor(S.compareName, 3);
      const recs = splitPGN(text).map((c) => { try { return buildRecord(c, S.compareName); } catch { return null; } })
        .filter(Boolean).slice(-60);
      if (!recs.length) throw new Error("no games");
      S.compare = { label: S.compareName, agg: aggregate(recs) };
      S.busy = ""; S.page = "areas"; render();
    } catch (err) {
      S.busy = "";
      S.toast = /No chess\.com/.test(err.message) ? err.message : "Could not fetch that player from here.";
      render(); setTimeout(() => { S.toast = null; render(); }, 6000);
    }
  }
  else if (a === "cmpself") {
    S.compare = { label: "your earlier games", agg: aggregate(S.games.slice(0, Math.floor(S.games.length / 2))) };
    S.page = "areas"; render();
  }
  else if (a === "cmpclear") { S.compare = null; render(); }
  else if (a === "keyprompt") {
    const k = prompt("Anthropic API key, stored on this device only.", S.apiKey || "");
    if (k !== null) { S.apiKey = k.trim(); await persist(); render(); }
  }
  else if (a === "copybrief") {
    try { await navigator.clipboard.writeText(PROMPT(briefFor(aggregate(shown())))); S.toast = "Copied."; }
    catch { S.toast = "Could not copy."; }
    render(); setTimeout(() => { S.toast = null; render(); }, 5000);
  }
  else if (a === "review") {
    S.busy = "Reading your games"; render();
    try {
      const h = { "Content-Type": "application/json" };
      if (S.apiKey) { h["x-api-key"] = S.apiKey; h["anthropic-version"] = "2023-06-01"; h["anthropic-dangerous-direct-browser-access"] = "true"; }
      const agg = aggregate(shown());
      const res = await fetch("https://api.anthropic.com/v1/messages", { method: "POST", headers: h,
        body: JSON.stringify({ model: "claude-sonnet-4-6", max_tokens: 1400,
          messages: [{ role: "user", content: PROMPT(briefFor(agg)) }] }) });
      const data = await res.json();
      const out = (data.content || []).filter((b) => b.type === "text").map((b) => b.text).join("\n").trim();
      if (!out) throw new Error("empty");
      S.review = { text: out, when: Date.now(), games: agg.n };
      await persist();
    } catch { S.toast = "That did not come back."; }
    S.busy = ""; render();
  }
});

document.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && document.getElementById("user") === document.activeElement) {
    document.querySelector('[data-a="login"]')?.click();
  }
  if (!S.view) return;
  if (e.key === "ArrowRight") { S.ply++; S.showBest = false; render(); }
  if (e.key === "ArrowLeft") { S.ply--; S.showBest = false; render(); }
});

document.addEventListener("change", async (e) => {
  if (e.target.id !== "file") return;
  const files = [...e.target.files];
  e.target.value = "";
  if (!files.length) return;
  let all = "";
  for (const f of files) all += (await f.text()) + "\n\n";
  importText(all);
});

let tx = null;
document.addEventListener("touchstart", (e) => {
  if (e.target.closest(".board") && S.view) tx = e.touches[0].clientX;
}, { passive: true });
document.addEventListener("touchend", (e) => {
  if (tx == null) return;
  const dx = e.changedTouches[0].clientX - tx;
  tx = null;
  if (Math.abs(dx) > 45 && S.view) { S.ply += dx < 0 ? 1 : -1; S.inspect = null; S.showBest = false; render(); }
}, { passive: true });

(async () => {
  if ("serviceWorker" in navigator && location.protocol === "https:") {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  }
  const last = await store.get(LAST);
  if (last && last.trim()) await loadUser(last);
  applyTheme();
  try {
    window.matchMedia("(prefers-color-scheme: dark)")
      .addEventListener("change", () => { if (S.theme === "auto") applyTheme(); });
  } catch {}
  S.ready = true;
  render();
  if (S.games.length) { await upgradeSaved(); render(); }
})();
</script>
